name: Deploy natural 4695 portfolio page

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-pages-4695-natural.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out committed Hugo output
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify natural 4695 output
        shell: bash
        run: |
          set -euo pipefail
          KO='posts/battery-4695-production-transition/index.html'
          EN='en/posts/battery-4695-production-transition/index.html'
          SVG='images/projects/battery-4695-production-transition-flow.svg'
          test -s "$KO"
          test -s "$EN"
          test -s "$SVG"
          grep -Fq '4695 배터리 조립라인 주요 설비 정상화 및 제한 생산 체제 구축' "$KO"
          grep -Fq '설비 점검 결과' "$KO"
          grep -Fq 'AI Vision 종류 및 역할' "$KO"
          grep -Fq 'X-Ray 검사' "$KO"
          grep -Fq '설비 설계·프로그램 결함 및 생산 대응' "$KO"
          grep -Fq '제한 생산 체제 승인' "$KO"
          grep -Fq '4695 Battery Assembly-Line Equipment Stabilization and Limited-Production Setup' "$EN"
          grep -Fq 'AI-vision types and functions' "$EN"
          grep -Fq 'X-ray inspection' "$EN"
          if grep -Eqi '생산을 시작하기 전에 다시 맞춘 기준|전체 설비를 다시 확인한 순서|내가 맡은 업무와 협업부서|4M와 측정항목으로 나눈 원인|내부 Beam 유입 확인|X-Ray와 비전검사|비전검사 5곳의 최종 운영방법|자동운전 준비조건과 측정방법|영구개조가 남은 설비|회사 내부 관리값|공개하지 않았|완료하지 못했|검증하지 않았' "$KO"; then
            echo 'Old 4695 wording remains' >&2
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  cleanup:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Remove one-off workflow
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/deploy-pages-4695-natural.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy-pages-4695-natural.yml
          git commit -m 'chore(ci): remove one-off 4695 Pages workflow'
          git push origin HEAD:main
