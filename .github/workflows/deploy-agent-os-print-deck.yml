name: Deploy Agent OS page and 12-page 5Why print deck

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-agent-os-print-deck.yml'

permissions:
  contents: write

concurrency:
  group: portfolio-public-write
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out public repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact deployment base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '302bc782cbf26b88206d6608387c56106f305841'

      - name: Download exact validated Hugo artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-609c-81f6-a722-5efd53a79cd8/raw?se=2026-08-10T10%3A33%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=9b600812-482a-5e17-a5a5-fc31700cb0d0&skoid=bbd22fc4-f881-4ea4-b2f3-c12033cf6a8b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-09T12%3A37%3A39Z&ske=2026-08-10T12%3A37%3A39Z&sks=b&skv=2026-02-06&sig=R%2B%2BLG%2Bxgu0Bv8fY7BqJKqTWTey0dSkbUb5oXnfX8h9M%3D' -o /tmp/portfolio-public.zip
          echo '8b48151c9e492e9731997592994eb71702e170f29a4556319077496299b8690d  /tmp/portfolio-public.zip' | sha256sum -c -
          rm -rf /tmp/portfolio-public
          mkdir -p /tmp/portfolio-public
          unzip -q /tmp/portfolio-public.zip -d /tmp/portfolio-public

      - name: Verify Agent OS and print-deck artifact
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('/tmp/portfolio-public')
          checks = {
              root / 'posts/ai-authority-evidence-plane/index.html': [
                  'Agent OS — 근거·승인·검증으로 AI 작업을 통제하는 개인 운영체제',
                  'im-not-ai로 구현한 첫 Application Plane',
                  'agent-os-evidence-workflow.svg',
              ],
              root / 'en/posts/ai-authority-evidence-plane/index.html': [
                  'Agent OS — Governing AI Work Through Evidence, Approval, and Verification',
                  'The first implemented Application Plane: im-not-ai',
                  'agent-os-evidence-workflow.svg',
              ],
              root / 'print/featured-projects-ko/index.html': [
                  '1 / 12', '12 / 12', '2170 수율 안정화 — 5Why',
                  'NCM 각형 Pilot Line 안정화 — 5Why', 'AMAT Qual 승인 — 5Why',
                  '자동차 공장 Digital Twin — 5Why', '저사양 PC용 LLM WIKI — 5Why',
                  '용접 결함 감지 Vision 모델 — 5Why', 'window.print()'
              ],
          }
          for path, values in checks.items():
              text = path.read_text(encoding='utf-8')
              for value in values:
                  assert value in text, (path, value)

          assert (root / 'images/projects/agent-os-evidence-workflow.svg').is_file()
          scripts = list((root / 'scripts').glob('portfolio-print.min.*.js'))
          assert len(scripts) == 1, scripts
          script = scripts[0].read_text(encoding='utf-8')
          assert '/print/featured-projects-ko/?autoprint=1' in script
          print('Agent OS + 12-page print deck artifact verification: PASS')
          PY

      - name: Publish exact validated output
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='.*' /tmp/portfolio-public/ ./
          touch .nojekyll
          rm -f .github/workflows/deploy-agent-os-print-deck.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No public output changes were produced.' >&2
            exit 1
          fi
          git commit -m 'deploy(portfolio): publish Agent OS and 5Why print deck'
          git push origin HEAD:main
