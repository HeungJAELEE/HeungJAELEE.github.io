name: Deploy practical YMC technical qualification case

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-ymc-qual-practical.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out triggering public commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify deployment base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'b74400f3063f15f0daa0eb21aec87253197b16d2'

      - name: Download validated Hugo artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-a368-8206-882b-78449709e4f3/raw?se=2026-08-09T14%3A04%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=cb41e75d-6f66-56c4-975d-54b83a2248e2&skoid=3e273c3d-5ea1-4088-9e18-79685531b184&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-08T21%3A33%3A58Z&ske=2026-08-09T21%3A33%3A58Z&sks=b&skv=2026-02-06&sig=0UZr%2Bm1B%2Bi1la9eT5RWzrEi5/Bgu8RBFmUWqlttWV74%3D' -o /tmp/portfolio-public.zip
          echo '7f8ebe452e2687d1ad5f5dda0810eca0f0f1a496ec5dc916f18cc0856cba2949  /tmp/portfolio-public.zip' | sha256sum -c -
          rm -rf /tmp/portfolio-public
          mkdir -p /tmp/portfolio-public
          unzip -q /tmp/portfolio-public.zip -d /tmp/portfolio-public

      - name: Verify practical YMC qualification output
        shell: bash
        run: |
          set -euo pipefail
          KO='/tmp/portfolio-public/posts/amat-akt-qual/index.html'
          EN='/tmp/portfolio-public/en/posts/amat-akt-qual/index.html'
          HUB_KO='/tmp/portfolio-public/posts/wet-process-standardization/index.html'
          HUB_EN='/tmp/portfolio-public/en/posts/wet-process-standardization/index.html'
          test -s "$KO"
          test -s "$EN"
          test -s "$HUB_KO"
          test -s "$HUB_EN"

          for phrase in \
            '글로벌 디스플레이 장비사 CVD·PECVD 부품 기술 Qual 획득' \
            '영문 Spec을 Process·Run Sheet로 전환' \
            '대응 Sample 제작과 제조 Capability 검증' \
            'Hi-Pot 측정 산포 원인 분석과 지적사항 Closure' \
            'Sample당 <strong>7회 반복측정</strong>' \
            '<strong>3회 재시험</strong>' \
            '기술실사 내전압 지적사항 <strong>1건을 Closure</strong>' \
            '약 1년간 후속 납품'; do
            grep -Fq "$phrase" "$KO"
          done

          for phrase in \
            'Technical Qualification of CVD and PECVD Components for a Global Display-Equipment Maker' \
            'Convert English specifications into Process and Run Sheets' \
            'Build counterpart samples and demonstrate manufacturing capability' \
            'Analyze Hi-Pot variation and close the audit finding' \
            '<strong>seven repeated measurements per sample</strong>' \
            '<strong>three retests</strong>' \
            'single technical-audit finding' \
            'about one year of follow-on supply'; do
            grep -Fq "$phrase" "$EN"
          done

          grep -Fq '지적 1건 Closure·기술 Qual·약 1년 후속 납품' "$HUB_KO"
          grep -Fq 'One finding closed, technical qualification, and about one year of follow-on supply' "$HUB_EN"

          ! grep -Eqi '기존 페이지의|같은 Sample이 아니라|기술 결과와 사업 결과를 나눴습니다|계약체결은 회사 영업결과|개인 성과로 사용하지 않습니다|기술 Qual과 회사의 계약·수익성 결과' "$KO"
          ! grep -Eqi 'The earlier page described|Counterpart samples.not the same physical sample|Technical and business outcomes|Contracting was a company sales result|not presented as my individual achievement' "$EN"

      - name: Publish validated output
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='.*' /tmp/portfolio-public/ ./
          touch .nojekyll
          rm -f .github/workflows/deploy-ymc-qual-practical.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No public output changes were produced.' >&2
            exit 1
          fi
          git commit -m 'deploy(portfolio): publish practical YMC qualification case'
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '/tmp/portfolio-public'

  deploy:
    needs: publish-and-verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
