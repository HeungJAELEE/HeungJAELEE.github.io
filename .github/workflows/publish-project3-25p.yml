name: Publish 25P LFP manufacturing refactor

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-project3-25p.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out committed site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated Hugo artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-93d0-81f7-ab33-7c4d85cfdaaa/raw?se=2026-08-08T08%3A14%3A51Z&sp=r&sv=2026-02-06&sr=b&scid=f7317bfd-fc67-5e53-93fa-c1732d3cc7ed&skoid=732f244e-db13-47c3-bcc7-7ee02a9397bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-08T02%3A54%3A10Z&ske=2026-08-09T02%3A54%3A10Z&sks=b&skv=2026-02-06&sig=BJrSoO3y1sb5O%2BvATwEk1UuPYmJ6wRgm2C9Lg0In%2B90%3D' \
            --output /tmp/portfolio-public.zip
          echo 'ace8fe416140a91dfc32eff5d3bd5ce50a9bbe8573b42a70f4985a99f817aa83  /tmp/portfolio-public.zip' | sha256sum --check
          rm -rf /tmp/site
          mkdir -p /tmp/site
          unzip -q /tmp/portfolio-public.zip -d /tmp/site

      - name: Verify 25P page and manufacturing regressions
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/site/posts/battery-25p-lfp-development/index.html
          test -s /tmp/site/en/posts/battery-25p-lfp-development/index.html
          test -s /tmp/site/images/projects/25p-lfp-development-gate.svg
          test -s /tmp/site/posts/battery-2170-pilot/index.html
          test -s /tmp/site/posts/battery-4695-production-transition/index.html
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class TextParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
              def handle_data(self, data):
                  self.parts.append(data)

          def text(path):
              parser = TextParser()
              parser.feed(Path(path).read_text(encoding='utf-8'))
              return ' '.join(' '.join(parser.parts).split())

          ko = text('/tmp/site/posts/battery-25p-lfp-development/index.html')
          en = text('/tmp/site/en/posts/battery-25p-lfp-development/index.html')
          required_ko = [
              '25P LFP Power Cell 공정조건 개발 및 시양산 검증',
              '프로젝트 SOW', '프로젝트 WBS', '공통 4M+2E 위험판정',
              'LFP 전해액 함침조건', '다층 Clad Tab 저항용접',
              'Turn 수 변경에 따른 X-Ray 판정조건',
              'Embo·반사율 변경에 따른 Vision 판정',
              'Beading·CCR·Crimping 조립치수와 밀봉조건',
              '약 20,000 Cell', '약 6 mm에서 약 1.5 mm',
              '4 Batch', '개발 Gate 판정', '검증 범위',
          ]
          required_en = [
              '25P LFP Power Cell Process Development and Trial-Production Validation',
              'Project SOW', 'Project WBS',
              'Project-level 4M+2E risk disposition',
              'about 20,000 cells', 'about 6 mm to about 1.5 mm',
          ]
          missing_ko = [value for value in required_ko if value not in ko]
          missing_en = [value for value in required_en if value not in en]
          if missing_ko or missing_en:
              raise SystemExit(f'missing KO={missing_ko}, EN={missing_en}')
          for label, body in [('KO', ko), ('EN', en)]:
              if '96.8%' in body or '75%' in body or 'IATF' in body.upper():
                  raise SystemExit(f'{label}: prohibited 25P claim leaked into deployment')
          PY

      - name: Synchronize and commit generated site
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/' /tmp/site/ ./
          rm -f .github/workflows/publish-project3-25p.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No generated-site changes were produced.' >&2
            exit 1
          fi
          git commit -m 'deploy(portfolio): publish 25P LFP manufacturing refactor'
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '/tmp/site'

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
