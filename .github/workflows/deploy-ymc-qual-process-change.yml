name: Deploy YMC qualification with DMAIC and process-level 4M

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-ymc-qual-process-change.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out triggering public commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify deployment base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '31ad6ff5e9c6a758e1ef9c77b534ff72c38622b8'

      - name: Download validated Hugo artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-fc2c-8209-9137-fa18d64e16b9/raw?se=2026-08-09T14%3A29%3A07Z&sp=r&sv=2026-02-06&sr=b&scid=051833f4-7e89-5834-9887-f07b88777ad7&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-08T23%3A52%3A30Z&ske=2026-08-09T23%3A52%3A30Z&sks=b&skv=2026-02-06&sig=WNPm4fxOe20wZyRkQ5KuXETPAVQoQkasTfbTws4xOnM%3D' -o /tmp/portfolio-public.zip
          echo '2c7e70a6a694068d8bd47fe4176415b9e0fc7e5dbf98be76032e512f92245c45  /tmp/portfolio-public.zip' | sha256sum -c -
          rm -rf /tmp/portfolio-public
          mkdir -p /tmp/portfolio-public
          unzip -q /tmp/portfolio-public.zip -d /tmp/portfolio-public

      - name: Verify YMC process-change output
        shell: bash
        run: |
          set -euo pipefail
          KO='/tmp/portfolio-public/posts/amat-akt-qual/index.html'
          EN='/tmp/portfolio-public/en/posts/amat-akt-qual/index.html'
          test -s "$KO"
          test -s "$EN"

          for phrase in \
            '글로벌 디스플레이 장비사 CVD·PECVD 부품 공정 재구성 및 기술 Qual 획득' \
            '기존 공정에서 무엇이 문제였는가' \
            'Six Sigma GB 기반 DMAIC 적용 순서' \
            '공정별 변경점과 4M+Measurement' \
            'Etching·전처리' \
            'Bead Blast' \
            '수산계 Anodizing' \
            '7회 반복측정' \
            '3회 재시험' \
            '기술실사 지적사항'; do
            grep -Fq "$phrase" "$KO"
          done

          for phrase in \
            'CVD and PECVD Component Process Reconfiguration and Technical Qualification' \
            'What was wrong with the existing process' \
            'Six Sigma Green Belt-based DMAIC sequence' \
            'Process-level changes and 4M+Measurement' \
            'Etching and pretreatment' \
            'Bead blasting' \
            'Oxalic-acid anodizing' \
            'seven repeated readings per sample' \
            'three retests' \
            'one technical-audit finding'; do
            grep -Fq "$phrase" "$EN"
          done

          if grep -Eqi '같은 Sample이 아니라|기술 결과와 사업 결과|개인 성과로 사용하지|Counterpart samples.not the same physical sample|Technical and business outcomes|not presented as my individual achievement' "$KO" "$EN"; then
            echo 'Old defensive YMC wording remains in deployment artifact' >&2
            exit 1
          fi

      - name: Publish validated output
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='.*' /tmp/portfolio-public/ ./
          touch .nojekyll
          rm -f .github/workflows/deploy-ymc-qual-process-change.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No public output changes were produced.' >&2
            exit 1
          fi
          git commit -m 'deploy(portfolio): publish YMC DMAIC and process-level 4M case'
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '/tmp/portfolio-public'

  deploy:
    needs: publish-and-verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
