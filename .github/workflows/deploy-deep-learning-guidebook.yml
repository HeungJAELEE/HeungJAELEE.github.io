name: Deploy manufacturing AI modeling guidebook

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-deep-learning-guidebook.yml'

permissions:
  contents: write

concurrency:
  group: portfolio-public-write
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out public repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact deployment base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '92f9d6c297405b8fe48b72fcb879a27a37dcc089'

      - name: Download validated Hugo artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://sdmntprcentralindia.oaiusercontent.com/files/00000000-4860-8208-80ea-f860d66afe1a/raw?se=2026-08-10T01%3A34%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=b7876c95-dc11-5df5-bef8-5ea0fdfbdc14&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-10T00%3A03%3A17Z&ske=2026-08-11T00%3A03%3A17Z&sks=b&skv=2026-02-06&sig=JyCWoJhuEQs90n78P1ocYkFSf5pumowUB4n/Lvhfzjo%3D' -o /tmp/portfolio-public.zip
          echo '10adcfba851623694b121b3e043cfd17d6db22dbca278d858aa99ace7ae35ed7  /tmp/portfolio-public.zip' | sha256sum -c -
          rm -rf /tmp/portfolio-public
          mkdir -p /tmp/portfolio-public
          unzip -q /tmp/portfolio-public.zip -d /tmp/portfolio-public

      - name: Verify manufacturing AI guidebook artifact
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          required = {
              Path('/tmp/portfolio-public/posts/deep-learning-modeling/index.html'): [
                  '제조 현장 맞춤형 AI 모델링·도입 가이드북 구축',
                  'GitHub 연구 아카이브 구조',
                  '현재 코드로 연결한 제조 AI Skeleton',
                  '제조 AI 5단계 Safety Gate',
                  'Product·Lot·Time Split',
                  'Accuracy보다 오류구조',
                  'Shadow Test·Rollback',
                  '실행형 표준 Template로 전환할 구조',
                  'deep-learning-manufacturing-ai-gates.svg',
              ],
              Path('/tmp/portfolio-public/en/posts/deep-learning-modeling/index.html'): [
                  'Manufacturing-Focused AI Modeling and Adoption Guidebook',
                  'GitHub research-archive structure',
                  'Manufacturing-AI skeleton connected in code',
                  'Five manufacturing-AI safety gates',
                  'Product, Lot, and Time split',
                  'error structure before accuracy',
                  'shadow test and rollback',
                  'Target executable template',
                  'deep-learning-manufacturing-ai-gates.svg',
              ],
          }
          forbidden = [
              '딥러닝 모델을 배우며 정리한 학습 기록',
              'Deep Learning Model Study Log',
              '현재 근거',
              '실행·재현·모델성능을 주장하지 않음',
              'Current evidence',
              'No execution, reproduction, or model-performance claim',
          ]
          for path, phrases in required.items():
              assert path.is_file() and path.stat().st_size > 0, path
              text = path.read_text(encoding='utf-8')
              for phrase in phrases:
                  assert phrase in text, f'{path}: {phrase}'
              for phrase in forbidden:
                  assert phrase not in text, f'{path}: {phrase}'
          svg = Path('/tmp/portfolio-public/images/projects/deep-learning-manufacturing-ai-gates.svg')
          assert svg.is_file() and svg.stat().st_size > 0, svg
          print('Manufacturing AI guidebook artifact verification: PASS')
          PY

      - name: Publish validated output
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='.*' /tmp/portfolio-public/ ./
          touch .nojekyll
          rm -f .github/workflows/deploy-deep-learning-guidebook.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No public output changes were produced.' >&2
            exit 1
          fi
          git commit -m 'deploy(portfolio): publish manufacturing AI modeling guidebook'
          git push origin HEAD:main
