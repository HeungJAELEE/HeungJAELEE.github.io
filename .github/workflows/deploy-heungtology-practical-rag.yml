name: Deploy practical HeungTology manufacturing RAG

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-heungtology-practical-rag.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out public repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify deployment base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '1e1503b1cf9d6950487f4204044fbecd4516a40a'

      - name: Download validated Hugo artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-9acc-8211-8b97-b7e460b9af1e/raw?se=2026-08-10T00%3A16%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=82c68907-5d9a-59f2-bcb2-efd8754949e1&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-10T00%3A00%3A25Z&ske=2026-08-11T00%3A00%3A25Z&sks=b&skv=2026-02-06&sig=lRjk9geLtUE0%2Bbz%2B8HqGP3ErGKpaUyC0RPW/LNl/T7M%3D' -o /tmp/portfolio-public.zip
          echo '0329df5e340835f24d644dae48bd740a76ad6ead0bcc4364f10dcd2771af5c27  /tmp/portfolio-public.zip' | sha256sum -c -
          rm -rf /tmp/portfolio-public
          mkdir -p /tmp/portfolio-public
          unzip -q /tmp/portfolio-public.zip -d /tmp/portfolio-public

      - name: Verify practical HeungTology output
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          checks = {
              'posts/ontology-construction/index.html': [
                  '전통 제조기업을 위한 실용적 RAG 지식 검색 시스템 (HeungTology)',
                  'AS-IS / TO-BE',
                  'Data Standardization',
                  'Incremental Sync',
                  'Reranking',
                  '현재 실행구조와 Cost-Aware 확장',
                  'Local GPU',
                  'External API Adapter',
                  '현재 구현 결과',
                  '다음 Engineering Gate',
                  'heungtology-rag-pipeline.svg',
              ],
              'en/posts/ontology-construction/index.html': [
                  'Practical RAG Knowledge Retrieval for Traditional Manufacturers (HeungTology)',
                  'AS-IS / TO-BE',
                  'Data standardization',
                  'Incremental sync',
                  'Search and reranking',
                  'Current runtime and cost-aware extension',
                  'Local GPU',
                  'External API adapter',
                  'Current implementation result',
                  'Next engineering gates',
                  'heungtology-rag-pipeline.svg',
              ],
          }
          for rel, phrases in checks.items():
              path = Path('/tmp/portfolio-public') / rel
              assert path.is_file() and path.stat().st_size > 0, path
              text = path.read_text(encoding='utf-8')
              for phrase in phrases:
                  assert phrase in text, f'{rel}: {phrase}'

          merged = '\n'.join((Path('/tmp/portfolio-public') / rel).read_text(encoding='utf-8') for rel in checks)
          for phrase in [
              'Sovereign Industrial Intelligence Fabric',
              'Zero Hallucination',
              '3,177개 노드',
              '0.05초',
              'Google API',
              'Gemini API',
              '외부 LLM API를 연동하여 임베딩',
              '고가의 하드웨어 없이도',
          ]:
              assert phrase not in merged, phrase
          print('Practical HeungTology public artifact: PASS')
          PY

      - name: Publish validated output
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='.*' /tmp/portfolio-public/ ./
          touch .nojekyll
          rm -f .github/workflows/deploy-heungtology-practical-rag.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No public output changes were produced.' >&2
            exit 1
          fi
          git commit -m 'deploy(portfolio): publish practical HeungTology RAG case'
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '/tmp/portfolio-public'

  deploy:
    needs: publish-and-verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
