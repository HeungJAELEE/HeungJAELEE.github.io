name: Deploy validated 4695 portfolio artifact

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-4695-artifact.yml'

permissions:
  contents: write

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out public repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download validated Hugo artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-a724-8209-9e4c-466ec39a01fb/raw?se=2026-08-09T01%3A45%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=b9e36e18-7e16-5f4d-b5bf-0c2cba9c8bd8&skoid=9063adf3-a524-4acf-b70a-8731b33f2f50&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-09T00%3A11%3A40Z&ske=2026-08-10T00%3A11%3A40Z&sks=b&skv=2026-02-06&sig=g5N/ftvOl83Dt/ZvQX6m6hiTQz%2BPuETCHfAiSEkqZlo%3D' -o /tmp/portfolio-public.zip
          echo '6374b18f24d538064cd217bd9869877a34bb7a3af69b410d188a4870ce342b63  /tmp/portfolio-public.zip' | sha256sum -c -
          rm -rf /tmp/portfolio-public
          mkdir -p /tmp/portfolio-public
          unzip -q /tmp/portfolio-public.zip -d /tmp/portfolio-public

      - name: Verify 4695 rendered pages
        shell: bash
        run: |
          set -euo pipefail
          KO='/tmp/portfolio-public/posts/battery-4695-production-transition/index.html'
          EN='/tmp/portfolio-public/en/posts/battery-4695-production-transition/index.html'
          test -s "$KO"
          test -s "$EN"
          grep -Fq '작업표준·QCP·P-FMEA' "$KO"
          grep -Fq 'V3·V4에는 자동검사를 적용했습니다' "$KO"
          grep -Fq '최종 생산범위를 검토·승인했습니다' "$KO"
          if grep -Fq '자표준' "$KO"; then
            echo 'Korean typo remains in rendered output' >&2
            exit 1
          fi
          grep -Fq 'End-of-employment condition' "$EN"
          grep -Fq 'Automatic inspection was applied at V3 and V4' "$EN"
          grep -Fq 'reviewed and approved the final production scope' "$EN"

      - name: Synchronize validated site and commit
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='.*' /tmp/portfolio-public/ ./
          touch .nojekyll
          rm -f .github/workflows/deploy-4695-artifact.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No public output changes were produced.' >&2
            exit 1
          fi
          git commit -m 'deploy(portfolio): publish finalized 4695 manufacturing copy'
          git push origin HEAD:main
