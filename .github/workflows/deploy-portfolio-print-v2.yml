name: Deploy validated A4 print v2 portfolio

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-portfolio-print-v2.yml'

permissions:
  contents: write

concurrency:
  group: portfolio-public-write
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out public repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact deployment base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'de95716637d445b0999df965b0eb177aa5ebc9f7'

      - name: Download exact validated Hugo artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-c6f8-81f7-b33f-76e00e683b55/raw?se=2026-08-10T06%3A11%3A10Z&sp=r&sv=2026-02-06&sr=b&scid=542c38cd-99a6-5066-bf98-baf709144ac8&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-10T01%3A13%3A45Z&ske=2026-08-11T01%3A13%3A45Z&sks=b&skv=2026-02-06&sig=pcQc%2B/c26YQLxReh71Hw50bVuUYBu5ngSETPilvbGR4%3D' -o /tmp/portfolio-public.zip
          echo '17b04d78f66b76dd4cbb7052fbebadd94ff213839c00b23608b11161c4b3b35d  /tmp/portfolio-public.zip' | sha256sum -c -
          rm -rf /tmp/portfolio-public
          mkdir -p /tmp/portfolio-public
          unzip -q /tmp/portfolio-public.zip -d /tmp/portfolio-public

      - name: Verify print v2 artifact
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('/tmp/portfolio-public')
          pages = [root / 'index.html', root / 'en/index.html', root / 'posts/battery-2170-pilot/index.html']
          for page in pages:
              text = page.read_text(encoding='utf-8')
              assert 'portfolio-print-v2' in text, page
              assert 'portfolio-print' in text, page
          ko = (root / 'index.html').read_text(encoding='utf-8')
          en = (root / 'en/index.html').read_text(encoding='utf-8')
          assert 'data-featured-project-count=6' in ko
          assert 'data-featured-project-count=6' in en
          assert '용접 결함 감지 Vision 모델' in ko
          assert 'Weld Defect Detection Vision Model' in en

          scripts = list((root / 'scripts').glob('portfolio-print.min.*.js'))
          styles = list((root / 'styles').glob('portfolio-print-v2.min.*.css'))
          assert len(scripts) == 1, scripts
          assert len(styles) == 1, styles
          script = scripts[0].read_text(encoding='utf-8')
          style = styles[0].read_text(encoding='utf-8')
          for required in ['buildHomePrintDocument', 'portfolio-print-ready', 'portfolio-print-project-sheet']:
              assert required in script, required
          for required in ['portfolio-print-sheet', 'portfolio-print-cover', 'table-header-group']:
              assert required in style, required
          print('A4 print v2 artifact verification: PASS')
          PY

      - name: Publish exact validated output
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='.*' /tmp/portfolio-public/ ./
          touch .nojekyll
          rm -f .github/workflows/deploy-portfolio-print-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No public output changes were produced.' >&2
            exit 1
          fi
          git commit -m 'deploy(portfolio): publish A4 print v2'
          git push origin HEAD:main
