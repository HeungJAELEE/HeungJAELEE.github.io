name: Deploy Cell production traceability DX rewrite

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-cell-trace-dx.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out public repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify deployment base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '9814a97bbb2a6219e652f9b947ab25ba10804174'

      - name: Download validated Hugo artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-a63c-8209-a1e4-b9e80ae1ed3c/raw?se=2026-08-09T22%3A50%3A05Z&sp=r&sv=2026-02-06&sr=b&scid=ffbb13b5-29ca-567f-bb7b-8561ed4bacd7&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-09T07%3A09%3A59Z&ske=2026-08-10T07%3A09%3A59Z&sks=b&skv=2026-02-06&sig=8FPzt73lBHkVRbKgALC7VHqA/aSusOFQmkWEHSuxXNg%3D' -o /tmp/portfolio-public.zip
          echo 'c49704b7c8d13f2d7a195fb4ecc73e859120c5af0153b0636896a15006c0cf65  /tmp/portfolio-public.zip' | sha256sum -c -
          rm -rf /tmp/portfolio-public
          mkdir -p /tmp/portfolio-public
          unzip -q /tmp/portfolio-public.zip -d /tmp/portfolio-public

      - name: Verify Cell trace DX output
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          checks = {
              'posts/cell-production-tracking/index.html': [
                  'NCM Pilot Line 생산이력 추적 자동화 도구 개발',
                  '프로젝트 배경과 목표',
                  'AS-IS / TO-BE',
                  'Data Pipeline',
                  'VBA Application',
                  '현장 Use Case',
                  '약 3일',
                  '반나절',
                  '10개 Cell 검색',
                  '약 3분',
                  'Pump 미세진동',
                  '표준화·현장 인계',
                  'cell-production-tracking-flow.svg',
              ],
              'en/posts/cell-production-tracking/index.html': [
                  'NCM Pilot-Line Production Traceability Automation Tool',
                  'Project background and objective',
                  'AS-IS / TO-BE',
                  'Data pipeline',
                  'VBA application',
                  'Field use case',
                  'About three days',
                  'half a day',
                  'Ten-cell search',
                  'about three minutes',
                  'pump micro-vibration',
                  'Standardization and field handoff',
                  'cell-production-tracking-flow.svg',
              ],
          }
          banned = [
              '공통 4M·시스템 분석',
              '4M·시스템 판단',
              '검증 범위',
              '완료 판정',
              '현재 운영상태',
              '공개 제외',
              'Common 4M',
              'Local 4M',
              'Validation scope',
              'Completion decision',
              'Current operating status',
              'Not public',
              '90% 이상 단축',
              'more than 90%',
              'Primary Key',
              '저전압',
          ]
          for rel, phrases in checks.items():
              path = Path('/tmp/portfolio-public') / rel
              assert path.is_file() and path.stat().st_size > 0, path
              text = path.read_text(encoding='utf-8')
              for phrase in phrases:
                  assert phrase in text, f'{rel}: missing {phrase}'
              for phrase in banned:
                  assert phrase not in text, f'{rel}: prohibited {phrase}'
          print('Cell trace DX public artifact: PASS')
          PY

      - name: Publish validated output
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='.*' /tmp/portfolio-public/ ./
          touch .nojekyll
          rm -f .github/workflows/deploy-cell-trace-dx.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No public output changes were produced.' >&2
            exit 1
          fi
          git commit -m 'deploy(portfolio): publish Cell trace DX rewrite'
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '/tmp/portfolio-public'

  deploy:
    needs: publish-and-verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
