name: Deploy practical alternative Can supplier case

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-can-supplier-practical.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out public repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download validated Hugo artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-96a0-8211-99a0-256beb81f24d/raw?se=2026-08-09T09%3A06%3A05Z&sp=r&sv=2026-02-06&sr=b&scid=e4272191-231d-565f-a7e4-837d71c7ce02&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-08T22%3A02%3A14Z&ske=2026-08-09T22%3A02%3A14Z&sks=b&skv=2026-02-06&sig=dzaGfv%2BSNp25bQyTGHX6XattDH7Vq7OoBTWtEXZPwf8%3D' -o /tmp/portfolio-public.zip
          echo 'a5828efdf0e9ad386759891b9bdbdba0c3fc5b74f79167201c2cc9e7739e124b  /tmp/portfolio-public.zip' | sha256sum -c -
          rm -rf /tmp/portfolio-public
          mkdir -p /tmp/portfolio-public
          unzip -q /tmp/portfolio-public.zip -d /tmp/portfolio-public

      - name: Verify practical supplier-change output
        shell: bash
        run: |
          set -euo pipefail
          KO='/tmp/portfolio-public/posts/can-supplier-pilot-transition/index.html'
          EN='/tmp/portfolio-public/en/posts/can-supplier-pilot-transition/index.html'
          SVG='/tmp/portfolio-public/images/projects/can-supplier-validation-flow.svg'
          test -s "$KO"
          test -s "$EN"
          test -s "$SVG"

          for phrase in \
            '원통형 배터리 대체 Can 공급사 이원화 및 Pilot 전환 검증' \
            '공급사 변경 검증 흐름' \
            '단품 차이 분석과 IQC 기준 확립' \
            '기존 조립설비 공정성 검증과 조건 재설정' \
            'Cell 품질·안전·성능 검증' \
            'Lot당 200 Cell씩 3개 Lot, 총 600 Cell' \
            '공식 UN38.3 운송안전 시험' \
            '표준화 및 현장 이관' \
            '2025년 3월 Pilot 생산·구매발주 전환'; do
            grep -Fq "$phrase" "$KO"
          done

          for phrase in \
            'Cylindrical-Cell Alternative Can Supplier Qualification and Pilot Transition' \
            'Supplier-change validation flow' \
            'Component comparison and IQC criteria' \
            'Existing-equipment processability and condition reset' \
            'Cell quality, safety, and performance validation' \
            '200 cells per lot across three lots, 600 cells in total' \
            'official UN38.3 transport-safety test' \
            'Standardization and handoff'; do
            grep -Fq "$phrase" "$EN"
          done

          if grep -Eqi '프로젝트 SOW|프로젝트 WBS|공통 4M\+2E 위험판정|4M\+2E 판단|Gate 판정|성과 제외|후속 확인대상|공개 제외|상업 양산|무결점|불량 없이|전수 통과|공급망 전환 완수|id=검증-범위' "$KO"; then
            echo 'Old or unsupported Korean wording remains in the deployment artifact' >&2
            exit 1
          fi
          if grep -Eqi 'Project SOW|Project WBS|Project-level 4M\+2E risk disposition|Local 4M\+2E decision|Gate decision|Excluded from realized results|Follow-up required|Not public|commercial production|zero[- ]defect|without defects|passed every inspection|completed supply-chain transition|id=validation-scope' "$EN"; then
            echo 'Old or unsupported English wording remains in the deployment artifact' >&2
            exit 1
          fi
          ! grep -Fq 'portfolio-analysis-case' "$KO"
          ! grep -Fq 'portfolio-analysis-case' "$EN"

      - name: Publish validated output
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='.*' /tmp/portfolio-public/ ./
          touch .nojekyll
          rm -f .github/workflows/deploy-can-supplier-practical.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No public output changes were produced.' >&2
            exit 1
          fi
          git commit -m 'deploy(portfolio): publish practical alternative Can supplier case'
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '/tmp/portfolio-public'

  deploy:
    needs: publish-and-verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
