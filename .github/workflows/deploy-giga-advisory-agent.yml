name: Deploy GIGA process-engineering advisory Agent architecture

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-giga-advisory-agent.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out public repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify deployment base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'b98163f57712cd003f5359b72740daa24a133ed3'

      - name: Download validated Hugo artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-8d44-8209-90ac-cbb068c64f94/raw?se=2026-08-09T23%3A14%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=2c2d7223-3a62-594c-96a7-6738703ede43&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-09T22%3A44%3A45Z&ske=2026-08-10T22%3A44%3A45Z&sks=b&skv=2026-02-06&sig=rVzJYGfg7HyNk%2FqvhqVWbziFpVxWVdHDOJxoSXquQBc%3D' -o /tmp/portfolio-public.zip
          echo '2d6b28fc4911d318ed531d67299737d4791812390efc87dd11218e7649f9b864  /tmp/portfolio-public.zip' | sha256sum -c -
          rm -rf /tmp/portfolio-public
          mkdir -p /tmp/portfolio-public
          unzip -q /tmp/portfolio-public.zip -d /tmp/portfolio-public

      - name: Verify GIGA advisory output
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          checks = {
              'posts/giga-press-dx/index.html': [
                  'GIGA Press 공정 Digital Twin·AI 생산기술 보조 Agent 아키텍처 PoC',
                  '프로젝트 배경과 Vision',
                  '생산기술 Advisory 아키텍처',
                  '제어·분석 Authority Boundary',
                  'Data Pipeline과 상태 의미',
                  'State 후보와 Advisory Output 후보',
                  'PLC Control Domain과 AI Advisory Domain의 Decoupling',
                  'SCADA→SQLite',
                  'Read-only State',
                  '다음 Engineering Gate',
              ],
              'en/posts/giga-press-dx/index.html': [
                  'GIGA Press Digital Twin and Process-Engineering Advisory Agent Architecture PoC',
                  'Project background and vision',
                  'Process-engineering advisory architecture',
                  'Control and analysis authority boundary',
                  'Data pipeline and state semantics',
                  'State candidates and advisory-output candidates',
                  'decoupling of the PLC control domain from the AI advisory domain',
                  'SCADA-to-SQLite',
                  'Read-only state',
                  'Next engineering gates',
              ],
          }
          for rel, phrases in checks.items():
              path = Path('/tmp/portfolio-public') / rel
              assert path.is_file() and path.stat().st_size > 0, path
              text = path.read_text(encoding='utf-8')
              for phrase in phrases:
                  assert phrase in text, f'{rel}: {phrase}'

          merged = '\n'.join((Path('/tmp/portfolio-public') / rel).read_text(encoding='utf-8') for rel in checks)
          banned = [
              'GIGA Press Digital Twin·자율형 공장 PoC',
              'GIGA Press Digital Twin and Autonomous Factory PoC',
              '프로젝트 구현 목표 — Team SOW',
              '프로젝트 진행순서 — Team WBS',
              'Personal SOW',
              'Personal WBS',
              '완료범위에 포함하지 않은 항목',
              'AI는 실제 설비를 직접 제어하지 않았습니다',
              'AI did not directly control the equipment',
              '1:1로 지연 없이 동기화',
              '설비 증설 공수 50% 절감',
          ]
          for phrase in banned:
              assert phrase not in merged, phrase
          print('GIGA advisory public artifact: PASS')
          PY

      - name: Publish validated output
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='.*' /tmp/portfolio-public/ ./
          touch .nojekyll
          rm -f .github/workflows/deploy-giga-advisory-agent.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No public output changes were produced.' >&2
            exit 1
          fi
          git commit -m 'deploy(portfolio): publish GIGA advisory Agent architecture'
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '/tmp/portfolio-public'

  deploy:
    needs: publish-and-verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
