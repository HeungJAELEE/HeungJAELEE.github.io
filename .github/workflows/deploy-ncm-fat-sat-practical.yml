name: Deploy practical NCM FAT SAT rewrite

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-ncm-fat-sat-practical.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out triggering public commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify deployment base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '5b9c182b34359914da1f9ef236d0b58401c5f813'

      - name: Download validated Hugo artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-1d8c-81f6-82a7-babc3b72060d/raw?se=2026-08-10T04%3A20%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=1bdf36fe-02b1-54cf-89d3-898feaa7e125&skoid=9063adf3-a524-4acf-b70a-8731b33f2f50&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-10T04%3A10%3A34Z&ske=2026-08-11T04%3A10%3A34Z&sks=b&skv=2026-02-06&sig=%2BgV%2ByubUI1ndfKm0iS2gLbj0uUN%2B/wtWsI3AwrCnLhw%3D' -o /tmp/portfolio-public.zip
          echo 'f6a19a81cca2f06bdfff22280538e47a922b22385f881969e75a93ef725e4002  /tmp/portfolio-public.zip' | sha256sum -c -
          rm -rf /tmp/portfolio-public
          mkdir -p /tmp/portfolio-public
          unzip -q /tmp/portfolio-public.zip -d /tmp/portfolio-public

      - name: Verify practical NCM FAT SAT output
        shell: bash
        run: |
          set -euo pipefail
          KO='/tmp/portfolio-public/posts/ncm-fat-sat/index.html'
          EN='/tmp/portfolio-public/en/posts/ncm-fat-sat/index.html'
          test -s "$KO"
          test -s "$EN"
          for phrase in \
            '프로젝트 배경 및 인수 과제' \
            'Setup Pipeline' \
            '프로젝트 오너십과 역할' \
            'Acceptance 기준' \
            'FAT·SAT 검수 및 Punch Closure' \
            '약 1,000 Cell Pilot Run' \
            '재작업 반영 후 품질기준 충족 Cell 기준' \
            '최종 성과 및 표준문서 이관' \
            '연계 상세 프로젝트'; do
            grep -Fq "$phrase" "$KO"
          done
          for phrase in \
            'Project background and acceptance challenge' \
            'Setup pipeline' \
            'Project ownership and roles' \
            'Acceptance criteria' \
            'FAT/SAT inspection and punch closure' \
            'Approximately 1,000-cell pilot run' \
            'Cells meeting the quality criteria after reflected rework' \
            'Final result and standard-document handoff' \
            'Related detailed projects'; do
            grep -Fq "$phrase" "$EN"
          done
          if grep -Eqi '프로젝트 SOW|프로젝트 WBS|Project SOW|Project WBS|사례 02\.|사례 03\.|Case 02\.|Case 03\.|Pre-Charge 이후 Cell 두께 증가|Cell-thickness increase after pre-charge|Cap Plate C-Cut 변경 허용범위|Cap-plate C-cut acceptance range|측정체계를 새로 개발한 사례로 과장하지 않았습니다|FPY 또는 장기 양산수율이 아니며|조건부 지표|공개 결과 제외|공개 제외|검증 범위|Validation scope' "$KO" "$EN"; then
            echo 'Superseded NCM FAT/SAT wording remains' >&2
            exit 1
          fi

      - name: Publish validated output
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='.*' /tmp/portfolio-public/ ./
          touch .nojekyll
          rm -f .github/workflows/deploy-ncm-fat-sat-practical.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No public output changes were produced.' >&2
            exit 1
          fi
          git commit -m 'deploy(portfolio): publish practical NCM FAT SAT case'
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '/tmp/portfolio-public'

  deploy:
    needs: publish-and-verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
