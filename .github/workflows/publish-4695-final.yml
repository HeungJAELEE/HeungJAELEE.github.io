name: Publish final 4695 equipment recovery case

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-4695-final.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out committed site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated Hugo artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-ec58-8209-9267-b0836edd222e/raw?se=2026-08-08T17%3A04%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=3097d59b-2405-590d-86c2-f4b6189a7d62&skoid=b1bca990-dcac-4c31-8ca1-ac563cf24c54&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-08T03%3A38%3A19Z&ske=2026-08-09T03%3A38%3A19Z&sks=b&skv=2026-02-06&sig=q5LrSu49td26fFpncOkYcZIAt5gNFSYi05QRpGLP3VQ%3D' \
            --output /tmp/portfolio-public.zip
          echo 'c4d7e4bc46a9bac0211d51385b96a9673afc0d1099c0481883fb74f76cd474a7  /tmp/portfolio-public.zip' | sha256sum --check
          rm -rf /tmp/site
          mkdir -p /tmp/site
          unzip -q /tmp/portfolio-public.zip -d /tmp/site

      - name: Verify final 4695 page and portfolio regressions
        shell: bash
        run: |
          set -euo pipefail
          KO='/tmp/site/posts/battery-4695-production-transition/index.html'
          EN='/tmp/site/en/posts/battery-4695-production-transition/index.html'
          test -s "$KO"
          test -s "$EN"
          test -s /tmp/site/images/projects/4695-production-transition-flow.svg

          for phrase in \
            '4695 조립라인 주요 설비 정상화 및 제한 생산 전환' \
            'Laser 3공정 정상화' \
            'X-Ray·AI Vision 검사경계 재설정' \
            '생산을 가능하게 한 임시조치와 설계개조 Gate' \
            '100 Cell × 2 Lot' \
            '최종 50 Cell One-way Run' \
            '통제된 수동개입' \
            '제한 생산 시작 판정'; do
            grep -Fq "$phrase" "$KO"
          done

          for phrase in \
            '4695 Assembly-Line Equipment Recovery and Limited Production Transition' \
            'Recovery of three laser processes' \
            'Resetting X-ray and AI-vision inspection boundaries' \
            'Temporary controls and design-modification gates' \
            '100 cells × 2 lots' \
            'Final 50-cell one-way run' \
            'controlled manual intervention' \
            'limited-production start decision'; do
            grep -Fq "$phrase" "$EN"
          done

          test -s /tmp/site/posts/battery-2170-pilot/index.html
          test -s /tmp/site/posts/battery-25p-lfp-development/index.html
          test -s /tmp/site/posts/battery-tabless-concept/index.html
          test -s /tmp/site/posts/can-supplier-pilot-transition/index.html
          test -s /tmp/site/posts/ncm-fat-sat/index.html
          test -s /tmp/site/posts/ncm-pre-forming-validation/index.html
          test -s /tmp/site/posts/cell-production-tracking/index.html

          for forbidden in \
            '수율 50%→95%' \
            'AI Vision 5대 정상화' \
            '용접면적 약 60%' \
            '가짜 EPDM' \
            '전 설비 무개입' \
            '60% weld-area improvement' \
            'fake EPDM'; do
            if grep -Fqi "$forbidden" "$KO" "$EN"; then
              echo "Prohibited 4695 claim found: $forbidden" >&2
              exit 1
            fi
          done

      - name: Synchronize and commit generated site
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/' /tmp/site/ ./
          rm -f .github/workflows/publish-4695-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No generated-site changes were produced.' >&2
            exit 1
          fi
          git commit -m 'deploy(portfolio): publish final 4695 equipment recovery case'
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '/tmp/site'

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
