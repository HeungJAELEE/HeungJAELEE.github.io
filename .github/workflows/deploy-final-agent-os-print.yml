name: Deploy final A4 Agent OS print deck

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-final-agent-os-print.yml

permissions:
  contents: write

concurrency:
  group: portfolio-public-write
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify deployment base
        run: test "$(git rev-parse HEAD^)" = '4eef51be03bacf8e6b74df7535dc17507035ef46'

      - name: Download validated artifact
        run: |
          curl -L --fail --retry 3 --retry-delay 2 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-e4c8-822f-ae0f-6a6734df34d7/raw?se=2026-08-10T10%3A56%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=5ae050ff-ffbb-5ade-9f75-79a02ac5db78&skoid=bbd22fc4-f881-4ea4-b2f3-c12033cf6a8b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-09T12%3A54%3A43Z&ske=2026-08-10T12%3A54%3A43Z&sks=b&skv=2026-02-06&sig=cSyIkVq9jZxKUH89Dx%2BUnN85pgK3EBtA3kLrMNlJRE4%3D' -o /tmp/portfolio-public.zip
          echo '98048e06543c0045f2bf138ce8c5eafe0b9ed940e60624fe84ef4fb79dcbfa88  /tmp/portfolio-public.zip' | sha256sum -c -
          rm -rf /tmp/portfolio-public
          mkdir -p /tmp/portfolio-public
          unzip -q /tmp/portfolio-public.zip -d /tmp/portfolio-public

      - name: Verify final output
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('/tmp/portfolio-public')
          deck = (root / 'print/featured-projects-ko/index.html').read_text(encoding='utf-8')
          assert '@page{size:A4 landscape;margin:0}' in deck
          assert deck.count('class="slide"') == 12
          for value in ['1 / 12','12 / 12','ROOT CAUSE','window.print()']:
              assert value in deck
          ko = (root / 'posts/ai-authority-evidence-plane/index.html').read_text(encoding='utf-8')
          en = (root / 'en/posts/ai-authority-evidence-plane/index.html').read_text(encoding='utf-8')
          assert 'Agent OS — 근거·승인·검증으로 AI 작업을 통제하는 개인 운영체제' in ko
          assert 'Agent OS — Governing AI Work Through Evidence, Approval, and Verification' in en
          js_files = list((root / 'scripts').glob('portfolio-print.min.*.js'))
          assert len(js_files) == 1
          js = js_files[0].read_text(encoding='utf-8')
          assert '/print/featured-projects-ko/?autoprint=1' in js
          assert 'window.open(g,"_blank")' in js
          assert 'opener=null' in js
          PY

      - name: Publish exact artifact
        run: |
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='.*' /tmp/portfolio-public/ ./
          touch .nojekyll
          rm -f .github/workflows/deploy-final-agent-os-print.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'deploy(portfolio): publish final A4 Agent OS print deck'
          git push origin HEAD:main
