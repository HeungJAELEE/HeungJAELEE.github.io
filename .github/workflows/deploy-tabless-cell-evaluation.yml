name: Deploy Tabless Cell-evaluation narrative

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-tabless-cell-evaluation.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out public repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download validated Hugo artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-a998-8211-a760-4b45b3d42534/raw?se=2026-08-09T09%3A18%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=2f981be4-c2f9-5372-9995-27ad91f23916&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-09T08%3A58%3A10Z&ske=2026-08-10T08%3A58%3A10Z&sks=b&skv=2026-02-06&sig=PlZJXv3nYNktqbGA6bjlwhsbq12q9WuGDlT5SkhBzds%3D' -o /tmp/portfolio-public.zip
          echo '70ae472af23411d241d5fbf86269ab9816dd1b3370d8d9ec3893b2f6597eebef  /tmp/portfolio-public.zip' | sha256sum -c -
          rm -rf /tmp/portfolio-public
          mkdir -p /tmp/portfolio-public
          unzip -q /tmp/portfolio-public.zip -d /tmp/portfolio-public

      - name: Verify Tabless Cell-evaluation output
        shell: bash
        run: |
          set -euo pipefail
          KO='/tmp/portfolio-public/posts/battery-tabless-concept/index.html'
          EN='/tmp/portfolio-public/en/posts/battery-tabless-concept/index.html'
          SVG='/tmp/portfolio-public/images/projects/2170-tabless-a-sample-gate.svg'
          test -s "$KO"
          test -s "$EN"
          test -s "$SVG"

          for phrase in \
            '차세대 2170 Tabless 구조 A Sample 선행 제조 검증 (PoC)' \
            '프로젝트 개요' \
            '전용 설비 없이 임시 제조 경로 구축' \
            'Laser Beam 유입·Short 사전 차단' \
            '약 100개 Trial과 Failure Mode 분리' \
            '기능 Sample 5개 Cell 평가' \
            '차후 설계 반영 사항' \
            'A Sample 선행 제조 PoC 완료'; do
            grep -Fq "$phrase" "$KO"
          done

          for phrase in \
            'Next-Generation 2170 Tabless A-Sample Early Manufacturing Validation (PoC)' \
            'Project overview' \
            'Temporary manufacturing route without dedicated equipment' \
            'Preventing internal laser entry and shorts' \
            'About 100 trials and failure-mode separation' \
            'Cell evaluation of five functional samples' \
            'Follow-on items for pilot design' \
            'Completed the next-generation 2170 tabless A-sample early manufacturing PoC'; do
            grep -Fq "$phrase" "$EN"
          done

          grep -Fq 'Cell 평가' "$SVG"
          grep -Fq 'Cell 타당성 확인' "$SVG"

          if grep -Eqi '기능평가|전기적 평가|Pilot 설계 입력|설계 입력|문제는.{0,80}점입니다|이 경로를 통해|프로젝트 SOW|프로젝트 WBS|4M\+2E 판단|검증 범위' "$KO"; then
            echo 'Old explanatory, administrative, or translated Korean wording remains' >&2
            exit 1
          fi
          if grep -Eqi 'functional evaluation|electrical evaluation|design inputs?|The challenge was|This route connected|Project SOW|Project WBS|Local 4M\+2E decision|Validation boundary' "$EN"; then
            echo 'Old explanatory, administrative, or translated English wording remains' >&2
            exit 1
          fi
          ! grep -Fq 'portfolio-analysis-case' "$KO"
          ! grep -Fq 'portfolio-analysis-case' "$EN"

      - name: Publish validated output
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='.*' /tmp/portfolio-public/ ./
          touch .nojekyll
          rm -f .github/workflows/deploy-tabless-cell-evaluation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No public output changes were produced.' >&2
            exit 1
          fi
          git commit -m 'deploy(portfolio): publish Tabless Cell-evaluation narrative'
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '/tmp/portfolio-public'

  deploy:
    needs: publish-and-verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
