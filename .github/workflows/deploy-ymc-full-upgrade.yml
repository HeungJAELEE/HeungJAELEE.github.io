name: Deploy full YMC portfolio upgrade

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-ymc-full-upgrade.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out triggering public commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify deployment base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '01eb97a4b6cdc14e473a3adba439c8ff909959c0'

      - name: Download validated Hugo artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-cc88-8206-b2c8-b84274f4d4bc/raw?se=2026-08-09T16%3A23%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=b0cd42d8-e5bd-5d00-b33d-9de540ab2d47&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-09T00%3A03%3A14Z&ske=2026-08-10T00%3A03%3A14Z&sks=b&skv=2026-02-06&sig=4vWHLkE6H%2B0LrRhowheS4JtfCpn5px88T2nsf/VBIMA%3D' -o /tmp/portfolio-public.zip
          echo '541fa141682a65ecb938368085555ecf30162dfec4b9259795def9bb2a9f5020  /tmp/portfolio-public.zip' | sha256sum -c -
          rm -rf /tmp/portfolio-public
          mkdir -p /tmp/portfolio-public
          unzip -q /tmp/portfolio-public.zip -d /tmp/portfolio-public

      - name: Verify YMC output
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          checks = {
              'posts/oled-anodizing-development/index.html': [
                  '디스플레이 장비부품 고내열 Anodizing 공정개발·Qual',
                  'DMAIC 기반 공정 재설계',
                  '100×100 mm→500×500 mm Scale-up 검증 완료',
                  '450℃×24시간×5 Cycle',
              ],
              'en/posts/oled-anodizing-development/index.html': [
                  'High-Temperature Anodizing Process Development and Qualification for Display Equipment Parts',
                  'DMAIC-based process redesign',
                  '450℃×24 hours×five cycles',
              ],
              'posts/mixed-acid-bath-analysis/index.html': [
                  'Root Cause Chain', 'Sampling 주 1회→주 2회', '외부기관 3곳', '약 50회 분석·Sample 비교', '중국 현장 재검증'
              ],
              'en/posts/mixed-acid-bath-analysis/index.html': [
                  'Root-cause chain', 'Sampling once→twice weekly', 'three external labs', 'about 50 analyses', 'China-site revalidation'
              ],
              'posts/amat-akt-qual/index.html': [
                  '공정별 변경점과 4M+Measurement', '7회 반복측정', '3회 재시험', '위험항목 개정과 표준문서 전개'
              ],
              'en/posts/amat-akt-qual/index.html': [
                  'Process-level changes and 4M+Measurement', 'seven repeated readings per sample', 'three retests'
              ],
              'posts/diffuser-scaleup-failure/index.html': [
                  'Root Cause Chain', 'Cavitation Erosion', 'Scale-up 중단판정', 'Lessons Learned 및 차기'
              ],
              'en/posts/diffuser-scaleup-failure/index.html': [
                  'Root-cause chain', 'cavitation erosion', 'Scale-up stop decision', 'Lessons learned and future R&amp;D standard'
              ],
              'posts/robot-overhaul-standardization/index.html': [
                  'FMEA 신규 작성·개정과 표준문서 전개', '본테크 반복운영 FMEA 개정'
              ],
              'en/posts/robot-overhaul-standardization/index.html': [
                  'FMEA creation, revision, and document cascade', 'Repeat-operation FMEA revision at Bontech'
              ],
              'posts/wet-process-standardization/index.html': [
                  '프로젝트 유형별 Method', '표준문서가 만들어진 순서', '진공 이송로봇 FMEA·표준체계'
              ],
              'en/posts/wet-process-standardization/index.html': [
                  'Method by project type', 'How standard documents were created', 'Vacuum transfer-robot FMEA and standard system'
              ],
          }
          merged = []
          for rel, phrases in checks.items():
              path = Path('/tmp/portfolio-public') / rel
              assert path.is_file() and path.stat().st_size > 0, path
              text = path.read_text(encoding='utf-8')
              merged.append(text)
              for phrase in phrases:
                  assert phrase in text, f'{rel}: {phrase}'
          all_text = '\n'.join(merged)
          for phrase in [
              '3일에서 8시간으로 줄었다고 바로 성공이 아니었습니다',
              '박리 여부와 재사용 가능한 제품인지를 따로',
              '4M+2E로 본 실패원인',
              '성공조건과 실제 판정',
              'Why the eight-hour result was not yet success',
              '4M+2E review',
              'Gate results',
              'Confirmed result and limits',
          ]:
              assert phrase not in all_text, phrase
          print('Full YMC deployment artifact: PASS')
          PY

      - name: Publish validated output
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='.*' /tmp/portfolio-public/ ./
          touch .nojekyll
          rm -f .github/workflows/deploy-ymc-full-upgrade.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No public output changes were produced.' >&2
            exit 1
          fi
          git commit -m 'deploy(portfolio): publish full YMC portfolio upgrade'
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '/tmp/portfolio-public'

  deploy:
    needs: publish-and-verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
