name: Deploy Indy7 implementation-first runtime detail

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-indy7-runtime-detail.yml'

permissions:
  contents: write

concurrency:
  group: portfolio-public-write
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out public repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact deployment base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '92306633d32dde7e2e9a0a67ab9111a0fb26744a'

      - name: Download validated Hugo artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-8c10-8206-9548-c4203821f23e/raw?se=2026-08-10T00%3A54%3A33Z&sp=r&sv=2026-02-06&sr=b&scid=3f324e18-dfe7-591a-815a-61d1fc62bb13&skoid=3e273c3d-5ea1-4088-9e18-79685531b184&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-09T23%3A15%3A00Z&ske=2026-08-10T23%3A15%3A00Z&sks=b&skv=2026-02-06&sig=JaKRY2Ae6%2BQJgtjg%2BrRwyQFkKalcj8WIyJR7qXUs87o%3D' -o /tmp/portfolio-public.zip
          echo '05cfe1e9e8f794fb07df257d34056b35aacd3390c1db05a70fd51f6a98b253f5  /tmp/portfolio-public.zip' | sha256sum -c -
          rm -rf /tmp/portfolio-public
          mkdir -p /tmp/portfolio-public
          unzip -q /tmp/portfolio-public.zip -d /tmp/portfolio-public

      - name: Verify implementation-first Indy7 artifact
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          required = {
              Path('/tmp/portfolio-public/posts/robot-json-omniverse/index.html'): [
                  '프로젝트·프로그램 구현 요약',
                  '직접 구현',
                  'PC-HMI 화면과 작업자 구동 순서',
                  'Teaching JSON을 작업 Tree로 바꾸는 방법',
                  'JSON의 3개 핵심 배열',
                  'JSON 편집과 원본보존 Round-trip',
                  '작업명령이 실제 Robot까지 전달되는 과정',
                  'Robot별 Queue와 결과추적',
                  'robot/accepted',
                  'motion_state=timeout',
                  '실시간 Robot 상태와 3D Digital Twin',
              ],
              Path('/tmp/portfolio-public/en/posts/robot-json-omniverse/index.html'): [
                  'Project and program implementation summary',
                  'Direct implementation',
                  'PC-HMI pages and operator workflow',
                  'Converting Teaching JSON into an operator task tree',
                  'Three core JSON arrays',
                  'Editing and loss-preserving JSON round trip',
                  'How a task command reaches the physical robot',
                  'Per-robot queues and result tracking',
                  'robot/accepted',
                  'motion_state=timeout',
                  'Live robot state and the 3D Digital Twin',
              ],
          }
          forbidden = [
              '프로젝트·PM·구현 요약',
              '기술 PM·직접 구현',
              'Project, PM, and build summary',
              'Technical PM and direct build',
              'Team SOW',
              'Team WBS',
              'Personal SOW',
              'Personal WBS',
          ]
          for path, phrases in required.items():
              assert path.is_file() and path.stat().st_size > 0, path
              text = path.read_text(encoding='utf-8')
              for phrase in phrases:
                  assert phrase in text, f'{path}: {phrase}'
              for phrase in forbidden:
                  assert phrase not in text, f'{path}: {phrase}'
          print('Indy7 public artifact verification: PASS')
          PY

      - name: Publish validated output
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='.*' /tmp/portfolio-public/ ./
          touch .nojekyll
          rm -f .github/workflows/deploy-indy7-runtime-detail.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No public output changes were produced.' >&2
            exit 1
          fi
          git commit -m 'deploy(portfolio): restore Indy7 program operation detail'
          git push origin HEAD:main
