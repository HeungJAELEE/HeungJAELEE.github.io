name: Deploy 25P NPI process-development page

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-25p-npi-copy.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out public repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download validated Hugo artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-c7c4-822f-993f-1665b0141923/raw?se=2026-08-09T08%3A33%3A02Z&sp=r&sv=2026-02-06&sr=b&scid=66fb31cd-afc5-53b1-822f-4527a903546a&skoid=add8ee7d-5fc7-451e-b06e-a82b2276cf62&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-09T02%3A20%3A35Z&ske=2026-08-10T02%3A20%3A35Z&sks=b&skv=2026-02-06&sig=YKKgpRCTf3ef8q0RfDgW0zvOuXSVo2b9Nqroq%2BCQ/4c%3D' -o /tmp/portfolio-public.zip
          echo '9ecc797e4b186899588b9d671b32ba6295d1c4b6decb0d765900ce1a0909dd91  /tmp/portfolio-public.zip' | sha256sum -c -
          rm -rf /tmp/portfolio-public
          mkdir -p /tmp/portfolio-public
          unzip -q /tmp/portfolio-public.zip -d /tmp/portfolio-public

      - name: Verify 25P NPI output
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          ko = Path('/tmp/portfolio-public/posts/battery-25p-lfp-development/index.html').read_text(encoding='utf-8')
          en = Path('/tmp/portfolio-public/en/posts/battery-25p-lfp-development/index.html').read_text(encoding='utf-8')
          svg = Path('/tmp/portfolio-public/images/projects/25p-lfp-development-gate.svg').read_text(encoding='utf-8')

          for phrase in [
              '25P LFP Power Cell 신규 공정조건 개발 및 시양산·고객 Qual',
              'NPI 개발 흐름', '핵심 공정조건 개발',
              'LFP 전해액 함침조건', '다층 Clad Tab 저항용접',
              'Can 높이 변경에 따른 밀봉공정 재설정',
              'X-Ray·Vision 판정기준 재확립', '20,000 Cell',
              '고객 Qual', 'CCB P.O',
          ]:
              assert phrase in ko, phrase

          for phrase in [
              '25P LFP Power Cell NPI Process Development, Trial Production, and Customer Qualification',
              'NPI development flow', 'Core process-condition development',
              'LFP electrolyte impregnation', 'Multilayer clad-tab resistance welding',
              'Sealing-process reset for the changed can height',
              'X-ray and vision disposition reset', '20,000 cells',
              'Customer qualification', 'CCB P.O',
          ]:
              assert phrase in en, phrase

          for phrase in [
              '프로젝트 SOW', '프로젝트 WBS', '공통 4M+2E 위험판정',
              '주요 원인으로 채택하지 않음', '검증 범위', '조건부 수치',
              '성과 제외', '단계 해석', '공개 제외',
              '단가 문제로 상업 양산', '상업 양산 미진행',
          ]:
              assert phrase not in ko, phrase

          assert 'analysis-case' not in ko
          assert 'analysis-case' not in en
          assert 'CCB P.O 기술 승인' in svg
          assert '상업 양산 미진행' not in svg
          print('Validated public 25P NPI output.')
          PY

      - name: Publish validated output
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='.*' /tmp/portfolio-public/ ./
          touch .nojekyll
          rm -f .github/workflows/deploy-25p-npi-copy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No public output changes were produced.' >&2
            exit 1
          fi
          git commit -m 'deploy(portfolio): publish 25P NPI process-development case'
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

  deploy:
    needs: publish-and-verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
