name: Publish Tabless A-sample manufacturing refactor

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-project4-tabless.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out committed site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated Hugo artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-dae8-8206-8b43-6bc03d0cb606/raw?se=2026-08-08T08%3A37%3A22Z&sp=r&sv=2026-02-06&sr=b&scid=c28f4c98-fc6f-51d9-a153-29b8ff0aa6e0&skoid=9063adf3-a524-4acf-b70a-8731b33f2f50&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-08T03%3A52%3A47Z&ske=2026-08-09T03%3A52%3A47Z&sks=b&skv=2026-02-06&sig=aTf6CUNLbwXTTiCuqRnadYwHdYeqIOPkBi3h/VtD4co%3D' \
            --output /tmp/portfolio-public.zip
          echo 'ec30dae757dfa4478bf819808f8a210fa9393b8ab645e92dbc6640f83f1f2f59  /tmp/portfolio-public.zip' | sha256sum --check
          rm -rf /tmp/site
          mkdir -p /tmp/site
          unzip -q /tmp/portfolio-public.zip -d /tmp/site

      - name: Verify Tabless page and manufacturing regressions
        shell: bash
        run: |
          set -euo pipefail
          KO='/tmp/site/posts/battery-tabless-concept/index.html'
          EN='/tmp/site/en/posts/battery-tabless-concept/index.html'
          test -s "$KO"
          test -s "$EN"
          test -s /tmp/site/images/projects/2170-tabless-a-sample-gate.svg
          grep -Fq '2170 Tabless 구조 A Sample 제조성 검증' "$KO"
          grep -Fq '프로젝트 SOW' "$KO"
          grep -Fq '프로젝트 WBS' "$KO"
          grep -Fq '공통 4M+2E 위험판정' "$KO"
          grep -Fq 'Laser Beam 유입과 Short 위험' "$KO"
          grep -Fq '기능 Sample 5개 확인' "$KO"
          grep -Fq 'A Sample Gate 판정' "$KO"
          grep -Fq '2170 Tabless Structure A-Sample Manufacturability Validation' "$EN"
          grep -Fq 'Project-level 4M+2E risk disposition' "$EN"
          if grep -Eq '(^|[^0-9])5%([^0-9]|$)' "$KO" "$EN"; then
            echo 'Exploratory ratio leaked into public Tabless page' >&2
            exit 1
          fi
          test -s /tmp/site/posts/battery-2170-pilot/index.html
          test -s /tmp/site/posts/battery-4695-production-transition/index.html
          test -s /tmp/site/posts/battery-25p-lfp-development/index.html
          grep -Fq '2170 조립라인 실질 양품수율 안정화' /tmp/site/posts/battery-2170-pilot/index.html
          grep -Fq '4695 조립설비 Auto Cycle 복구 및 제한 생산 전환' /tmp/site/posts/battery-4695-production-transition/index.html
          grep -Fq '25P LFP Power Cell 공정조건 개발 및 시양산 검증' /tmp/site/posts/battery-25p-lfp-development/index.html

      - name: Synchronize and commit generated site
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/' /tmp/site/ ./
          rm -f .github/workflows/publish-project4-tabless.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No generated-site changes were produced.' >&2
            exit 1
          fi
          git commit -m 'deploy(portfolio): publish Tabless A-sample refactor'
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '/tmp/site'

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
