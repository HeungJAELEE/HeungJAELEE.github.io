name: Remove 2170 validation-scope block from public HTML

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/remove-2170-validation-scope-public.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-public:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove KO and EN validation-scope blocks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          jobs = {
              Path('posts/battery-2170-pilot/index.html'): [
                  (r'<h2 id=검증-범위>검증 범위</h2><table>.*?</table>', 1),
                  (r'<li><a href=#검증-범위>검증 범위</a></li>', 1),
              ],
              Path('en/posts/battery-2170-pilot/index.html'): [
                  (r'<h2 id=validation-scope>Validation scope</h2><table>.*?</table>', 1),
                  (r'<li><a href=#validation-scope>Validation scope</a></li>', 1),
              ],
          }

          for path, rules in jobs.items():
              text = path.read_text(encoding='utf-8')
              for pattern, expected in rules:
                  text, count = re.subn(pattern, '', text, count=1, flags=re.S)
                  if count != expected:
                      raise SystemExit(f'{path}: expected {expected} match for {pattern!r}, found {count}')
              path.write_text(text, encoding='utf-8')

          checks = {
              Path('posts/battery-2170-pilot/index.html'): ['id=검증-범위', '>검증 범위<', 'href=#검증-범위'],
              Path('en/posts/battery-2170-pilot/index.html'): ['id=validation-scope', '>Validation scope<', 'href=#validation-scope'],
          }
          for path, forbidden in checks.items():
              text = path.read_text(encoding='utf-8')
              leaked = [item for item in forbidden if item in text]
              if leaked:
                  raise SystemExit(f'{path}: validation-scope content remains: {leaked}')
          PY

      - name: Commit and publish exact public correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add posts/battery-2170-pilot/index.html en/posts/battery-2170-pilot/index.html
          git rm .github/workflows/remove-2170-validation-scope-public.yml
          git diff --cached --check
          git commit -m 'fix(portfolio): remove 2170 validation-scope block'

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            sleep $((attempt * 2))
          done

          echo 'Failed to publish the public HTML correction after concurrent updates.' >&2
          exit 1
