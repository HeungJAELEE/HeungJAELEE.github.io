name: Retrigger legacy Pages build for 25P NPI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rebuild-legacy-pages-25p.yml'

permissions:
  contents: write

jobs:
  retrigger:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out published site
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create a clean legacy Pages rebuild commit
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '25P NPI public deployment: 98a75e4651222eea57e02c8649607f5db0c1b743' > pages-rebuild.txt
          rm -f .github/workflows/rebuild-legacy-pages-25p.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages-rebuild.txt .github/workflows/rebuild-legacy-pages-25p.yml
          git diff --cached --check
          git commit -m 'chore(pages): retrigger legacy build for 25P NPI'
          git push origin HEAD:main
