name: Publish Kumyang and Jastech employment batch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-kumyang-jestech-batch.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out committed site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated Hugo artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://sdmntprwestus.oaiusercontent.com/files/00000000-dcc4-8230-bb20-145b47f05f13/raw?se=2026-08-08T11%3A25%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=99cb9c32-3101-541f-91c8-92108b9d3c8e&skoid=b1bca990-dcac-4c31-8ca1-ac563cf24c54&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-07T23%3A42%3A25Z&ske=2026-08-08T23%3A42%3A25Z&sks=b&skv=2026-02-06&sig=92KxUIdmAWI9WlGGzZKKmsQIaD%2Ba/BhazEa0G%2BhR/ng%3D' \
            --output /tmp/portfolio-public.zip
          echo 'b8b76b44aa019cb5a66fd5958332eb5031110aa11e4cd8a7b91f130e46ed81a4  /tmp/portfolio-public.zip' | sha256sum --check
          rm -rf /tmp/site
          mkdir -p /tmp/site
          unzip -q /tmp/portfolio-public.zip -d /tmp/site

      - name: Verify Kumyang and Jastech pages and career copy
        shell: bash
        run: |
          set -euo pipefail
          for page in \
            battery-2170-pilot \
            battery-4695-production-transition \
            battery-25p-lfp-development \
            battery-tabless-concept \
            can-supplier-pilot-transition \
            ncm-fat-sat \
            ncm-pre-forming-validation \
            cell-production-tracking; do
            test -s "/tmp/site/posts/${page}/index.html"
            test -s "/tmp/site/en/posts/${page}/index.html"
          done
          grep -Fq '팀 결과에 기여' /tmp/site/index.html
          grep -Fq 'Cell S/N으로 연결하는 Power Query·Excel VBA 조회도구' /tmp/site/index.html
          grep -Fq 'contributing to the December 2024 team result' /tmp/site/en/index.html
          grep -Fq 'Power Query and Excel VBA tool' /tmp/site/en/index.html
          grep -Fq '금양 재직 중 연계 프로젝트' /tmp/site/posts/battery-2170-pilot/index.html
          grep -Fq '/posts/battery-4695-production-transition/' /tmp/site/posts/battery-2170-pilot/index.html
          grep -Fq '/posts/battery-25p-lfp-development/' /tmp/site/posts/battery-2170-pilot/index.html
          grep -Fq '/posts/battery-tabless-concept/' /tmp/site/posts/battery-2170-pilot/index.html
          grep -Fq '/posts/can-supplier-pilot-transition/' /tmp/site/posts/battery-2170-pilot/index.html
          grep -Fq '같은 Pilot Line의 상위 프로젝트' /tmp/site/posts/ncm-pre-forming-validation/index.html
          grep -Fq '같은 Pilot Line의 상위 프로젝트' /tmp/site/posts/cell-production-tracking/index.html
          grep -Fq 'CTB Tubing' /tmp/site/posts/battery-2170-pilot/index.html
          grep -Fq 'Cap Plate C-Cut' /tmp/site/posts/ncm-fat-sat/index.html
          test -s /tmp/site/images/projects/2170-stabilization-flow.svg
          test -s /tmp/site/images/projects/4695-production-transition-flow.svg
          test -s /tmp/site/images/projects/25p-lfp-development-gate.svg
          test -s /tmp/site/images/projects/2170-tabless-a-sample-gate.svg
          test -s /tmp/site/images/projects/can-supplier-validation-flow.svg
          test -s /tmp/site/images/projects/ncm-acceptance-flow.svg
          test -s /tmp/site/images/projects/ncm-pre-forming-flow.svg
          test -s /tmp/site/images/projects/cell-production-tracking-flow.svg

      - name: Synchronize and commit generated site
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/' /tmp/site/ ./
          rm -f .github/workflows/publish-kumyang-jestech-batch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No generated-site changes were produced.' >&2
            exit 1
          fi
          git commit -m 'deploy(portfolio): publish Kumyang and Jastech employment batch'
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '/tmp/site'

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
