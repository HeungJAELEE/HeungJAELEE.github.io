name: Deploy 5M+1E portfolio terminology

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-5m1e-terminology.yml'

permissions:
  contents: write

concurrency:
  group: portfolio-public-write
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact public base
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify only the temporary workflow changed after the public base
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor b02a5a9f949c2793b14deeed46d836757f244705 HEAD
          test "$(git diff --name-only b02a5a9f949c2793b14deeed46d836757f244705..HEAD | sort -u)" = ".github/workflows/deploy-5m1e-terminology.yml"

      - name: Download exact validated Hugo artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-542c-8211-9a8e-4c33e234fb56/raw?se=2026-08-11T04%3A59%3A13Z&sp=r&sv=2026-02-06&sr=b&scid=1d90aa2b-2654-5dca-ba49-ce43a37c2ef8&skoid=b1bca990-dcac-4c31-8ca1-ac563cf24c54&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-11T00%3A46%3A33Z&ske=2026-08-12T00%3A46%3A33Z&sks=b&skv=2026-02-06&sig=/4bSk8jcWTnhd8E8aK5cEZOmRQgZlxEfoDuUZdP5pok%3D' -o /tmp/portfolio-public.zip
          echo '32be6d9177e855319aa766af40253fd49ab5b6a75d6b14c4e7791bf0488fe331  /tmp/portfolio-public.zip' | sha256sum -c -
          rm -rf /tmp/portfolio-public
          mkdir -p /tmp/portfolio-public
          unzip -q /tmp/portfolio-public.zip -d /tmp/portfolio-public

      - name: Verify 5M+1E artifact and derived outputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import unquote, urlsplit
          import json
          import re
          import xml.etree.ElementTree as ET

          root = Path('/tmp/portfolio-public')
          required = {
              'posts/battery-2170-pilot/index.html': ['라인 공통 5M+1E 분석', '5M+1E 분석'],
              'posts/ncm-fat-sat/index.html': ['FAT·SAT 검수축 — 5M+1E 분석'],
              'posts/ncm-pre-forming-validation/index.html': ['5M+1E 원인분석'],
              'en/posts/battery-2170-pilot/index.html': ['Line-wide 5M+1E analysis', 'Local 5M+1E analysis'],
              'en/posts/ncm-fat-sat/index.html': ['5M+1E analysis'],
              'en/posts/ncm-pre-forming-validation/index.html': ['5M+1E cause analysis'],
              'print/featured-projects-ko/index.html': ['5M+1E 분석'],
          }
          for rel, values in required.items():
              text = (root / rel).read_text(encoding='utf-8')
              for value in values:
                  assert value in text, (rel, value)

          patterns = [
              re.compile(r'4M\s*[+·]\s*2E', re.I),
              re.compile(r'4M\s*[+·]\s*Measurement', re.I),
              re.compile(r'5M\s*\+\s*1E\s*(?:판단|판정)', re.I),
          ]
          failures = []
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.html', '.json', '.xml', '.svg', '.txt'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if any(pattern.search(text) for pattern in patterns):
                  failures.append(path.relative_to(root).as_posix())
          assert not failures, failures[:20]

          json.loads((root / 'index.json').read_text(encoding='utf-8'))
          xml_files = list(root.rglob('*.xml'))
          for path in xml_files:
              ET.parse(path)

          targets = set()
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              rel = path.relative_to(root).as_posix()
              targets.add('/' + rel)
              if rel == 'index.html':
                  targets.add('/')
              elif rel.endswith('/index.html'):
                  targets.add('/' + rel[:-10])
          missing = []
          attr_re = re.compile(r'''(?:href|src)=["']([^"']+)["']''', re.I)
          for html in root.rglob('*.html'):
              for raw in attr_re.findall(html.read_text(encoding='utf-8')):
                  if not raw.startswith('/') or raw.startswith('//'):
                      continue
                  path = unquote(urlsplit(raw).path)
                  if path in {'', '/'}:
                      continue
                  candidates = {path, path + '/index.html'} if not path.endswith('/') else {path, path + 'index.html'}
                  if not any(candidate in targets for candidate in candidates):
                      missing.append((html.relative_to(root).as_posix(), raw))
          assert not missing, missing[:20]
          print(f'5M+1E artifact validation: {len(xml_files)} XML parsed, local link misses 0')
          PY

      - name: Publish exact artifact
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='.*' /tmp/portfolio-public/ ./
          touch .nojekyll
          rm -f .github/workflows/deploy-5m1e-terminology.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'deploy(portfolio): normalize cause analysis to 5M+1E'
          git push origin HEAD:main
