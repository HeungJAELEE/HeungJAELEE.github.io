name: Publish 4695 manufacturing-language rewrite

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-4695-manufacturing-language.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out committed site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated Hugo artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-7c94-8206-90dd-7e4871024aa6/raw?se=2026-08-08T17%3A51%3A24Z&sp=r&sv=2026-02-06&sr=b&scid=7e4ddfac-786e-5fd0-a132-02e64622221f&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-08T01%3A09%3A01Z&ske=2026-08-09T01%3A09%3A01Z&sks=b&skv=2026-02-06&sig=l96Yel2C/DpPgQ1c1U/NHy2YVRhQSRgmd3Xm56j852U%3D' \
            --output /tmp/portfolio-public.zip
          echo 'f29c06a3948c8977f9b23a31a00b66ddb8becdce1e5fca46f6dd580e693fa919  /tmp/portfolio-public.zip' | sha256sum --check
          rm -rf /tmp/site
          mkdir -p /tmp/site
          unzip -q /tmp/portfolio-public.zip -d /tmp/site

      - name: Verify 4695 manufacturing language and portfolio regressions
        shell: bash
        run: |
          set -euo pipefail
          KO='/tmp/site/posts/battery-4695-production-transition/index.html'
          EN='/tmp/site/en/posts/battery-4695-production-transition/index.html'
          SVG='/tmp/site/images/projects/battery-4695-production-transition-flow.svg'
          test -s "$KO"
          test -s "$EN"
          test -s "$SVG"

          grep -Fq '인계 당시 설비 상태' "$KO"
          grep -Fq '생산을 시작하기 전에 다시 맞춘 기준' "$KO"
          grep -Fq '4M와 측정항목으로 나눈 원인' "$KO"
          grep -Fq '레이저 용접설비 3대' "$KO"
          grep -Fq 'X-Ray와 비전검사' "$KO"
          grep -Fq '영구개조가 남은 설비' "$KO"
          grep -Fq '50 Cell 전공정 연속 생산시험' "$KO"
          grep -Fq '비전 육안검사' "$KO"
          grep -Fq '제한 생산 시작 판정' "$KO"

          grep -Fq 'Equipment condition at handoff' "$EN"
          grep -Fq 'Three laser-welding machines' "$EN"
          grep -Fq 'Machines that still required redesign' "$EN"
          grep -Fq '50-cell continuous run through the full process' "$EN"

          BAD_PATTERN='프로젝트[[:space:]]*SOW|프로젝트[[:space:]]*WBS|대표[[:space:]]*Case|검사[[:space:]]*Gate|현장[[:space:]]*Control|완료[[:space:]]*경계|통제된[[:space:]]*수동개입|One-way[[:space:]]*Run|EQUIPMENT[[:space:]]*RECOVERY|Project[[:space:]]*SOW|Project[[:space:]]*WBS|controlled[[:space:]]*manual[[:space:]]*intervention|one-way[[:space:]]*run|Completion[[:space:]]*boundary|>PASS<|>LIMITED<'
          if grep -Eqi "$BAD_PATTERN" "$KO" "$EN" "$SVG"; then
            echo 'PM/software-style wording found in publish artifact' >&2
            exit 1
          fi

          test -s /tmp/site/posts/battery-2170-pilot/index.html
          test -s /tmp/site/posts/battery-25p-lfp-development/index.html
          test -s /tmp/site/posts/battery-tabless-concept/index.html
          test -s /tmp/site/posts/can-supplier-pilot-transition/index.html
          test -s /tmp/site/posts/ncm-fat-sat/index.html
          test -s /tmp/site/posts/ncm-pre-forming-validation/index.html
          test -s /tmp/site/posts/cell-production-tracking/index.html

      - name: Synchronize and commit generated site
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/' /tmp/site/ ./
          rm -f .github/workflows/publish-4695-manufacturing-language.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No generated-site changes were produced.' >&2
            exit 1
          fi
          git commit -m 'deploy(portfolio): publish 4695 manufacturing-language rewrite'
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '/tmp/site'

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
