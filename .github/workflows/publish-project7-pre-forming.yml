name: Publish NCM pre-forming manufacturing refactor

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-project7-pre-forming.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out committed site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated Hugo artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-9ae8-8211-ae94-99048d6ef542/raw?se=2026-08-08T10%3A15%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=cbbff7f3-fbe2-5089-9232-a19adc240a10&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-07T22%3A58%3A55Z&ske=2026-08-08T22%3A58%3A55Z&sks=b&skv=2026-02-06&sig=RYPcqJkwhI%2B80YzwgAyMm1dxslH2bQEjDD6nVixl/Hw%3D' \
            --output /tmp/portfolio-public.zip
          echo '07e84ff67f68382f73da3cf7305c9d5831bda60a41b7c9822803399a4e0ec8a7  /tmp/portfolio-public.zip' | sha256sum --check
          rm -rf /tmp/site
          mkdir -p /tmp/site
          unzip -q /tmp/portfolio-public.zip -d /tmp/site

      - name: Verify pre-forming page and manufacturing regressions
        shell: bash
        run: |
          set -euo pipefail
          KO='/tmp/site/posts/ncm-pre-forming-validation/index.html'
          EN='/tmp/site/en/posts/ncm-pre-forming-validation/index.html'
          PARENT_KO='/tmp/site/posts/ncm-fat-sat/index.html'
          PARENT_EN='/tmp/site/en/posts/ncm-fat-sat/index.html'
          test -s "$KO"
          test -s "$EN"
          test -s "$PARENT_KO"
          test -s "$PARENT_EN"
          test -s /tmp/site/images/projects/ncm-pre-forming-flow.svg

          grep -Fq 'NCM Pre-Forming 무지부 손상·Short 개선 및 Pilot Jig 검증' "$KO"
          grep -Fq '프로젝트 SOW' "$KO"
          grep -Fq '프로젝트 WBS' "$KO"
          grep -Fq '공정 전체 4M+2E 원인판정' "$KO"
          grep -Fq '초기 폐기 Sample 약 200개' "$KO"
          grep -Fq '4개 Lot × 50개' "$KO"
          grep -Fq '약 400개 Sample' "$KO"
          grep -Fq '양산설비 RFQ·설계·제작 요구 반영' "$KO"
          grep -Fq 'Gate 판정' "$KO"
          grep -Fq 'NCM Pre-Forming 무지부 손상·Short 개선 및 Pilot Jig 검증' "$PARENT_KO"

          grep -Fq 'NCM Pre-Forming Uncoated-Edge Damage / Short Control and Pilot-Jig Validation' "$EN"
          grep -Fq 'Project SOW' "$EN"
          grep -Fq 'Project WBS' "$EN"
          grep -Fq 'Project-level 4M+2E cause disposition' "$EN"
          grep -Fq 'about 200 initial disposable samples' "$EN"
          grep -Fq 'four lots × 50 samples' "$EN"
          grep -Fq 'about 400 samples' "$EN"
          grep -Fq 'Shipment, site installation, unit testing' "$EN"
          grep -Fq 'NCM pre-forming uncoated-edge damage / short control and pilot-jig validation' "$PARENT_EN"

          test -s /tmp/site/posts/battery-2170-pilot/index.html
          test -s /tmp/site/posts/battery-4695-production-transition/index.html
          test -s /tmp/site/posts/battery-25p-lfp-development/index.html
          test -s /tmp/site/posts/battery-tabless-concept/index.html
          test -s /tmp/site/posts/can-supplier-pilot-transition/index.html
          test -s /tmp/site/posts/ncm-fat-sat/index.html

          if grep -Eqi '400[^<]{0,20}(양품|good samples)|Short[^<]{0,30}(Zero|제로|0건)[^<]{0,30}(달성|완료|achieved)|mass production (launched|completed|validated)' "$KO" "$EN"; then
            echo 'Prohibited pre-forming claim found in publish artifact' >&2
            exit 1
          fi

      - name: Synchronize and commit generated site
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/' /tmp/site/ ./
          rm -f .github/workflows/publish-project7-pre-forming.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No generated-site changes were produced.' >&2
            exit 1
          fi
          git commit -m 'deploy(portfolio): publish NCM pre-forming manufacturing refactor'
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '/tmp/site'

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
