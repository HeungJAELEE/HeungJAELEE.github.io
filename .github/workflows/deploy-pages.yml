name: Deploy committed Hugo output to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out committed Hugo output
        uses: actions/checkout@v4

      - name: Verify portfolio titles, structures, and evidence images
        shell: bash
        run: |
          set -euo pipefail
          KO_WELD='posts/welding-vision-ai/index.html'
          EN_WELD='en/posts/welding-vision-ai/index.html'
          KO_GIGA='posts/giga-press-dx/index.html'
          KO_INDY='posts/robot-json-omniverse/index.html'
          test -s "$KO_WELD"
          test -s "$EN_WELD"
          test -s "$KO_GIGA"
          test -s "$KO_INDY"
          grep -Fq '용접실기품 외관검사 Vision AI Project' "$KO_WELD"
          grep -Fq '전체 모델링 구조' "$KO_WELD"
          grep -Fq '왜 이 순서로 평가했는가' "$KO_WELD"
          grep -Fq '후보 아키텍처를 비교한 이유' "$KO_WELD"
          grep -Fq '최종 모델 구조' "$KO_WELD"
          grep -Fq 'Threshold를 검사조건으로 바꾼 방법' "$KO_WELD"
          grep -Fq 'Overall modeling architecture' "$EN_WELD"
          grep -Fq 'Final model architecture' "$EN_WELD"
          grep -Fq 'GIGA Press 공정 Digital Twin DX Project' "$KO_GIGA"
          grep -Fq '자동차 공장 Digital Twin DX Project' "$KO_INDY"
          grep -Fq 'portfolio-article__header' "$KO_INDY"
          if grep -Fq '<section class="hero">' "$KO_INDY"; then
            echo 'Standalone Indy7 template detected' >&2
            exit 1
          fi
          for asset in \
            images/projects/welding-vision-domain-gap.jpg \
            images/projects/welding-vision-report-augmentation.svg \
            images/projects/welding-vision-metric-improvement.svg \
            images/projects/welding-vision-report-threshold.svg \
            images/projects/welding-vision-report-app-flow.svg \
            images/projects/welding-vision-app-results.webp
          do
            test -s "$asset"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
