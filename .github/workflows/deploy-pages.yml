name: Deploy committed Hugo output to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out committed Hugo output
        uses: actions/checkout@v4

      - name: Verify portfolio titles, structures, and evidence images
        shell: bash
        run: |
          set -euo pipefail
          KO_WELD='posts/welding-vision-ai/index.html'
          EN_WELD='en/posts/welding-vision-ai/index.html'
          KO_GIGA='posts/giga-press-dx/index.html'
          KO_INDY='posts/robot-json-omniverse/index.html'
          test -s "$KO_WELD"
          test -s "$EN_WELD"
          test -s "$KO_GIGA"
          test -s "$KO_INDY"
          grep -Fq '용접실기품 외관검사 Vision AI Project' "$KO_WELD"
          grep -Fq '전체 모델링 구조' "$KO_WELD"
          grep -Fq '왜 이 순서로 평가했는가' "$KO_WELD"
          grep -Fq '검사대상 — 언더컷과 오버랩' "$KO_WELD"
          grep -Fq '고객 승인이나 공인 인증 결과가 아닙니다' "$KO_WELD"
          grep -Fq 'Overall modeling architecture' "$EN_WELD"
          grep -Fq 'Inspection targets — undercut and overlap' "$EN_WELD"
          grep -Fq 'not customer approval or certification' "$EN_WELD"
          grep -Fq 'GIGA Press 공정 Digital Twin DX Project' "$KO_GIGA"
          grep -Fq '자동차 공장 Digital Twin DX Project' "$KO_INDY"
          grep -Fq 'portfolio-article__header' "$KO_INDY"
          if grep -Fq '<section class="hero">' "$KO_INDY"; then
            echo 'Standalone Indy7 template detected' >&2
            exit 1
          fi
          for page in "$KO_WELD" "$EN_WELD"; do
            grep -Fq 'welding-p08-defect-types.avif' "$page"
            grep -Fq 'welding-p07-source-data.avif' "$page"
            grep -Fq 'welding-p11-domain-gap.avif' "$page"
            grep -Fq 'welding-p15-baseline-field.avif' "$page"
            grep -Fq 'welding-p17-augmentation-result.avif' "$page"
            grep -Fq 'welding-p19-final-ensemble.avif' "$page"
            ! grep -Fq 'ANALYSIS OF NANO-ROBOT' "$page"
          done
          for asset in \
            images/projects/welding-p08-defect-types.avif \
            images/projects/welding-p07-source-data.avif \
            images/projects/welding-p11-domain-gap.avif \
            images/projects/welding-p15-baseline-field.avif \
            images/projects/welding-p17-augmentation-result.avif \
            images/projects/welding-p19-final-ensemble.avif \
            images/projects/welding-vision-report-augmentation.svg \
            images/projects/welding-vision-report-threshold.svg \
            images/projects/welding-vision-app-results.webp
          do
            test -s "$asset"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
