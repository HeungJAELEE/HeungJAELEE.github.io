name: Publish verified Hugo artifact to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download verified Hugo build artifact
        shell: bash
        env:
          ARTIFACT_URL: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-3df4-8206-97f0-0ac5712ee73b/raw?se=2026-08-07T01%3A57%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=0ad4b535-0dd3-5659-8db2-1dadb8e1659a&skoid=0b778285-7b0b-4cdc-ac3b-fb93e8c3686f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-06T05%3A24%3A36Z&ske=2026-08-07T05%3A24%3A36Z&sks=b&skv=2026-02-06&sig=6Ykm4AuCwmOpawHlAb09CkKqDCMonjlzexUAPJR2vsg%3D'
        run: |
          set -euo pipefail
          rm -rf _site artifact.zip
          mkdir -p _site
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output artifact.zip
          unzip -q artifact.zip -d _site

      - name: Verify standard Indy7 template and content
        shell: bash
        run: |
          set -euo pipefail
          KO='_site/posts/robot-json-omniverse/index.html'
          EN='_site/en/posts/robot-json-omniverse/index.html'
          test -s "$KO"
          test -s "$EN"
          grep -Fq '자동차 공장 Digital Twin DX Project' "$KO"
          grep -Fq 'portfolio-article__header' "$KO"
          grep -Fq 'portfolio-article-toc' "$KO"
          grep -Fq '기존 Robot Teaching Data를 Digital Twin으로 연결한 방법' "$KO"
          grep -Fq 'Team SOW' "$KO"
          grep -Fq 'Personal WBS' "$KO"
          grep -Fq 'sequenceDiagram' "$KO"
          if grep -Fq '<section class="hero">' "$KO"; then
            echo 'Standalone replacement template detected' >&2
            exit 1
          fi

      - name: Synchronize generated site into deployment repository
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'artifact.zip' \
            _site/ ./
          rm -rf _site artifact.zip

      - name: Commit generated Hugo output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated-site changes to commit.'
          else
            git commit -m 'deploy: restore standard template and publish Indy7 Digital Twin refactor'
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
