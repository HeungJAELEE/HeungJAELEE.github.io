name: Deploy prebuilt Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-pages.yml'
      - 'posts/**'
      - 'en/posts/**'
      - 'images/**'
      - 'index.html'
      - 'en/index.html'
      - 'application.*'
      - '.nojekyll'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out prebuilt Hugo output
        uses: actions/checkout@v4

      - name: Verify Indy7 deployment artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f .nojekyll
          test -s index.html
          test -s posts/robot-json-omniverse/index.html
          test -s en/posts/robot-json-omniverse/index.html
          grep -Fq 'Indy7 자동차 공장 통합 제어·추적 Digital Twin PoC' posts/robot-json-omniverse/index.html
          grep -Fq 'Project SOW' posts/robot-json-omniverse/index.html
          grep -Fq 'Project WBS' posts/robot-json-omniverse/index.html
          for asset in \
            images/projects/indy7-automotive-poc/cell-overview.avif \
            images/projects/indy7-automotive-poc/qr-mysql-history.avif \
            images/projects/indy7-automotive-poc/window-assembly.avif \
            images/projects/indy7-automotive-poc/vision-color-detection.avif \
            images/projects/indy7-automotive-poc/vision-color-f1.avif \
            images/projects/indy7-automotive-poc/vision-window-detection.avif \
            images/projects/indy7-automotive-poc/vision-window-f1.avif \
            images/projects/indy7-automotive-poc/routing-good.avif \
            images/projects/indy7-automotive-poc/plc-ladder.avif \
            images/projects/indy7-web-twin-read-only.png \
            images/projects/evidence/indy7-traceability-demo.webp
          do
            test -s "$asset"
            test "$(wc -c < "$asset")" -gt 1000
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
