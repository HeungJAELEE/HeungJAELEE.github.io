name: Deploy committed Hugo output to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out committed Hugo output
        uses: actions/checkout@v4

      - name: Verify catalog titles, project structure, and images
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import html
          import re
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          root = Path('.')

          def text_only(value: str) -> str:
              return html.unescape(re.sub(r'<[^>]+>', '', value)).strip()

          def verify_catalog(prefix: str) -> None:
              index = root / prefix / 'posts' / 'index.html' if prefix else root / 'posts' / 'index.html'
              source = index.read_text(encoding='utf-8')
              cards = re.findall(r'<h2><a href=(?:"([^"]+)"|\'([^\']+)\'|([^ >]+))>(.*?)</a></h2>', source, flags=re.S)
              if len(cards) < 15:
                  raise SystemExit(f'unexpected card count in {index}: {len(cards)}')
              errors = []
              for quoted, single, bare, raw_title in cards:
                  href = quoted or single or bare
                  card_title = text_only(raw_title)
                  rel = urlsplit(href).path.lstrip('/')
                  page = root / rel / 'index.html'
                  if not page.is_file():
                      errors.append(f'missing detail page: {href}')
                      continue
                  detail = page.read_text(encoding='utf-8')
                  match = re.search(r'<h1>(.*?)</h1>', detail, flags=re.S)
                  detail_title = text_only(match.group(1)) if match else '<missing h1>'
                  if card_title != detail_title:
                      errors.append(f'{href}: catalog={card_title!r}, detail={detail_title!r}')
              if errors:
                  raise SystemExit('catalog/detail title mismatch:\n' + '\n'.join(errors))

          verify_catalog('')
          verify_catalog('en')

          required_pages = {
              'posts/robot-json-omniverse/index.html': [
                  '자동차 공장 Digital Twin DX Project',
                  'portfolio-article__header',
                  'portfolio-article-toc',
              ],
              'posts/giga-press-dx/index.html': [
                  'GIGA Press 공정 Digital Twin DX Project',
                  '프로젝트 구현 목표 — Team SOW',
                  '프로젝트 진행순서 — Team WBS',
                  '나의 역할 — Digital Twin 시스템 설계·통합',
                  'stateDiagram-v2',
                  'giga-press-report-process-flow.svg',
                  'evidence/giga-press-control-demo.webp',
                  'giga-press-team-demo.jpg',
                  'evidence/giga-press-analysis-prototype.webp',
                  'giga-press-report-ladder-modularization.svg',
                  'giga-press-report-dqn-concept.svg',
              ],
              'en/posts/giga-press-dx/index.html': [
                  'GIGA Press Process Digital Twin DX Project',
                  'Team implementation scope — Team SOW',
                  'My role — Digital Twin system design and integration',
                  'stateDiagram-v2',
              ],
              'posts/welding-vision-ai/index.html': [
                  '용접실기품 외관검사 Vision AI Project',
                  '프로젝트 구현 목표 — Team SOW',
                  '나의 역할 — AI 모델링·평가기준 설계',
                  '저해상도 좌표를 원본사진에 맞춘 방법',
                  'scale_x',
                  'Threshold를 검사조건으로 바꾼 방법',
                  'welding-vision-domain-gap.jpg',
                  'welding-vision-report-augmentation.svg',
                  'welding-vision-metric-improvement.svg',
                  'welding-vision-report-threshold.svg',
                  'welding-vision-report-app-flow.svg',
                  'welding-vision-app-results.webp',
              ],
              'en/posts/welding-vision-ai/index.html': [
                  'Practical Weld-Specimen Vision AI Inspection Project',
                  'Team implementation scope — Team SOW',
                  'My role — AI modeling and evaluation-criteria design',
                  'Mapping low-resolution coordinates back to the source image',
                  'scale_x',
              ],
          }
          for rel, values in required_pages.items():
              page = root / rel
              if not page.is_file():
                  raise SystemExit(f'missing committed page: {rel}')
              source = page.read_text(encoding='utf-8')
              for value in values:
                  if value not in source:
                      raise SystemExit(f'{rel}: missing {value}')

          ko_catalog = (root / 'posts/index.html').read_text(encoding='utf-8')
          en_catalog = (root / 'en/posts/index.html').read_text(encoding='utf-8')
          for title in ['자동차 공장 Digital Twin DX Project', 'GIGA Press 공정 Digital Twin DX Project', '용접실기품 외관검사 Vision AI Project']:
              if title not in ko_catalog:
                  raise SystemExit(f'Korean catalog title missing: {title}')
          for title in ['Automotive Factory Digital Twin DX Project', 'GIGA Press Process Digital Twin DX Project', 'Practical Weld-Specimen Vision AI Inspection Project']:
              if title not in en_catalog:
                  raise SystemExit(f'English catalog title missing: {title}')

          missing = []
          image_pattern = re.compile(r'<img\b[^>]*?\bsrc=(?:"([^"]+)"|\'([^\']+)\'|([^\s>]+))', flags=re.I | re.S)
          for page in root.rglob('*.html'):
              source = page.read_text(encoding='utf-8')
              for match in image_pattern.finditer(source):
                  src = match.group(1) or match.group(2) or match.group(3)
                  parsed = urlsplit(html.unescape(src))
                  if parsed.scheme or parsed.netloc or parsed.path.startswith('data:'):
                      continue
                  path = unquote(parsed.path)
                  if not path.startswith('/images/'):
                      continue
                  asset = root / path.lstrip('/')
                  if not asset.is_file() or asset.stat().st_size == 0:
                      missing.append(f'{page.relative_to(root)} -> {path}')
          if missing:
              raise SystemExit('missing image assets:\n' + '\n'.join(sorted(set(missing))))

          marker = re.compile(r'TRUNCATED_FOR_TOOL|ELLIPSIZATION')
          embedded = re.compile(r'data:image/(?:jpeg|png|webp);base64,([^"\']+)')
          for svg in (root / 'images').rglob('*.svg'):
              source = svg.read_text(encoding='utf-8')
              if marker.search(source):
                  raise SystemExit(f'truncation marker remains in {svg}')
              for match in embedded.finditer(source):
                  base64.b64decode(match.group(1), validate=True)

          indy = (root / 'posts/robot-json-omniverse/index.html').read_text(encoding='utf-8')
          assert '<section class="hero">' not in indy

          print('committed portfolio validation: PASS')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
