name: Deploy committed Hugo output to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out committed Hugo output
        uses: actions/checkout@v4

      - name: Verify current portfolio, index, feeds, and local links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import unquote, urlsplit
          from html import unescape
          import json
          import re
          import xml.etree.ElementTree as ET

          root = Path('.')
          route_checks = {
              'index.html': '#home',
              'posts/index.html': '#gallery',
              'posts/battery-2170-pilot/index.html': '#battery-2170-pilot',
              'posts/ai-authority-evidence-plane/index.html': '#ai-authority-evidence-plane',
              'en/index.html': '#home',
              'en/posts/index.html': '#gallery',
              'en/posts/battery-2170-pilot/index.html': '#battery-2170-pilot',
              'en/posts/ai-authority-evidence-plane/index.html': '#ai-authority-evidence-plane',
          }
          required_assets = [
              'base.css',
              'components.css',
              'app.js',
              'preserved-content.js',
              'preserved-content-en.js',
              'revised-content-ko.js',
              'revised-content-en.js',
              'naturalize-all-projects.js',
              'mermaid-init.js',
          ]

          for relative_path, route in route_checks.items():
              text = (root / relative_path).read_text(encoding='utf-8')
              assert re.search(r'id=(?:"app"|app)', text), f'{relative_path}: application root'
              assert './components.css?v=20260814-16' in text, f'{relative_path}: stylesheet version'
              assert './app.js?v=20260814-16' in text, f'{relative_path}: runtime version'
              assert './revised-content-ko.js?v=20260814-16' in text, f'{relative_path}: Korean bundle'
              assert './revised-content-en.js?v=20260814-16' in text, f'{relative_path}: English bundle'
              assert route in text, f'{relative_path}: route {route}'

          for name in required_assets:
              assert (root / name).is_file(), name

          ko_revised = (root / 'revised-content-ko.js').read_text(encoding='utf-8')
          en_revised = (root / 'revised-content-en.js').read_text(encoding='utf-8')
          assert ko_revised.count('sourceHash') == 22, 'Korean project bundle count'
          assert en_revised.count('sourceHash') == 22, 'English project bundle count'

          app_source = (root / 'app.js').read_text(encoding='utf-8')
          for forbidden in [
              'Not yet applied to the live portfolio',
              '운영 포트폴리오에는 아직 반영하지 않았습니다',
              '로컬 디자인 검토용',
              '127.0.0.1',
              'localhost',
          ]:
              assert forbidden not in app_source, forbidden

          assert (root / '.nojekyll').is_file()
          assert (root / 'assets/source/projects/agent-os-manufacturing-lineage.svg').is_file()
          for name in [
              'learning-analytics.png',
              'written-theory.png',
              'written-mock.png',
              'practical-written-theory.png',
              'practical-written-answer.png',
              'practical-work-guide.png',
          ]:
              assert (root / 'assets/source/projects/seolbi-learning' / name).is_file(), name
          json.loads((root / 'index.json').read_text(encoding='utf-8'))

          xml_files = list(root.rglob('*.xml'))
          assert xml_files, 'No XML files found'
          for path in xml_files:
              ET.parse(path)

          local_targets = set()
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              rel = path.as_posix().lstrip('./')
              local_targets.add('/' + rel)
              if rel == 'index.html':
                  local_targets.add('/')
              elif rel.endswith('/index.html'):
                  local_targets.add('/' + rel[:-10])

          missing = []
          attr_re = re.compile(r'''(?:href|src)=["']([^"']+)["']''', re.I)
          for html in root.rglob('*.html'):
              text = html.read_text(encoding='utf-8')
              for raw in attr_re.findall(text):
                  if not raw.startswith('/') or raw.startswith('//'):
                      continue
                  path = unquote(urlsplit(unescape(raw)).path)
                  if path in {'', '/'}:
                      continue
                  candidates = {path, path + '/index.html'} if not path.endswith('/') else {path, path + 'index.html'}
                  if not any(candidate in local_targets for candidate in candidates):
                      missing.append((html.as_posix(), raw))
          assert not missing, missing[:20]
          print(f'Pages verification: {len(xml_files)} XML parsed, local link misses 0')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
