name: Build Hugo source and deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio source
        uses: actions/checkout@v4
        with:
          repository: HeungJAELEE/blog-source
          ref: codex/portfolio-evidence-v3
          path: source
          submodules: recursive
          fetch-depth: 1

      - name: Set up Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.161.1'
          extended: true

      - name: Build production site
        shell: bash
        run: |
          set -euo pipefail
          hugo --gc --minify --environment production \
            --source source \
            --destination "$GITHUB_WORKSPACE/public"

      - name: Verify Indy7 page and standard template
        shell: bash
        run: |
          set -euo pipefail
          KO='public/posts/robot-json-omniverse/index.html'
          EN='public/en/posts/robot-json-omniverse/index.html'
          test -s "$KO"
          test -s "$EN"
          grep -Fq '자동차 공장 Digital Twin DX Project' "$KO"
          grep -Fq 'portfolio-article__header' "$KO"
          grep -Fq 'portfolio-article-toc' "$KO"
          grep -Fq '기존 Robot Teaching Data를 Digital Twin으로 연결한 방법' "$KO"
          grep -Fq 'Team SOW' "$KO"
          grep -Fq 'Personal WBS' "$KO"
          grep -Fq 'sequenceDiagram' "$KO"
          if grep -Fq '<section class="hero">' "$KO"; then
            echo 'Standalone replacement template detected' >&2
            exit 1
          fi
          for asset in \
            public/images/projects/indy7-automotive-poc/cell-overview.avif \
            public/images/projects/indy7-automotive-poc/qr-mysql-history.avif \
            public/images/projects/indy7-automotive-poc/window-assembly.avif \
            public/images/projects/indy7-automotive-poc/vision-color-detection.avif \
            public/images/projects/indy7-automotive-poc/vision-color-f1.avif \
            public/images/projects/indy7-automotive-poc/vision-window-detection.avif \
            public/images/projects/indy7-automotive-poc/vision-window-f1.avif \
            public/images/projects/indy7-automotive-poc/routing-good.avif \
            public/images/projects/indy7-web-twin-read-only.png \
            public/images/projects/evidence/indy7-traceability-demo.webp
          do
            test -s "$asset"
            test "$(wc -c < "$asset")" -gt 1000
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
