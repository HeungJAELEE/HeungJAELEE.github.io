name: Publish welding model architecture refactor

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download verified Hugo artifact
        shell: bash
        env:
          ARTIFACT_URL: 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-ee3c-8209-b5e0-5189437a12de/raw?se=2026-08-07T05%3A47%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=6add19b3-3ba3-538f-9122-aa5c7eea8ee6&skoid=b1bca990-dcac-4c31-8ca1-ac563cf24c54&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-07T04%3A41%3A56Z&ske=2026-08-08T04%3A41%3A56Z&sks=b&skv=2026-02-06&sig=wTgAGMsePNrwYzPtiDJFwf%2BgvL0FWWPEYjC71O1VAuw%3D'
        run: |
          set -euo pipefail
          rm -rf _site artifact.zip
          mkdir -p _site
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output artifact.zip
          unzip -q artifact.zip -d _site

      - name: Verify welding structure and existing evidence images
        shell: bash
        run: |
          set -euo pipefail
          KO='_site/posts/welding-vision-ai/index.html'
          EN='_site/en/posts/welding-vision-ai/index.html'
          test -s "$KO"
          test -s "$EN"
          grep -Fq '전체 모델링 구조' "$KO"
          grep -Fq '왜 이 순서로 평가했는가' "$KO"
          grep -Fq '후보 아키텍처를 비교한 이유' "$KO"
          grep -Fq 'ResNet-50 + DeiT-Small을 선택한 이유' "$KO"
          grep -Fq '최종 모델 구조' "$KO"
          grep -Fq 'Threshold를 검사조건으로 바꾼 방법' "$KO"
          grep -Fq 'Overall modeling architecture' "$EN"
          grep -Fq 'Why the evaluation was performed in this order' "$EN"
          grep -Fq 'Final model architecture' "$EN"
          for asset in \
            _site/images/projects/welding-vision-domain-gap.jpg \
            _site/images/projects/welding-vision-report-augmentation.svg \
            _site/images/projects/welding-vision-metric-improvement.svg \
            _site/images/projects/welding-vision-report-threshold.svg \
            _site/images/projects/welding-vision-report-app-flow.svg \
            _site/images/projects/welding-vision-app-results.webp
          do
            test -s "$asset"
          done

      - name: Synchronize generated Hugo output
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'artifact.zip' \
            _site/ ./
          rm -rf _site artifact.zip

      - name: Commit generated output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated-site changes to commit.'
          else
            git commit -m 'deploy: publish welding model architecture and evaluation rationale'
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
