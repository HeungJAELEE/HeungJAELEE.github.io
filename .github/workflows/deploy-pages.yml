name: Deploy committed Hugo output to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out committed Hugo output
        uses: actions/checkout@v4

      - name: Verify standard Indy7 template and content
        shell: bash
        run: |
          set -euo pipefail
          KO='posts/robot-json-omniverse/index.html'
          EN='en/posts/robot-json-omniverse/index.html'
          test -s "$KO"
          test -s "$EN"
          grep -Fq '<title>자동차 공장 Digital Twin DX Project' "$KO"
          grep -Fq 'property="og:title" content="자동차 공장 Digital Twin DX Project"' "$KO"
          grep -Fq 'portfolio-article__header' "$KO"
          grep -Fq 'portfolio-article-toc' "$KO"
          grep -Fq '기존 Robot Teaching Data를 Digital Twin으로 연결한 방법' "$KO"
          grep -Fq 'Team SOW' "$KO"
          grep -Fq 'Personal WBS' "$KO"
          grep -Fq 'sequenceDiagram' "$KO"
          if grep -Fq '<section class="hero">' "$KO"; then
            echo 'Standalone replacement template detected' >&2
            exit 1
          fi
          for asset in \
            images/projects/indy7-automotive-poc/cell-overview.avif \
            images/projects/indy7-automotive-poc/qr-mysql-history.avif \
            images/projects/indy7-automotive-poc/window-assembly.avif \
            images/projects/indy7-automotive-poc/vision-color-detection.avif \
            images/projects/indy7-automotive-poc/vision-color-f1.avif \
            images/projects/indy7-automotive-poc/vision-window-detection.avif \
            images/projects/indy7-automotive-poc/vision-window-f1.avif \
            images/projects/indy7-automotive-poc/routing-good.avif \
            images/projects/indy7-web-twin-read-only.png \
            images/projects/evidence/indy7-traceability-demo.webp
          do
            test -s "$asset"
            test "$(wc -c < "$asset")" -gt 1000
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
