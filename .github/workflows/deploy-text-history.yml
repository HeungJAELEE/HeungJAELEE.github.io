name: Verify interview-focused portfolio text live

on:
  push:
    branches:
      - codex/deploy-text-history
    paths:
      - .github/workflows/deploy-text-history.yml

permissions:
  contents: read

jobs:
  live-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read live Pages with cache bypass
        shell: bash
        run: |
          set -euo pipefail
          base='https://heungjaelee.github.io/posts'
          version='d2395e34c4a902bf27ec60e746cd6c3ec7b26cb1'
          pages=(
            battery-2170-pilot
            battery-4695-production-transition
            battery-25p-lfp-development
            ncm-fat-sat
            welding-vision-ai
            giga-press-dx
            robot-json-omniverse
            cell-production-tracking
          )
          for attempt in 1 2 3 4 5 6; do
            for page in "${pages[@]}"; do
              curl --fail --location --silent --show-error "$base/$page/?commit=$version&attempt=$attempt" -o "/tmp/$page.html" || true
            done
            if grep -Fq 'DMAIC 기반 양산 안정화' /tmp/battery-2170-pilot.html \
              && grep -Fq '양산 전환 일정과 Gate' /tmp/battery-4695-production-transition.html \
              && grep -Fq '개발 Gate와 공정조건 연결' /tmp/battery-25p-lfp-development.html \
              && grep -Fq '인수부터 초기 생산까지의 흐름' /tmp/ncm-fat-sat.html \
              && grep -Fq '팀이 해결하려던 제조 품질문제' /tmp/welding-vision-ai.html \
              && grep -Fq '왜 가상공장이 필요했는가' /tmp/giga-press-dx.html \
              && grep -Fq '팀이 해결하려던 제조 자동화문제' /tmp/robot-json-omniverse.html; then
              break
            fi
            sleep 10
          done

          grep -Fq 'DMAIC 기반 양산 안정화' /tmp/battery-2170-pilot.html
          grep -Fq '전체 개선 순서' /tmp/battery-2170-pilot.html
          grep -Fq '회전방향별 정렬·Setting 수행 차이' /tmp/battery-2170-pilot.html
          grep -Fq '양산 전환 일정과 Gate' /tmp/battery-4695-production-transition.html
          grep -Fq '내가 맡은 범위와 협업' /tmp/battery-4695-production-transition.html
          grep -Fq '최신 제품 형상·반사율·부품 변경' /tmp/battery-4695-production-transition.html
          grep -Fq '개발 Gate와 공정조건 연결' /tmp/battery-25p-lfp-development.html
          grep -Fq '대표 사례를 세 건으로 나눈 이유' /tmp/battery-25p-lfp-development.html
          grep -Fq '인수부터 초기 생산까지의 흐름' /tmp/ncm-fat-sat.html
          grep -Fq '내가 맡은 인수·초기생산 범위' /tmp/ncm-fat-sat.html
          ! grep -Fq '>4M<' /tmp/ncm-fat-sat.html
          grep -Fq '팀이 해결하려던 제조 품질문제' /tmp/welding-vision-ai.html
          grep -Fq '왜 가상공장이 필요했는가' /tmp/giga-press-dx.html
          grep -Fq '왜 이 기술구조를 선택했는가' /tmp/giga-press-dx.html
          grep -Fq '팀이 해결하려던 제조 자동화문제' /tmp/robot-json-omniverse.html
          grep -Fq '왜 Robot Controller가 명령을 전담했는가' /tmp/robot-json-omniverse.html
          ! grep -Fq '당시에는 AI 도구를 사용하지 않았으며' /tmp/cell-production-tracking.html

          sha256sum /tmp/*.html
