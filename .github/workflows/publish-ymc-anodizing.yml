name: Publish upgraded YMC anodizing case

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-ymc-anodizing.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out committed site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated Hugo artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-bc0c-8206-afcf-544f5b254fc9/raw?se=2026-08-07T16%3A15%3A16Z&sp=r&sv=2026-02-06&sr=b&scid=fed58c41-10dc-56fb-8030-cdeac46065a9&skoid=9063adf3-a524-4acf-b70a-8731b33f2f50&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-07T04%3A21%3A42Z&ske=2026-08-08T04%3A21%3A42Z&sks=b&skv=2026-02-06&sig=2xayZ/HUOA7qY71R6n67Cw%2BR%2BzWTfk48tcKAkouRnUE%3D' \
            --output /tmp/portfolio-public.zip
          echo 'ccf23f9b42af5dd53763942203ff178822d5e12fca4b4584788a91c70cc78f7f  /tmp/portfolio-public.zip' | sha256sum --check
          rm -rf /tmp/site
          mkdir -p /tmp/site
          unzip -q /tmp/portfolio-public.zip -d /tmp/site

      - name: Verify generated portfolio
        shell: bash
        run: |
          set -euo pipefail
          KO='/tmp/site/posts/oled-anodizing-development/index.html'
          EN='/tmp/site/en/posts/oled-anodizing-development/index.html'
          KO_HUB='/tmp/site/posts/wet-process-standardization/index.html'
          EN_HUB='/tmp/site/en/posts/wet-process-standardization/index.html'

          test -s "$KO"
          test -s "$EN"
          test -s "$KO_HUB"
          test -s "$EN_HUB"
          grep -Fq '디스플레이 장비부품 고내열 Anodizing 공정개발' "$KO"
          grep -Fq 'OLED Dry-Etch Upper Electrode용 혼산 Anodizing' "$KO"
          grep -Fq 'Display PECVD Susceptor용 수산 Anodizing' "$KO"
          grep -Fq 'Six Sigma Green Belt' "$KO"
          grep -Fq '450℃' "$KO"
          grep -Fq 'High-Temperature Anodizing Development for Display Equipment Parts' "$EN"
          grep -Fq 'Oxalic-acid anodizing for a display PECVD susceptor' "$EN"
          grep -Fq '디스플레이 장비부품 고내열 Anodizing 공정개발' /tmp/site/posts/index.html
          grep -Fq 'High-Temperature Anodizing Development for Display Equipment Parts' /tmp/site/en/posts/index.html

          test -s /tmp/site/posts/welding-vision-ai/index.html
          test -s /tmp/site/posts/giga-press-dx/index.html
          test -s /tmp/site/posts/robot-json-omniverse/index.html
          grep -Fq '용접실기품 외관검사 Vision AI Project' /tmp/site/posts/welding-vision-ai/index.html
          grep -Fq 'GIGA Press 공정 Digital Twin DX Project' /tmp/site/posts/giga-press-dx/index.html
          grep -Fq '자동차 공장 Digital Twin DX Project' /tmp/site/posts/robot-json-omniverse/index.html

      - name: Synchronize and commit generated site
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/' /tmp/site/ ./
          rm -rf .github/ymc-anodizing-overlay
          rm -f .github/workflows/publish-ymc-anodizing.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No generated-site changes were produced.' >&2
            exit 1
          fi
          git commit -m 'deploy(portfolio): publish upgraded YMC anodizing case'
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '/tmp/site'

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
