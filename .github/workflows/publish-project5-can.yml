name: Publish alternative can supplier manufacturing refactor

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-project5-can.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out committed site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated Hugo artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-4560-8206-bb59-1781b61c29c0/raw?se=2026-08-08T09%3A23%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=ca97df45-30ba-5dc1-abda-b9e5a56f39b1&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-08T00%3A52%3A30Z&ske=2026-08-09T00%3A52%3A30Z&sks=b&skv=2026-02-06&sig=U9RTF422SzJxfCOaDfXLcWKi7BsAK02hyZokX5zt9JI%3D' \
            --output /tmp/portfolio-public.zip
          echo '83176df692d67f265e09d7945982601693d0cc656a25dd64755f1455742c82bc  /tmp/portfolio-public.zip' | sha256sum --check
          rm -rf /tmp/site
          mkdir -p /tmp/site
          unzip -q /tmp/portfolio-public.zip -d /tmp/site

      - name: Verify alternative can page and manufacturing regressions
        shell: bash
        run: |
          set -euo pipefail
          KO='/tmp/site/posts/can-supplier-pilot-transition/index.html'
          EN='/tmp/site/en/posts/can-supplier-pilot-transition/index.html'
          test -s "$KO"
          test -s "$EN"
          test -s /tmp/site/images/projects/can-supplier-validation-flow.svg
          test -s /tmp/site/posts/battery-2170-pilot/index.html
          test -s /tmp/site/posts/battery-4695-production-transition/index.html
          test -s /tmp/site/posts/battery-25p-lfp-development/index.html
          test -s /tmp/site/posts/battery-tabless-concept/index.html

          grep -Fq '대체 Can 공급사 600 Cell·3 Lot Pilot 전환 검증' "$KO"
          grep -Fq '프로젝트 SOW' "$KO"
          grep -Fq '프로젝트 WBS' "$KO"
          grep -Fq '공통 4M+2E 위험판정' "$KO"
          grep -Fq '200 Cell × 3개 Lot' "$KO"
          grep -Fq '공식 UN38.3' "$KO"
          grep -Fq 'Pilot 공급 전환' "$KO"
          grep -Fq '상업 양산' "$KO"
          grep -Fq 'Alternative Can Supplier 600-Cell / 3-Lot Pilot Transition Validation' "$EN"
          grep -Fq 'Project-level 4M+2E risk disposition' "$EN"

          if grep -Eq '0\.1%|4\.2[[:space:]]*억원|420[[:space:]]*million' "$KO" "$EN"; then
            echo 'Expected cost scenarios leaked into deployed output' >&2
            exit 1
          fi

      - name: Synchronize and commit generated site
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/' /tmp/site/ ./
          rm -f .github/workflows/publish-project5-can.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No generated-site changes were produced.' >&2
            exit 1
          fi
          git commit -m 'deploy(portfolio): publish alternative can supplier validation'
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '/tmp/site'

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
