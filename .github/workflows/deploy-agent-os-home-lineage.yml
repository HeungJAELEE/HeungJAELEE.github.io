name: Deploy Agent OS lineage and featured portfolio

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-agent-os-home-lineage.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: portfolio-public-write
  cancel-in-progress: false

env:
  BASE_SHA: '44c064c3ff89505cb2e67fa2249ea09cff71427d'

jobs:
  publish-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out exact public base
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify deployment base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"

      - name: Download exact validated Hugo artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://sdmntprwestus.oaiusercontent.com/files/00000000-2928-8230-beb8-98eae001f916/raw?se=2026-08-10T14%3A50%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=95ae96f3-85bc-50af-b948-c7887124e07e&skoid=c69179d1-5b5d-430f-afa3-b9bdcf9d6497&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-10T11%3A22%3A06Z&ske=2026-08-11T11%3A22%3A06Z&sks=b&skv=2026-02-06&sig=9TApGr8VqLDp83BRc%2B78sa0CG5CdDWU75d2ds7HntTg%3D' -o /tmp/portfolio-public.zip
          echo '1efebbe44f17a513708c75d0d0cdc443c78e69ef8e6e44fabdb75fde148bb605  /tmp/portfolio-public.zip' | sha256sum -c -
          rm -rf /tmp/portfolio-public
          mkdir -p /tmp/portfolio-public
          unzip -q /tmp/portfolio-public.zip -d /tmp/portfolio-public

      - name: Verify exact artifact, index, feeds, and local links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import unquote, urlsplit
          import json
          import re
          import xml.etree.ElementTree as ET

          root = Path('/tmp/portfolio-public')
          ko_page = (root / 'posts/ai-authority-evidence-plane/index.html').read_text(encoding='utf-8')
          en_page = (root / 'en/posts/ai-authority-evidence-plane/index.html').read_text(encoding='utf-8')
          ko_home = (root / 'index.html').read_text(encoding='utf-8')
          en_home = (root / 'en/index.html').read_text(encoding='utf-8')
          deck = (root / 'print/featured-projects-ko/index.html').read_text(encoding='utf-8')
          for text, values in [
              (ko_page, ['제조·공정기술 Agent OS', 'agent-os-manufacturing-lineage.svg', 'Authoritative Readback']),
              (en_page, ['Manufacturing Agent OS', 'agent-os-manufacturing-lineage.svg', 'Authoritative Readback']),
              (ko_home, ['[Agent OS]', '생산기술 판단 AI Copilot', '/posts/ai-authority-evidence-plane/']),
              (en_home, ['[Agent OS]', 'Manufacturing Decision AI Copilot', '/en/posts/ai-authority-evidence-plane/']),
              (deck, ['생산기술 판단 AI Copilot', '생산기술 판단 AI Copilot — 5Why']),
          ]:
              for value in values:
                  assert value in text, value
          assert 'flowchart LR' not in ko_page + en_page
          assert '저사양 PC용 LLM WIKI' not in ko_home
          assert 'Low-Spec PC LLM Wiki' not in en_home
          assert (root / 'images/projects/agent-os-manufacturing-lineage.svg').is_file()
          json.loads((root / 'index.json').read_text(encoding='utf-8'))
          xml_files = list(root.rglob('*.xml'))
          for path in xml_files:
              ET.parse(path)

          targets = set()
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              rel = path.relative_to(root).as_posix()
              targets.add('/' + rel)
              if rel == 'index.html':
                  targets.add('/')
              elif rel.endswith('/index.html'):
                  targets.add('/' + rel[:-10])
          missing = []
          attr_re = re.compile(r'''(?:href|src)=["']([^"']+)["']''', re.I)
          for html in root.rglob('*.html'):
              text = html.read_text(encoding='utf-8')
              for raw in attr_re.findall(text):
                  if not raw.startswith('/') or raw.startswith('//'):
                      continue
                  path = unquote(urlsplit(raw).path)
                  if path in {'', '/'}:
                      continue
                  candidates = {path, path + '/index.html'} if not path.endswith('/') else {path, path + 'index.html'}
                  if not any(candidate in targets for candidate in candidates):
                      missing.append((html.relative_to(root).as_posix(), raw))
          assert not missing, missing[:20]
          print(f'Artifact validation: {len(xml_files)} XML parsed, local link misses 0')
          PY

      - name: Publish exact validated artifact
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='.*' /tmp/portfolio-public/ ./
          touch .nojekyll
          rm -f .github/workflows/deploy-agent-os-home-lineage.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'deploy(portfolio): publish Agent OS lineage and featured case'
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload exact published tree to Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy exact published tree to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
