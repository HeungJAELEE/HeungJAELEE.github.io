name: Deploy IATF DMADV Taguchi quality-gate pages

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-dmadv-taguchi-quality-gates.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out public repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download validated Hugo artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-14b0-8209-9e90-c0b35593e873/raw?se=2026-08-09T09%3A44%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=0b25537f-d08d-58a3-bb0b-511d2c175e4e&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-09T07%3A02%3A06Z&ske=2026-08-10T07%3A02%3A06Z&sks=b&skv=2026-02-06&sig=kzDJ0Uq2Y1/xbi1NmA/K0YyjWv/3QaYGbxAdqsEH2Cw%3D' -o /tmp/portfolio-public.zip
          echo '565512b73a7da8654eca01f55c185a1d3e304d04e56bc3e7f17728192c700d0c  /tmp/portfolio-public.zip' | sha256sum -c -
          rm -rf /tmp/portfolio-public
          mkdir -p /tmp/portfolio-public
          unzip -q /tmp/portfolio-public.zip -d /tmp/portfolio-public

      - name: Verify IATF DMADV Taguchi output
        shell: bash
        run: |
          set -euo pipefail
          KO25='/tmp/portfolio-public/posts/battery-25p-lfp-development/index.html'
          EN25='/tmp/portfolio-public/en/posts/battery-25p-lfp-development/index.html'
          KOTAB='/tmp/portfolio-public/posts/battery-tabless-concept/index.html'
          ENTAB='/tmp/portfolio-public/en/posts/battery-tabless-concept/index.html'
          SVG25='/tmp/portfolio-public/images/projects/25p-lfp-development-gate.svg'
          SVGTAB='/tmp/portfolio-public/images/projects/2170-tabless-a-sample-gate.svg'
          for file in "$KO25" "$EN25" "$KOTAB" "$ENTAB" "$SVG25" "$SVGTAB"; do test -s "$file"; done

          grep -Fq '25P LFP Power Cell DMADV·Taguchi 기반 NPI 공정개발 및 고객 Qual' "$KO25"
          grep -Fq 'IATF 16949 기반 개발·양산 이관 Gate' "$KO25"
          grep -Fq 'Taguchi DOE 기반 조건 최적화' "$KO25"
          grep -Fq 'CCB.PO 기술 승인' "$KO25"

          grep -Fq '25P LFP Power Cell DMADV and Taguchi NPI Process Development with Customer Qualification' "$EN25"
          grep -Fq 'IATF 16949-based development and production-handoff gates' "$EN25"
          grep -Fq 'Taguchi DOE-based condition optimization' "$EN25"
          grep -Fq 'CCB.PO technical approval' "$EN25"

          grep -Fq 'IATF 16949 기반 개발품질 Gate와 현재 위치' "$KOTAB"
          grep -Fq 'PROTO Gate 내부 DMADV' "$KOTAB"
          grep -Fq 'Taguchi 기반 Trial Matrix' "$KOTAB"
          grep -Fq 'PILOT B·C Sample 차후 설계 반영 사항' "$KOTAB"

          grep -Fq 'IATF 16949-based development gates and current position' "$ENTAB"
          grep -Fq 'DMADV inside the PROTO gate' "$ENTAB"
          grep -Fq 'Taguchi-based trial matrix' "$ENTAB"
          grep -Fq 'Follow-on design items for PILOT B/C samples' "$ENTAB"

          grep -Fq 'QUALITY GATE' "$SVG25"
          grep -Fq 'TAGUCHI RESPONSE CHAIN' "$SVG25"
          grep -Fq 'IATF-BASED QUALITY POSITION' "$SVGTAB"
          grep -Fq 'TAGUCHI TRIAL MATRIX' "$SVGTAB"

          if grep -Eqi 'L9\b|L18\b|L27\b' "$KO25" "$EN25" "$KOTAB" "$ENTAB"; then
            echo 'Unverified orthogonal-array identifier found' >&2
            exit 1
          fi

      - name: Publish validated output
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='.*' /tmp/portfolio-public/ ./
          touch .nojekyll
          rm -f .github/workflows/deploy-dmadv-taguchi-quality-gates.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No public output changes were produced.' >&2
            exit 1
          fi
          git commit -m 'deploy(portfolio): publish IATF DMADV Taguchi quality gates'
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '/tmp/portfolio-public'

  deploy:
    needs: publish-and-verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
