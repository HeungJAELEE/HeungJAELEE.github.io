name: Deploy GIGA manufacturing Copilot platform design

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-giga-copilot.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out public repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify deployment base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '7173173db1f8e1efe57aec5197d40e454709a97a'

      - name: Download validated Hugo artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-75ec-8206-bb76-41eb7841141e/raw?se=2026-08-09T23%3A49%3A02Z&sp=r&sv=2026-02-06&sr=b&scid=f49d44fa-3a2b-5382-a2ff-c3d5651b82d1&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-09T23%3A15%3A30Z&ske=2026-08-10T23%3A15%3A30Z&sks=b&skv=2026-02-06&sig=WK%2FNibtrhaBANrxCpl1I7K3VrbP6ZlFzxOADojlADGM%3D' -o /tmp/portfolio-public.zip
          echo '7526d3695b6b6f965a0bb0458cf9ec0c097b99e5533cb096531eee795e99aaf5  /tmp/portfolio-public.zip' | sha256sum -c -
          rm -rf /tmp/portfolio-public
          mkdir -p /tmp/portfolio-public
          unzip -q /tmp/portfolio-public.zip -d /tmp/portfolio-public

      - name: Verify GIGA Copilot output
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          checks = {
              'posts/giga-press-dx/index.html': [
                  'GIGA Press 가상화 및 AI 생산기술 보조 Agent(Copilot) 플랫폼 설계',
                  '프로젝트 배경과 Vision',
                  '공정 가상화와 상태전이',
                  '통합 시스템 아키텍처',
                  'Tag·State 정합성 Mapping',
                  'AI Copilot Interface',
                  '제어-분석 Decoupling',
                  'Human-in-the-Loop',
                  '통합 아키텍트 역할',
                  '정상 Flow 통합 시연',
                  '다음 Engineering Gate',
              ],
              'en/posts/giga-press-dx/index.html': [
                  'GIGA Press Virtualization and AI Process-Engineering Copilot Platform Design',
                  'Project background and vision',
                  'Process virtualization and state transitions',
                  'Integrated system architecture',
                  'Tag and state consistency mapping',
                  'AI Copilot interface',
                  'Control-analysis decoupling',
                  'Human-in-the-Loop',
                  'Integration architect role',
                  'Normal-flow integrated demonstration',
                  'Next engineering gates',
              ],
          }
          for rel, phrases in checks.items():
              path = Path('/tmp/portfolio-public') / rel
              assert path.is_file() and path.stat().st_size > 0, path
              text = path.read_text(encoding='utf-8')
              for phrase in phrases:
                  assert phrase in text, f'{rel}: {phrase}'

          merged = '\n'.join((Path('/tmp/portfolio-public') / rel).read_text(encoding='utf-8') for rel in checks)
          banned = [
              'GIGA Press 공정 Digital Twin·AI 생산기술 보조 Agent 아키텍처 PoC',
              'GIGA Press Digital Twin and Process-Engineering Advisory Agent Architecture PoC',
              'GIGA Press Digital Twin·자율형 공장 PoC',
              'GIGA Press Digital Twin and Autonomous Factory PoC',
              '프로젝트 구현 목표 — Team SOW',
              '프로젝트 진행순서 — Team WBS',
              'Personal SOW',
              'Personal WBS',
              '완료범위에 포함하지 않은 항목',
              'AI는 실제 설비를 직접 제어하지 않았습니다',
              'AI did not directly control the equipment',
              '무결점 통합',
              '완벽히 분리',
              '실시간으로 인지',
              '1:1로 지연 없이 동기화',
              '설비 증설 공수 50% 절감',
          ]
          for phrase in banned:
              assert phrase not in merged, phrase
          print('GIGA manufacturing Copilot public artifact: PASS')
          PY

      - name: Publish validated output
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='.*' /tmp/portfolio-public/ ./
          touch .nojekyll
          rm -f .github/workflows/deploy-giga-copilot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No public output changes were produced.' >&2
            exit 1
          fi
          git commit -m 'deploy(portfolio): publish GIGA manufacturing Copilot design'
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '/tmp/portfolio-public'

  deploy:
    needs: publish-and-verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
