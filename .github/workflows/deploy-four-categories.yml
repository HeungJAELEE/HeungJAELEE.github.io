name: Verify live four-category portfolio

on:
  push:
    branches:
      - codex/deploy-four-categories
    paths:
      - .github/workflows/deploy-four-categories.yml

permissions:
  contents: read

jobs:
  live-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read live Pages with cache bypass
        shell: bash
        run: |
          set -euo pipefail
          base='https://heungjaelee.github.io'
          version='4e2cbcf3bed7c6957cb08bb060eeec604ef9ee9d'
          for attempt in 1 2 3 4 5 6; do
            curl --fail --location --silent --show-error "$base/?commit=$version&attempt=$attempt" -o /tmp/home.html || true
            curl --fail --location --silent --show-error "$base/posts/?commit=$version&attempt=$attempt" -o /tmp/posts.html || true
            curl --fail --location --silent --show-error "$base/posts/battery-2170-pilot/?commit=$version&attempt=$attempt" -o /tmp/2170.html || true
            curl --fail --location --silent --show-error "$base/posts/welding-vision-ai/?commit=$version&attempt=$attempt" -o /tmp/vision.html || true
            curl --fail --location --silent --show-error "$base/posts/giga-press-dx/?commit=$version&attempt=$attempt" -o /tmp/factory.html || true
            curl --fail --location --silent --show-error "$base/en/?commit=$version&attempt=$attempt" -o /tmp/home-en.html || true
            if grep -Fq '제조 프로젝트' /tmp/home.html \
              && grep -Fq '제조 DX 프로젝트' /tmp/home.html \
              && grep -Fq '제조 AX 프로젝트' /tmp/home.html \
              && grep -Fq '개인 AI 활용 프로젝트' /tmp/home.html \
              && grep -Fq '총 투입량을 양품, 샘플 검사 Loss와 공정 불량으로 구분해 양품률을 평가했습니다.' /tmp/2170.html \
              && grep -Fq '향후 제품·Lot·촬영시점을 분리한 독립 평가셋' /tmp/vision.html \
              && grep -Fq '향후 AI·PLC 연계' /tmp/factory.html \
              && grep -Fq 'Manufacturing AX Projects' /tmp/home-en.html; then
              break
            fi
            sleep 10
          done
          grep -Fq '제조 프로젝트' /tmp/home.html
          grep -Fq '제조 DX 프로젝트' /tmp/home.html
          grep -Fq '제조 AX 프로젝트' /tmp/home.html
          grep -Fq '개인 AI 활용 프로젝트' /tmp/home.html
          grep -Fq '총 투입량을 양품, 샘플 검사 Loss와 공정 불량으로 구분해 양품률을 평가했습니다.' /tmp/2170.html
          grep -Fq '향후 제품·Lot·촬영시점을 분리한 독립 평가셋' /tmp/vision.html
          grep -Fq '향후 AI·PLC 연계' /tmp/factory.html
          grep -Fq 'Manufacturing AX Projects' /tmp/home-en.html
          ! grep -Fq '세부 Recipe와 내부 관리값은 공개하지 않습니다.' /tmp/2170.html
          ! grep -Fq '전용 저장소' /tmp/vision.html
          ! grep -Fq '미구현' /tmp/factory.html
          ! grep -Fq 'YMC 표면처리·공정개발 사례 허브' /tmp/posts.html
          sha256sum /tmp/home.html /tmp/posts.html /tmp/2170.html /tmp/vision.html /tmp/factory.html /tmp/home-en.html
