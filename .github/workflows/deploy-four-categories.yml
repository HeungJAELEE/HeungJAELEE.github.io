name: Deploy welding report screenshots

on:
  push:
    branches:
      - codex/deploy-four-categories
    paths:
      - .github/workflows/deploy-four-categories.yml

permissions:
  contents: write

jobs:
  deploy-and-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current Pages main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download and verify validated build
        shell: bash
        env:
          BUILD_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-ee24-8211-bbed-513baf1b5136/raw?se=2026-08-06T05:46:54Z&sp=r&sv=2026-02-06&sr=b&scid=1730a377-a54a-5327-aead-65cbebd2ae36&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-05T21:19:48Z&ske=2026-08-06T21:19:48Z&sks=b&skv=2026-02-06&sig=eqmH5Phk4siuXpoZKY3/wzU3fqZzKH07UUwgiDvM7O8%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$BUILD_URL" --output /tmp/welding-vision-screenshot-build.zip
          echo 'e270658081a03a1b9958c649a34a42fdabff344cfc4cec6365069293815942c6  /tmp/welding-vision-screenshot-build.zip' | sha256sum --check --strict
          rm -rf /tmp/portfolio-site
          mkdir -p /tmp/portfolio-site
          unzip -q /tmp/welding-vision-screenshot-build.zip -d /tmp/portfolio-site

      - name: Verify report screenshots and bilingual content
        shell: bash
        run: |
          set -euo pipefail
          ko='/tmp/portfolio-site/posts/welding-vision-ai/index.html'
          en='/tmp/portfolio-site/en/posts/welding-vision-ai/index.html'
          test -f "$ko"
          test -f "$en"
          for asset in \
            welding-vision-report-augmentation.svg \
            welding-vision-report-threshold.svg \
            welding-vision-report-app-flow.svg \
            welding-vision-report-app-results.svg; do
            test -s "/tmp/portfolio-site/images/projects/$asset"
            grep -Fq "$asset" "$ko"
            grep -Fq "$asset" "$en"
          done
          grep -Fq '보고서의 증강 예시입니다.' "$ko"
          grep -Fq '동일한 용접실기품의 판정결과 비교입니다.' "$ko"
          grep -Fq '보고서의 APP 시연 구조입니다.' "$ko"
          grep -Fq 'A·C·D 등급 시연화면입니다.' "$ko"
          grep -Fq 'The report capture shows framing, lighting, and noise augmentation' "$en"
          grep -Fq 'The same specimen changes grade as the threshold changes.' "$en"
          grep -Fq 'The report architecture sends the smartphone image to' "$en"
          grep -Fq 'The report demonstration displays grade, defect type, and confidence' "$en"

      - name: Apply validated Pages build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r --ignore-unmatch .
          cp -a /tmp/portfolio-site/. .
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Pages main already matches the validated artifact.'
          else
            git commit -m 'Deploy welding Vision report screenshots'
            git push origin HEAD:main
          fi

      - name: Read live bilingual pages with cache bypass
        shell: bash
        run: |
          set -euo pipefail
          version="$(git rev-parse HEAD)"
          base='https://heungjaelee.github.io'
          for attempt in 1 2 3 4 5 6 7 8; do
            curl --fail --location --silent --show-error "$base/posts/welding-vision-ai/?commit=$version&attempt=$attempt" -o /tmp/live-ko.html || true
            curl --fail --location --silent --show-error "$base/en/posts/welding-vision-ai/?commit=$version&attempt=$attempt" -o /tmp/live-en.html || true
            ready=true
            for asset in \
              welding-vision-report-augmentation.svg \
              welding-vision-report-threshold.svg \
              welding-vision-report-app-flow.svg \
              welding-vision-report-app-results.svg; do
              grep -Fq "$asset" /tmp/live-ko.html || ready=false
              grep -Fq "$asset" /tmp/live-en.html || ready=false
            done
            if "$ready"; then
              break
            fi
            sleep 10
          done
          for asset in \
            welding-vision-report-augmentation.svg \
            welding-vision-report-threshold.svg \
            welding-vision-report-app-flow.svg \
            welding-vision-report-app-results.svg; do
            grep -Fq "$asset" /tmp/live-ko.html
            grep -Fq "$asset" /tmp/live-en.html
            curl --fail --location --silent --show-error "$base/images/projects/$asset?commit=$version" -o "/tmp/$asset"
            test -s "/tmp/$asset"
          done
          grep -Fq '보고서의 증강 예시입니다.' /tmp/live-ko.html
          grep -Fq '동일한 용접실기품의 판정결과 비교입니다.' /tmp/live-ko.html
          grep -Fq '보고서의 APP 시연 구조입니다.' /tmp/live-ko.html
          grep -Fq 'A·C·D 등급 시연화면입니다.' /tmp/live-ko.html
          sha256sum /tmp/live-ko.html /tmp/live-en.html
