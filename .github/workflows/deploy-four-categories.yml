name: Deploy four-category portfolio

on:
  push:
    branches:
      - codex/deploy-four-categories
    paths:
      - .github/workflows/deploy-four-categories.yml

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out deployment branch
        uses: actions/checkout@v4
        with:
          ref: codex/deploy-four-categories
          fetch-depth: 0

      - name: Download and verify validated artifact
        shell: bash
        env:
          BUILD_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-09f4-81fd-9c2e-3a32ba2ad258/raw?se=2026-08-06T00:54:08Z&sp=r&sv=2026-02-06&sr=b&scid=0f90a682-f938-5538-bcd8-a46b62e0a42e&skoid=3e273c3d-5ea1-4088-9e18-79685531b184&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-06T00:27:00Z&ske=2026-08-07T00:27:00Z&sks=b&skv=2026-02-06&sig=WfVkX/ZxvHLAzaKIn7KoRbloVC1O2NrgEI4P/QzxPps%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$BUILD_URL" --output /tmp/portfolio-build.zip
          echo '2dc94f225bea4faefe07288eac9efa969edfefc59331262d60cb56d6d7d10e0d  /tmp/portfolio-build.zip' | sha256sum --check --strict
          rm -rf /tmp/portfolio-site
          mkdir -p /tmp/portfolio-site
          unzip -q /tmp/portfolio-build.zip -d /tmp/portfolio-site

      - name: Verify deployment content
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/portfolio-site/index.html
          test -f /tmp/portfolio-site/en/index.html
          test -f /tmp/portfolio-site/posts/index.html
          grep -Fq '제조 프로젝트' /tmp/portfolio-site/index.html
          grep -Fq '제조 DX 프로젝트' /tmp/portfolio-site/index.html
          grep -Fq '제조 AX 프로젝트' /tmp/portfolio-site/index.html
          grep -Fq '개인 AI 활용 프로젝트' /tmp/portfolio-site/index.html
          grep -Fq '총 투입량을 양품, 샘플 검사 Loss와 공정 불량으로 구분해 양품률을 평가했습니다.' /tmp/portfolio-site/posts/battery-2170-pilot/index.html
          ! grep -Fq '세부 Recipe와 내부 관리값은 공개하지 않습니다.' /tmp/portfolio-site/posts/battery-2170-pilot/index.html
          ! grep -Fq '전용 저장소' /tmp/portfolio-site/posts/welding-vision-ai/index.html
          ! grep -Fq '미구현' /tmp/portfolio-site/posts/giga-press-dx/index.html
          ! grep -Fq 'YMC 표면처리·공정개발 사례 허브' /tmp/portfolio-site/posts/index.html
          grep -Fq 'Manufacturing AX Projects' /tmp/portfolio-site/en/index.html
          grep -Fq 'Personal AI Application Projects' /tmp/portfolio-site/en/posts/index.html

      - name: Commit and fast-forward main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r --ignore-unmatch .
          cp -a /tmp/portfolio-site/. .
          git add -A
          git diff --cached --check
          git commit -m 'Deploy four-category portfolio structure'
          git push origin HEAD:main
