name: Verify live detailed portfolio text

on:
  push:
    branches:
      - codex/deploy-four-categories
    paths:
      - .github/workflows/deploy-four-categories.yml

permissions:
  contents: read

jobs:
  live-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify current Pages main SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git ls-remote https://github.com/HeungJAELEE/HeungJAELEE.github.io.git refs/heads/main | cut -f1)"
          test "$actual" = 'd2395e34c4a902bf27ec60e746cd6c3ec7b26cb1'

      - name: Read live Pages with cache bypass
        shell: bash
        run: |
          set -euo pipefail
          version='d2395e34c4a902bf27ec60e746cd6c3ec7b26cb1'
          base='https://heungjaelee.github.io'
          for attempt in 1 2 3 4 5 6; do
            curl --fail --location --silent --show-error "$base/posts/battery-2170-pilot/?commit=$version&attempt=$attempt" -o /tmp/live-2170.html || true
            curl --fail --location --silent --show-error "$base/posts/battery-4695-production-transition/?commit=$version&attempt=$attempt" -o /tmp/live-4695.html || true
            curl --fail --location --silent --show-error "$base/posts/battery-25p-lfp-development/?commit=$version&attempt=$attempt" -o /tmp/live-25p.html || true
            curl --fail --location --silent --show-error "$base/posts/ncm-fat-sat/?commit=$version&attempt=$attempt" -o /tmp/live-ncm.html || true
            curl --fail --location --silent --show-error "$base/posts/welding-vision-ai/?commit=$version&attempt=$attempt" -o /tmp/live-vision.html || true
            curl --fail --location --silent --show-error "$base/posts/giga-press-dx/?commit=$version&attempt=$attempt" -o /tmp/live-factory.html || true
            curl --fail --location --silent --show-error "$base/posts/robot-json-omniverse/?commit=$version&attempt=$attempt" -o /tmp/live-indy7.html || true
            if grep -Fq 'DMAIC 기반 양산 안정화' /tmp/live-2170.html \
              && grep -Fq '양산 전환 일정과 Gate' /tmp/live-4695.html \
              && grep -Fq '개발 Gate와 공정조건 연결' /tmp/live-25p.html \
              && grep -Fq 'FAT/SAT에서 무엇을 닫았는가' /tmp/live-ncm.html \
              && grep -Fq '팀이 해결하려던 제조 품질문제' /tmp/live-vision.html \
              && grep -Fq '왜 이 기술구조를 선택했는가' /tmp/live-factory.html \
              && grep -Fq '왜 Robot Controller가 명령을 전담했는가' /tmp/live-indy7.html; then
              break
            fi
            sleep 10
          done
          grep -Fq 'DMAIC 기반 양산 안정화' /tmp/live-2170.html
          grep -Fq '전체 개선 순서' /tmp/live-2170.html
          grep -Fq '양산 전환 일정과 Gate' /tmp/live-4695.html
          grep -Fq '개발 Gate와 공정조건 연결' /tmp/live-25p.html
          grep -Fq 'FAT/SAT에서 무엇을 닫았는가' /tmp/live-ncm.html
          grep -Fq '팀이 해결하려던 제조 품질문제' /tmp/live-vision.html
          grep -Fq '왜 Accuracy보다 미검출을 먼저 봤는가' /tmp/live-vision.html
          grep -Fq '왜 이 기술구조를 선택했는가' /tmp/live-factory.html
          grep -Fq '왜 Robot Controller가 명령을 전담했는가' /tmp/live-indy7.html
          ! grep -Fiq 'FYD' /tmp/live-4695.html
          ! grep -Fq '96.8%' /tmp/live-25p.html
          sha256sum /tmp/live-2170.html /tmp/live-4695.html /tmp/live-25p.html /tmp/live-ncm.html /tmp/live-vision.html /tmp/live-factory.html /tmp/live-indy7.html
