name: Deploy GIGA Press report text

on:
  push:
    branches:
      - codex/deploy-four-categories
    paths:
      - .github/workflows/deploy-four-categories.yml

permissions:
  contents: write

jobs:
  deploy-and-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current Pages main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download and verify validated text build
        shell: bash
        env:
          BUILD_URL: 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-adbc-8209-887f-0c4b935fccc9/raw?se=2026-08-06T06%3A32%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=cd9ebffb-23d1-56a5-aec3-7ce702be5480&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-06T05%3A47%3A24Z&ske=2026-08-07T05%3A47%3A24Z&sks=b&skv=2026-02-06&sig=BIH4hkHYQOjI8DiuXBgg0F3pLJiyStdHYKGkB/F98pc%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$BUILD_URL" --output /tmp/giga-press-report-text-build.zip
          echo '7a37607cd20f56b614d9167e82088ed0355c146facd6190bed9e6657ecdc8ec4  /tmp/giga-press-report-text-build.zip' | sha256sum --check --strict
          rm -rf /tmp/portfolio-site
          mkdir -p /tmp/portfolio-site
          unzip -q /tmp/giga-press-report-text-build.zip -d /tmp/portfolio-site

      - name: Verify bilingual GIGA Press text
        shell: bash
        run: |
          set -euo pipefail
          ko='/tmp/portfolio-site/posts/giga-press-dx/index.html'
          en='/tmp/portfolio-site/en/posts/giga-press-dx/index.html'
          test -f "$ko"
          test -f "$en"

          for phrase in \
            'GIGA Press Digital Twin·자율형 공장 PoC' \
            '왜 Digital Twin이 필요했는가' \
            '금형 가공을 CNC 가공공정으로 단순화' \
            '시스템을 네 계층으로 나눈 이유' \
            '보고서의 공식 R&amp;R' \
            '모델 선정과 연결구조를 검토한 단계'; do
            grep -Fq "$phrase" "$ko"
          done

          for phrase in \
            'GIGA Press Digital Twin and Autonomous Factory PoC' \
            'Why a Digital Twin was needed' \
            'die-processing stage was simplified as a CNC process' \
            'Why the system was separated into four layers' \
            'Team roles and my scope' \
            'model-selection and integration-design stage'; do
            grep -Fq "$phrase" "$en"
          done

          # User-provided screenshots are intentionally deferred.
          ! grep -Fq 'giga-press-report-problem' "$ko"
          ! grep -Fq 'giga-press-report-process-flow' "$ko"
          ! grep -Fq 'giga-press-report-system-layers' "$ko"

      - name: Apply validated Pages build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r --ignore-unmatch .
          cp -a /tmp/portfolio-site/. .
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Pages main already matches the validated artifact.'
          else
            git commit -m 'Deploy GIGA Press report-grounded text'
            git push origin HEAD:main
          fi

      - name: Read live bilingual pages with cache bypass
        shell: bash
        run: |
          set -euo pipefail
          version="$(git rev-parse HEAD)"
          base='https://heungjaelee.github.io'
          for attempt in 1 2 3 4 5 6 7 8; do
            curl --fail --location --silent --show-error "$base/posts/giga-press-dx/?commit=$version&attempt=$attempt" -o /tmp/live-ko.html || true
            curl --fail --location --silent --show-error "$base/en/posts/giga-press-dx/?commit=$version&attempt=$attempt" -o /tmp/live-en.html || true
            if grep -Fq 'GIGA Press Digital Twin·자율형 공장 PoC' /tmp/live-ko.html \
              && grep -Fq 'GIGA Press Digital Twin and Autonomous Factory PoC' /tmp/live-en.html; then
              break
            fi
            sleep 10
          done
          grep -Fq '왜 Digital Twin이 필요했는가' /tmp/live-ko.html
          grep -Fq '금형 가공을 CNC 가공공정으로 단순화' /tmp/live-ko.html
          grep -Fq '시스템을 네 계층으로 나눈 이유' /tmp/live-ko.html
          grep -Fq '모델 선정과 연결구조를 검토한 단계' /tmp/live-ko.html
          grep -Fq 'Why a Digital Twin was needed' /tmp/live-en.html
          grep -Fq 'Why the system was separated into four layers' /tmp/live-en.html
          grep -Fq 'model-selection and integration-design stage' /tmp/live-en.html
          sha256sum /tmp/live-ko.html /tmp/live-en.html
