name: Deploy quantified manufacturing narratives

on:
  push:
    branches:
      - codex/deploy-four-categories
    paths:
      - .github/workflows/deploy-four-categories.yml

permissions:
  contents: write

jobs:
  deploy-and-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current Pages main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download and verify validated build
        shell: bash
        env:
          BUILD_URL: 'https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-725c-81fb-bfc2-fd1e3dcd09fc/raw?se=2026-08-06T02:52:35Z&sp=r&sv=2026-02-06&sr=b&scid=6d2dd9eb-a504-5672-8ff5-013eebe68501&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-06T00:11:41Z&ske=2026-08-07T00:11:41Z&sks=b&skv=2026-02-06&sig=LYoHpR04rKou3xVDpMwN1zjvqGjfznTHwEwst%2BbvUcA%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$BUILD_URL" --output /tmp/manufacturing-story-build.zip
          echo '60199f573ca8da1660b31d727e028048c2bd24e03639d1583e12998dd732ef41  /tmp/manufacturing-story-build.zip' | sha256sum --check --strict
          rm -rf /tmp/portfolio-site
          mkdir -p /tmp/portfolio-site
          unzip -q /tmp/manufacturing-story-build.zip -d /tmp/portfolio-site

      - name: Verify generated manufacturing pages
        shell: bash
        run: |
          python - <<'PY'
          from html import unescape
          from pathlib import Path
          import re

          checks = {
              '/tmp/portfolio-site/posts/battery-2170-pilot/index.html': ['98.3% 감소', '58.7%p 상승', 'SEPA 가동률'],
              '/tmp/portfolio-site/posts/battery-4695-production-transition/index.html': ['100 Cell × 2 Lot = 200 Cell', 'Safety Interlock 변경'],
              '/tmp/portfolio-site/posts/battery-25p-lfp-development/index.html': ['4.5 mm 감소', '40% 축소'],
              '/tmp/portfolio-site/posts/battery-tabless-concept/index.html': ['기능평가 진입비율', '5%', '양산수율이 아닙니다'],
              '/tmp/portfolio-site/posts/ncm-fat-sat/index.html': ['1,000 Cell / 5일', '재작업 후 품질기준을 충족한 Cell을 포함'],
              '/tmp/portfolio-site/posts/can-supplier-pilot-transition/index.html': ['3/3 Lot', '600 Cell'],
              '/tmp/portfolio-site/posts/ncm-pre-forming-validation/index.html': ['4 Lot × 50개 = 200개', '400개 Sample'],
              '/tmp/portfolio-site/posts/robot-overhaul-standardization/index.html': ['2.5~4.0배', '150~300%'],
              '/tmp/portfolio-site/posts/oled-anodizing-development/index.html': ['4단계', '1년'],
              '/tmp/portfolio-site/posts/amat-akt-qual/index.html': ['막두께·조도·내전압', '3종'],
              '/tmp/portfolio-site/posts/diffuser-scaleup-failure/index.html': ['5개 Gate'],
              '/tmp/portfolio-site/en/posts/battery-2170-pilot/index.html': ['98.3% relative', '58.7 percentage points'],
          }
          for path, phrases in checks.items():
              html = Path(path).read_text(encoding='utf-8')
              text = unescape(re.sub(r'<[^>]+>', ' ', html))
              text = re.sub(r'\s+', ' ', text)
              for phrase in phrases:
                  if phrase not in text:
                      raise SystemExit(f'{path}: missing {phrase}')
          PY

      - name: Apply validated Pages build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r --ignore-unmatch .
          cp -a /tmp/portfolio-site/. .
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Pages main already matches validated artifact.'
          else
            git commit -m 'Deploy quantified manufacturing portfolio narratives'
            git push origin HEAD:main
          fi

      - name: Read live manufacturing pages
        shell: bash
        run: |
          set -euo pipefail
          version="$(git rev-parse HEAD)"
          base='https://heungjaelee.github.io/posts'
          for attempt in 1 2 3 4 5 6; do
            curl --fail --location --silent --show-error "$base/battery-2170-pilot/?commit=$version&attempt=$attempt" -o /tmp/2170.html || true
            curl --fail --location --silent --show-error "$base/battery-25p-lfp-development/?commit=$version&attempt=$attempt" -o /tmp/25p.html || true
            curl --fail --location --silent --show-error "$base/ncm-fat-sat/?commit=$version&attempt=$attempt" -o /tmp/ncm.html || true
            curl --fail --location --silent --show-error "$base/robot-overhaul-standardization/?commit=$version&attempt=$attempt" -o /tmp/robot.html || true
            if grep -Fq 'SEPA 가동률' /tmp/2170.html \
              && grep -Fq '4.5 mm' /tmp/25p.html \
              && grep -Fq '1,000 Cell' /tmp/ncm.html \
              && grep -Fq '2.5~4.0배' /tmp/robot.html; then
              break
            fi
            sleep 10
          done
          grep -Fq 'SEPA 가동률' /tmp/2170.html
          grep -Fq '4.5 mm' /tmp/25p.html
          grep -Fq '1,000 Cell' /tmp/ncm.html
          grep -Fq '2.5~4.0배' /tmp/robot.html
          git rev-parse HEAD
