name: Deploy validated detailed portfolio text

on:
  push:
    branches:
      - codex/deploy-four-categories
    paths:
      - .github/workflows/deploy-four-categories.yml

permissions:
  contents: write

jobs:
  deploy-and-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current Pages main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download and verify validated text build
        shell: bash
        env:
          BUILD_URL: 'https://sdmntprcentralindia.oaiusercontent.com/files/00000000-a0e0-8208-9d9e-d87fcd0332ca/raw?se=2026-08-06T01:45:25Z&sp=r&sv=2026-02-06&sr=b&scid=3c5b6a1a-7198-5d7a-9ed5-693346325dcd&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-06T00:46:23Z&ske=2026-08-07T00:46:23Z&sks=b&skv=2026-02-06&sig=KRv74zpYn9WwnKmBi1WkoO7/yPHQprYiOWzFnwf2Rro%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$BUILD_URL" --output /tmp/portfolio-text-revision-build.zip
          echo 'dc2be82c32dc6ead0489b6f36c3f0ad05f9c6656df72fc1038c683a0ddd32bce  /tmp/portfolio-text-revision-build.zip' | sha256sum --check --strict
          rm -rf /tmp/portfolio-site
          mkdir -p /tmp/portfolio-site
          unzip -q /tmp/portfolio-text-revision-build.zip -d /tmp/portfolio-site

      - name: Verify revised manufacturing and DX pages
        shell: bash
        run: |
          set -euo pipefail
          ko='/tmp/portfolio-site/posts'
          en='/tmp/portfolio-site/en/posts'
          test -f "$ko/battery-2170-pilot/index.html"
          test -f "$ko/battery-4695-production-transition/index.html"
          test -f "$ko/battery-25p-lfp-development/index.html"
          test -f "$ko/ncm-fat-sat/index.html"
          test -f "$ko/welding-vision-ai/index.html"
          test -f "$ko/giga-press-dx/index.html"
          test -f "$ko/robot-json-omniverse/index.html"
          grep -Fq 'DMAIC 기반 양산 안정화' "$ko/battery-2170-pilot/index.html"
          grep -Fq '전체 개선 순서' "$ko/battery-2170-pilot/index.html"
          grep -Fq '총 투입량을 양품, 샘플 검사 Loss와 공정 불량으로 구분해 양품률을 평가했습니다.' "$ko/battery-2170-pilot/index.html"
          grep -Fq '양산 전환 일정과 Gate' "$ko/battery-4695-production-transition/index.html"
          grep -Fq '개발 Gate와 공정조건 연결' "$ko/battery-25p-lfp-development/index.html"
          grep -Fq 'FAT/SAT에서 무엇을 닫았는가' "$ko/ncm-fat-sat/index.html"
          grep -Fq '팀이 해결하려던 제조 품질문제' "$ko/welding-vision-ai/index.html"
          grep -Fq '왜 이 기술구조를 선택했는가' "$ko/giga-press-dx/index.html"
          grep -Fq '왜 Robot Controller가 명령을 전담했는가' "$ko/robot-json-omniverse/index.html"
          grep -Fq 'DMAIC-based production stabilization' "$en/battery-2170-pilot/index.html"
          grep -Fq 'Why this technology structure was selected' "$en/giga-press-dx/index.html"
          ! grep -Fiq 'FYD' "$ko/battery-4695-production-transition/index.html"
          ! grep -Fq '96.8%' "$ko/battery-25p-lfp-development/index.html"

      - name: Commit validated Pages build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r --ignore-unmatch .
          cp -a /tmp/portfolio-site/. .
          git add -A
          git diff --cached --check
          git commit -m 'Deploy detailed manufacturing and DX portfolio narratives'
          git push origin HEAD:main

      - name: Read live Pages with cache bypass
        shell: bash
        run: |
          set -euo pipefail
          version="$(git rev-parse HEAD)"
          base='https://heungjaelee.github.io'
          for attempt in 1 2 3 4 5 6; do
            curl --fail --location --silent --show-error "$base/posts/battery-2170-pilot/?commit=$version&attempt=$attempt" -o /tmp/live-2170.html || true
            curl --fail --location --silent --show-error "$base/posts/giga-press-dx/?commit=$version&attempt=$attempt" -o /tmp/live-factory.html || true
            curl --fail --location --silent --show-error "$base/posts/robot-json-omniverse/?commit=$version&attempt=$attempt" -o /tmp/live-indy7.html || true
            if grep -Fq 'DMAIC 기반 양산 안정화' /tmp/live-2170.html \
              && grep -Fq '왜 이 기술구조를 선택했는가' /tmp/live-factory.html \
              && grep -Fq '왜 Robot Controller가 명령을 전담했는가' /tmp/live-indy7.html; then
              break
            fi
            sleep 10
          done
          grep -Fq 'DMAIC 기반 양산 안정화' /tmp/live-2170.html
          grep -Fq '왜 이 기술구조를 선택했는가' /tmp/live-factory.html
          grep -Fq '왜 Robot Controller가 명령을 전담했는가' /tmp/live-indy7.html
          sha256sum /tmp/live-2170.html /tmp/live-factory.html /tmp/live-indy7.html
