name: Publish project 1 composite case split

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-project1-case-split.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out committed site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated Hugo artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-6708-81f7-8eba-d19a35464c55/raw?se=2026-08-08T06%3A29%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=3a7df93a-e022-5218-a718-8bd6c33418f9&skoid=b1bca990-dcac-4c31-8ca1-ac563cf24c54&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-08T05%3A53%3A34Z&ske=2026-08-09T05%3A53%3A34Z&sks=b&skv=2026-02-06&sig=Gemx5I3S%2BKMNO5WzmLkj6v9JKotXklvG3PjOIgM1Kxo%3D' \
            --output /tmp/portfolio-public-case-split.zip
          echo '00ff0d4c9117fa412f2d4406e0bfaa6afd1b1342972541cf4f61308cee251063  /tmp/portfolio-public-case-split.zip' | sha256sum --check
          rm -rf /tmp/site
          mkdir -p /tmp/site
          unzip -q /tmp/portfolio-public-case-split.zip -d /tmp/site

      - name: Verify generated 2170 case structure
        shell: bash
        run: |
          set -euo pipefail
          KO='/tmp/site/posts/battery-2170-pilot/index.html'
          EN='/tmp/site/en/posts/battery-2170-pilot/index.html'
          test -s "$KO"
          test -s "$EN"
          grep -Fq 'CBD·CBC·CCR 형상·측정 안정화' "$KO"
          grep -Fq 'CXI X-Ray 오판정 범위 조정' "$KO"
          grep -Fq '후공정 관리 결정' "$KO"
          grep -Fq '검사 Count와 Range 조건' "$KO"
          grep -Fq '품질협의 결과 양품형상으로 판정' "$KO"
          grep -Fq 'CWS 세정' "$KO"
          grep -Fq 'CMK Marking' "$KO"
          grep -Fq 'CPF Pre-Charge' "$KO"
          grep -Fq 'CTB Tubing' "$KO"
          grep -Fq 'CXI X-ray false-decision range adjustment' "$EN"
          if grep -Fq '형상·후공정 판정 안정화' "$KO"; then
            echo 'Old bundled case remains in generated page' >&2
            exit 1
          fi

      - name: Synchronize and commit generated site
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/' /tmp/site/ ./
          rm -f .github/workflows/publish-project1-case-split.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No generated-site changes were produced.' >&2
            exit 1
          fi
          git commit -m 'deploy(portfolio): publish split 2170 analysis cases'
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '/tmp/site'

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
