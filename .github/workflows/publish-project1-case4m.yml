name: Publish project 1 case-level 4M analysis

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-project1-case4m.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out committed site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated Hugo artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-3cb0-822f-83f7-a6563e6bd814/raw?se=2026-08-08T06%3A23%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=03f87d68-64ac-5b6f-a6f0-cd393c101972&skoid=b1bca990-dcac-4c31-8ca1-ac563cf24c54&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-07T23%3A34%3A52Z&ske=2026-08-08T23%3A34%3A52Z&sks=b&skv=2026-02-06&sig=v9XYMRnkWsBHNGvN49PheZAbpp1JhkMugwGmYJf5OAw%3D' \
            --output /tmp/portfolio-public-case4m.zip
          echo 'cde50514b07d256a1d58beb829076895b067c8bde216cb48718369765733e0ca  /tmp/portfolio-public-case4m.zip' | sha256sum --check
          rm -rf /tmp/site
          mkdir -p /tmp/site
          unzip -q /tmp/portfolio-public-case4m.zip -d /tmp/site

      - name: Verify local 4M analysis in generated pages
        shell: bash
        run: |
          set -euo pipefail
          KO='/tmp/site/posts/battery-2170-pilot/index.html'
          EN='/tmp/site/en/posts/battery-2170-pilot/index.html'
          test -s "$KO"
          test -s "$EN"
          grep -Fq '회전방향별 Setting 요령과 작업순서 차이' "$KO"
          grep -Fq 'O-ring 접촉, Spring, Jig 정렬, 기밀·가압구조' "$KO"
          grep -Fq '전극 교체, Head 정렬과 검사순서 준수 편차' "$KO"
          grep -Fq 'Knife·Head 높이편차, Vision 형상인식, 3-Jaw 마모·파손' "$KO"
          grep -Fq '주요 원인에서 제외' "$KO"
          grep -Fq '핵심 원인' "$KO"
          grep -Fq '주요 원인후보로 유지' "$KO"
          grep -Fq '개선·재시험' "$KO"
          grep -Fq '결과·표준화' "$KO"
          grep -Fq 'Direction-specific setting and work-sequence variation' "$EN"
          test -s /tmp/site/posts/welding-vision-ai/index.html
          test -s /tmp/site/posts/robot-json-omniverse/index.html

      - name: Synchronize and commit generated site
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/' /tmp/site/ ./
          rm -f .github/workflows/publish-project1-case4m.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No generated-site changes were produced.' >&2
            exit 1
          fi
          git commit -m 'deploy(portfolio): publish local 4M analysis for project 1'
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '/tmp/site'

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
