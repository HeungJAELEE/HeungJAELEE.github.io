name: Deploy strengthened Jastech portfolio cases

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-jastech-portfolio-upgrade.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out triggering public commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify deployment base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '5040c375c76fe5db07e2641995435e4619e76fc5'

      - name: Download validated Hugo artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-23d8-8206-8756-caaffe95a8df/raw?se=2026-08-09T17%3A05%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=49d39007-c923-518c-9f93-46fc6d8c9271&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-09T00%3A57%3A14Z&ske=2026-08-10T00%3A57%3A14Z&sks=b&skv=2026-02-06&sig=C8fRQbya9kCdYTaOJR1Y0XNYM0T3GGMHx2HmVUU9fVk%3D' -o /tmp/portfolio-public.zip
          echo 'f2979b759971e293a8ade56a8f5c3d842e6631f79b645f7b7caeaf0fcce01337  /tmp/portfolio-public.zip' | sha256sum -c -
          rm -rf /tmp/portfolio-public
          mkdir -p /tmp/portfolio-public
          unzip -q /tmp/portfolio-public.zip -d /tmp/portfolio-public

      - name: Verify strengthened Jastech cases
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          checks = {
              'posts/ncm-fat-sat/index.html': [
                  '설비업체 기능완료와 실제 Pilot 생산 가능상태 간 Acceptance Gap',
                  '프로젝트 오너십과 Acceptance Evidence',
                  'Punch Closure Logic',
                  '위험항목 개정과 표준문서 전개',
              ],
              'posts/ncm-pre-forming-validation/index.html': [
                  'Pre-Welding 전 양극 Al Foil 파단·음극 Heavy Edge 활물질 탈락·Short와 수작업 위치편차',
                  '배제대안과 설계판정',
                  'Pilot Jig 설계입력',
                  '위험항목 개정과 표준문서 전개',
              ],
              'posts/cell-production-tracking/index.html': [
                  '공정별 MES·파일은 존재하나 Cell S/N 기준 극판 Roll–Formation 연속조회 부재',
                  '데이터 Source of Truth와 연결경계',
                  '정상 조회·원본 불일치·예외 처리',
                  '도구가 자동판정하지 않음',
                  '위험항목과 운영기준 전개',
              ],
              'en/posts/ncm-fat-sat/index.html': [
                  'Project ownership and acceptance evidence',
                  'Punch closure logic',
              ],
              'en/posts/ncm-pre-forming-validation/index.html': [
                  'Rejected alternatives and design disposition',
                  'Pilot-jig design inputs',
              ],
              'en/posts/cell-production-tracking/index.html': [
                  'Data source of truth and link boundary',
                  'Normal lookup, source disagreement, and exceptions',
              ],
          }
          for rel, phrases in checks.items():
              path = Path('/tmp/portfolio-public') / rel
              assert path.is_file() and path.stat().st_size > 0, path
              text = path.read_text(encoding='utf-8')
              for phrase in phrases:
                  assert phrase in text, f'{rel}: {phrase}'
          assert '## 검증 범위' not in (Path('/tmp/portfolio-public') / 'posts/battery-2170-pilot/index.html').read_text(encoding='utf-8')
          print('Strengthened Jastech public artifact: PASS')
          PY

      - name: Publish validated output
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='.*' /tmp/portfolio-public/ ./
          touch .nojekyll
          rm -f .github/workflows/deploy-jastech-portfolio-upgrade.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No public output changes were produced.' >&2
            exit 1
          fi
          git commit -m 'deploy(portfolio): publish strengthened Jastech cases'
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '/tmp/portfolio-public'

  deploy:
    needs: publish-and-verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
