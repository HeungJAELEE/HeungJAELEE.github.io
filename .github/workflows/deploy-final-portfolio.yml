name: Verify live reviewed portfolio deployment

on:
  push:
    branches:
      - codex/deploy-final-portfolio
    paths:
      - .github/workflows/deploy-final-portfolio.yml

permissions:
  contents: read

jobs:
  live-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read live Pages with cache bypass
        shell: bash
        run: |
          set -euo pipefail
          base='https://heungjaelee.github.io'
          version='d11fc4069cf83c7e24222b7908789fe8d787fae9'
          for attempt in 1 2 3 4 5 6; do
            curl --fail --location --silent --show-error "$base/?commit=$version&attempt=$attempt" -o /tmp/home.html || true
            curl --fail --location --silent --show-error "$base/posts/?commit=$version&attempt=$attempt" -o /tmp/posts.html || true
            curl --fail --location --silent --show-error "$base/posts/battery-4695-production-transition/?commit=$version&attempt=$attempt" -o /tmp/4695.html || true
            curl --fail --location --silent --show-error "$base/posts/battery-25p-lfp-development/?commit=$version&attempt=$attempt" -o /tmp/25p.html || true
            curl --fail --location --silent --show-error "$base/posts/ai-authority-evidence-plane/?commit=$version&attempt=$attempt" -o /tmp/authority.html || true
            curl --fail --location --silent --show-error "$base/en/?commit=$version&attempt=$attempt" -o /tmp/home-en.html || true
            if grep -Fq '9년 4개월의 제조 현장 경험 중 대표 결과입니다.' /tmp/home.html \
              && grep -Fq 'Cell S/N 생산이력 추적 도구' /tmp/home.html \
              && grep -Fq '주요 제조 프로젝트' /tmp/posts.html \
              && grep -Fq '25P LFP Cell 개발' /tmp/25p.html \
              && grep -Fq 'AI가 작업하기 전에 근거와 승인을 확인하는 방법' /tmp/authority.html \
              && grep -Fq 'A representative result from nine years and four months in manufacturing roles.' /tmp/home-en.html; then
              break
            fi
            sleep 10
          done
          grep -Fq '9년 4개월의 제조 현장 경험 중 대표 결과입니다.' /tmp/home.html
          grep -Fq 'Cell S/N 생산이력 추적 도구' /tmp/home.html
          grep -Fq '주요 제조 프로젝트' /tmp/posts.html
          grep -Fq '25P LFP Cell 개발' /tmp/25p.html
          grep -Fq 'AI가 작업하기 전에 근거와 승인을 확인하는 방법' /tmp/authority.html
          grep -Fq 'A representative result from nine years and four months in manufacturing roles.' /tmp/home-en.html
          ! grep -Fq '2024.08' /tmp/home.html
          ! grep -Fiq 'FYD' /tmp/4695.html
          ! grep -Fq '96.8%' /tmp/25p.html
          sha256sum /tmp/home.html /tmp/posts.html /tmp/4695.html /tmp/25p.html /tmp/authority.html /tmp/home-en.html
