name: Deploy five compact featured cards

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-home-featured-five.yml'

permissions:
  contents: write

concurrency:
  group: portfolio-public-write
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out public repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact deployment base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '42b106fd4ddbf860bbe226aaf37a9e11f63c5fc0'

      - name: Download validated Hugo artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://sdmntprwestus.oaiusercontent.com/files/00000000-7d14-8230-abc0-f1282fda1476/raw?se=2026-08-10T04%3A27%3A54Z&sp=r&sv=2026-02-06&sr=b&scid=04c9bdde-53c0-51c6-b533-635d200ec7e7&skoid=9063adf3-a524-4acf-b70a-8731b33f2f50&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-09T18%3A32%3A20Z&ske=2026-08-10T18%3A32%3A20Z&sks=b&skv=2026-02-06&sig=3tmu0D0PHomZZ45OQqQaqJ2%2BMlGnXs5ReuW7RVKhjWU%3D' -o /tmp/portfolio-public.zip
          echo '8618c030facd4e8219951a5bef2b26275b7ec113b8136619507c31206d7ff12c  /tmp/portfolio-public.zip' | sha256sum -c -
          rm -rf /tmp/portfolio-public
          mkdir -p /tmp/portfolio-public
          unzip -q /tmp/portfolio-public.zip -d /tmp/portfolio-public

      - name: Verify five-card homepage artifact
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('/tmp/portfolio-public')
          featured = [
              ('battery-2170-pilot', '2170 수율 안정화', '2170 Yield Stabilization'),
              ('ncm-fat-sat', '각형 수율 안정화', 'Prismatic Yield Stabilization'),
              ('amat-akt-qual', 'AMAT Qual 승인', 'AMAT Qual Approval'),
              ('robot-json-omniverse', '자동차 조립 Robot Cell', 'Automotive Assembly Robot Cell'),
              ('ontology-construction', '저사양 PC용 LLM WIKI', 'Low-Spec PC LLM Wiki'),
          ]
          ko = (root / 'index.html').read_text(encoding='utf-8')
          en = (root / 'en/index.html').read_text(encoding='utf-8')
          expected = [item[0] for item in featured]

          for label, text, print_label in [('KO', ko, '>인쇄<'), ('EN', en, '>Print<')]:
              ids = re.findall(r'data-featured-project-id=([^ >]+)', text)
              assert ids == expected, (label, ids, expected)
              assert text.count('data-featured-project-id=') == 5
              assert 'data-featured-project-count=5' in text
              assert 'data-portfolio-print-mode=home' in text
              assert print_label in text
              assert text.count('portfolio-project__category') == 5

          for project_id, ko_title, en_title in featured:
              assert ko_title in ko
              assert en_title in en
              ko_detail = (root / f'posts/{project_id}/index.html').read_text(encoding='utf-8')
              en_detail = (root / f'en/posts/{project_id}/index.html').read_text(encoding='utf-8')
              assert 'data-portfolio-print-mode=project' in ko_detail
              assert 'data-portfolio-print-mode=project' in en_detail

          ko_section = ko.split('portfolio-featured-projects', 1)[1].split('</section>', 1)[0]
          en_section = en.split('portfolio-featured-projects', 1)[1].split('</section>', 1)[0]
          assert ko_section.count('<dt>문제</dt>') == 5
          assert ko_section.count('<dt>성과</dt>') == 5
          assert en_section.count('<dt>Problem</dt>') == 5
          assert en_section.count('<dt>Outcome</dt>') == 5
          for leaked in ['직접 담당</dt>', '결과·현재 단계</dt>', 'Direct responsibility</dt>', 'Result / current stage</dt>']:
              assert leaked not in ko_section + en_section, leaked

          assert any(root.rglob('portfolio-print*.js'))
          assert any(root.rglob('portfolio-featured-five*.css'))
          print('Five-card homepage artifact verification: PASS')
          PY

      - name: Publish validated output
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='.*' /tmp/portfolio-public/ ./
          touch .nojekyll
          rm -f .github/workflows/deploy-home-featured-five.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No public output changes were produced.' >&2
            exit 1
          fi
          git commit -m 'deploy(portfolio): publish five compact featured cards'
          git push origin HEAD:main
