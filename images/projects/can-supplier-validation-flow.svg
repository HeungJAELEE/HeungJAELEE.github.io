<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">대체 Can 공급사 검증과 Pilot 공급 전환 흐름</title>
  <desc id="desc">부품 변경점 확인, 공정위험 분리, 조건 재설정, 3개 Lot 검증, 안전성 시험, Pilot 공급 전환 단계</desc>
  <rect width="1200" height="400" fill="#f7fafc"/>
  <g font-family="Pretendard, Noto Sans KR, sans-serif">
    <text x="56" y="58" fill="#0f2b46" font-size="28" font-weight="700">부품 차이를 공정위험으로 바꾼 뒤 공급을 전환했습니다</text>
    <path d="M96 184h1000" stroke="#d5e5ef" stroke-width="8" stroke-linecap="round"/>
    <g text-anchor="middle">
      <g transform="translate(100 184)">
        <circle r="40" fill="#0f2b46"/>
        <text y="7" fill="#fff" font-size="20" font-weight="700">1</text>
        <text y="82" fill="#005f8f" font-size="17" font-weight="700">변경점</text>
        <text y="108" fill="#2f4d63" font-size="14">소재·바닥 형상</text>
      </g>
      <g transform="translate(300 184)">
        <circle r="40" fill="#0077b6"/>
        <text y="7" fill="#fff" font-size="20" font-weight="700">2</text>
        <text y="82" fill="#005f8f" font-size="17" font-weight="700">공정위험</text>
        <text y="108" fill="#2f4d63" font-size="14">Beading·Crimping</text>
      </g>
      <g transform="translate(500 184)">
        <circle r="40" fill="#0077b6"/>
        <text y="7" fill="#fff" font-size="20" font-weight="700">3</text>
        <text y="82" fill="#005f8f" font-size="17" font-weight="700">조건 재설정</text>
        <text y="108" fill="#2f4d63" font-size="14">Knife·가압·높이</text>
      </g>
      <g transform="translate(700 184)">
        <circle r="40" fill="#0077b6"/>
        <text y="7" fill="#fff" font-size="20" font-weight="700">4</text>
        <text y="82" fill="#005f8f" font-size="17" font-weight="700">3개 Lot</text>
        <text y="108" fill="#2f4d63" font-size="14">600 Cell 검증</text>
      </g>
      <g transform="translate(900 184)">
        <circle r="40" fill="#0077b6"/>
        <text y="7" fill="#fff" font-size="20" font-weight="700">5</text>
        <text y="82" fill="#005f8f" font-size="17" font-weight="700">품질·안전</text>
        <text y="108" fill="#2f4d63" font-size="14">기밀·UN38.3</text>
      </g>
      <g transform="translate(1100 184)">
        <circle r="40" fill="#0f2b46"/>
        <text y="7" fill="#fff" font-size="20" font-weight="700">6</text>
        <text y="82" fill="#005f8f" font-size="17" font-weight="700">공급 전환</text>
        <text y="108" fill="#2f4d63" font-size="14">Pilot 후속 생산</text>
      </g>
    </g>
    <rect x="56" y="328" width="1088" height="42" rx="8" fill="#eaf7fd"/>
    <text x="600" y="355" text-anchor="middle" fill="#16324a" font-size="16">
      확인한 종료점은 Pilot 공급 전환이며 상업 양산과 실현 절감액은 별도 단계입니다
    </text>
  </g>
</svg>
