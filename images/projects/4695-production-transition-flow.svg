<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">4695 조립설비 Auto Cycle 복구 및 제한 생산 전환 흐름</title>
  <desc id="desc">수동운전 상태 확인, 초기 SAT 기준 재설정, 4M+2E 원인판정, Auto Cycle 복구, 200 Cell 재시험, 최종 50 Cell 생산 시작판정의 여섯 단계</desc>
  <rect width="1200" height="360" fill="#f7fafc"/>
  <g font-family="Pretendard, Noto Sans KR, sans-serif">
    <text x="56" y="58" fill="#0f2b46" font-size="28" font-weight="700">4695 조립라인: 수동운전에서 제한 생산 시작판정까지</text>
    <g transform="translate(44 112)">
      <g>
        <rect width="166" height="150" rx="10" fill="#fff7f2" stroke="#d97706" stroke-width="2"/>
        <text x="18" y="40" fill="#9a4e05" font-size="15" font-weight="700">01 현장상태</text>
        <text x="18" y="78" fill="#2f4d63" font-size="14">수동조작</text>
        <text x="18" y="103" fill="#2f4d63" font-size="14">정상 MES 이력 부재</text>
      </g>
      <g transform="translate(190)">
        <rect width="166" height="150" rx="10" fill="#ffffff" stroke="#c9dae5" stroke-width="2"/>
        <text x="18" y="40" fill="#005f8f" font-size="15" font-weight="700">02 기준 재설정</text>
        <text x="18" y="78" fill="#2f4d63" font-size="14">초기 SAT 기준</text>
        <text x="18" y="103" fill="#2f4d63" font-size="14">안전·품질·이력</text>
      </g>
      <g transform="translate(380)">
        <rect width="166" height="150" rx="10" fill="#ffffff" stroke="#c9dae5" stroke-width="2"/>
        <text x="18" y="40" fill="#005f8f" font-size="15" font-weight="700">03 원인판정</text>
        <text x="18" y="78" fill="#2f4d63" font-size="14">4M+2E</text>
        <text x="18" y="103" fill="#2f4d63" font-size="14">Punch·재시험기준</text>
      </g>
      <g transform="translate(570)">
        <rect width="166" height="150" rx="10" fill="#ffffff" stroke="#c9dae5" stroke-width="2"/>
        <text x="18" y="40" fill="#005f8f" font-size="15" font-weight="700">04 Auto Cycle</text>
        <text x="18" y="78" fill="#2f4d63" font-size="14">Sensor·Sequence</text>
        <text x="18" y="103" fill="#2f4d63" font-size="14">Speed·정렬 복구</text>
      </g>
      <g transform="translate(760)">
        <rect width="166" height="150" rx="10" fill="#ffffff" stroke="#c9dae5" stroke-width="2"/>
        <text x="18" y="40" fill="#005f8f" font-size="15" font-weight="700">05 제품 재시험</text>
        <text x="18" y="78" fill="#2f4d63" font-size="14">100 Cell × 2 Lot</text>
        <text x="18" y="103" fill="#2f4d63" font-size="14">약 200 Cell</text>
      </g>
      <g transform="translate(950)">
        <rect width="166" height="150" rx="10" fill="#eaf7fd" stroke="#0077b6" stroke-width="2"/>
        <text x="18" y="40" fill="#005f8f" font-size="15" font-weight="700">06 시작판정</text>
        <text x="18" y="78" fill="#2f4d63" font-size="14">50 Cell One-way</text>
        <text x="18" y="103" fill="#2f4d63" font-size="14">문서·MES 이관</text>
      </g>
