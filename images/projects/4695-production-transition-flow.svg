<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">4695 조립라인 주요 설비 정상화와 제한 생산 판정 흐름</title>
  <desc id="desc">수동운전 상태에서 Laser 3공정과 X-Ray·Ready를 정상화하고, Vision 자동·수동 검사와 설계한계 설비의 제한운전을 분리한 뒤 2개 Lot와 최종 50 Cell로 제한 생산을 판정한 흐름</desc>
  <rect width="1200" height="460" fill="#EFF1ED"/>
  <g font-family="Pretendard, Noto Sans KR, Arial, sans-serif">
    <text x="54" y="54" fill="#1C232C" font-size="28" font-weight="700">4695 조립라인: 정상화·자동검사·제한운전을 구분했습니다</text>
    <text x="54" y="84" fill="#5B6470" font-size="16">설비를 먼저 정상 위치로 돌린 뒤 실제 Cell과 측정결과로 생산 가능범위를 판정했습니다.</text>
  </g>
  <path d="M105 218H1092" stroke="#C9D3DA" stroke-width="7" stroke-linecap="round"/>
  <g fill="#2B5C8A"><path d="M242 218l-12-7v14z"/><path d="M413 218l-12-7v14z"/><path d="M584 218l-12-7v14z"/><path d="M755 218l-12-7v14z"/><path d="M926 218l-12-7v14z"/></g>
  <g font-family="Pretendard, Noto Sans KR, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(105 218)"><circle r="44" fill="#5B6470"/><text y="7" fill="#FFF" font-size="20" font-weight="700">01</text><text y="82" fill="#1C232C" font-size="17" font-weight="700">수동운전 인계</text><text y="107" fill="#5B6470" font-size="13">공정·측정 기준 불일치</text></g>
    <g transform="translate(276 218)"><circle r="44" fill="#2B5C8A"/><text y="7" fill="#FFF" font-size="20" font-weight="700">02</text><text y="82" fill="#1C232C" font-size="17" font-weight="700">Laser 3공정</text><text y="107" fill="#5B6470" font-size="13">정도·조건·단면 검증</text></g>
    <g transform="translate(447 218)"><circle r="44" fill="#2B5C8A"/><text y="7" fill="#FFF" font-size="20" font-weight="700">03</text><text y="82" fill="#1C232C" font-size="17" font-weight="700">검사 Gate</text><text y="107" fill="#5B6470" font-size="13">X-Ray·Vision 자동/수동</text></g>
    <g transform="translate(618 218)"><circle r="44" fill="#2B5C8A"/><text y="7" fill="#FFF" font-size="20" font-weight="700">04</text><text y="82" fill="#1C232C" font-size="17" font-weight="700">Ready·측정</text><text y="107" fill="#5B6470" font-size="13">PLC·기준 Sample·문서</text></g>
    <g transform="translate(789 218)"><circle r="44" fill="#E2711D"/><text y="7" fill="#FFF" font-size="20" font-weight="700">05</text><text y="82" fill="#1C232C" font-size="17" font-weight="700">제한운전</text><text y="107" fill="#5B6470" font-size="13">주액·Crimping·Marking</text></g>
    <g transform="translate(960 218)"><circle r="44" fill="#3F7D58"/><text y="7" fill="#FFF" font-size="20" font-weight="700">06</text><text y="82" fill="#1C232C" font-size="17" font-weight="700">제한 생산 판정</text><text y="107" fill="#5B6470" font-size="13">2 Lot + 최종 50 Cell</text></g>
  </g>
  <g font-family="IBM Plex Mono, Consolas, monospace">
    <rect x="54" y="374" width="1092" height="44" rx="4" fill="#FFFFFF" stroke="#CBD4DB"/>
    <text x="78" y="402" fill="#2B5C8A" font-size="14" font-weight="700">RECOVERED  Laser 3 · X-Ray · Vision 2 · Ready/Measurement</text>
    <text x="695" y="402" fill="#E2711D" font-size="14" font-weight="700">LIMITED  Vision 3 · Filling · Crimping · Marking</text>
  </g>
</svg>
