<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
<title id="title">용접 Vision AI APP 시연 흐름</title>
<desc id="desc">스마트폰 사진을 FastAPI 서버로 보내 ResNet과 DeiT 앙상블 결과를 PWA에서 표시하는 구조</desc>
<rect width="1600" height="620" rx="32" fill="#f8fafc"/>
<text x="70" y="78" font-size="40" font-family="Arial, sans-serif" font-weight="700" fill="#0f172a">용접 Vision AI APP 시연 흐름</text>
<text x="70" y="118" font-size="22" font-family="Arial, sans-serif" fill="#475569">촬영 - API 추론 - 확률보정·Threshold - 결과표시</text>
<g font-family="Arial, sans-serif">
  <rect x="70" y="180" width="270" height="330" rx="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="120" y="220" width="170" height="180" rx="18" fill="#334155"/>
  <path d="M145 325 C180 290 230 350 270 305" fill="none" stroke="#e2e8f0" stroke-width="14" stroke-linecap="round"/>
  <text x="205" y="445" text-anchor="middle" font-size="27" font-weight="700" fill="#0f172a">스마트폰 촬영</text>
  <text x="205" y="478" text-anchor="middle" font-size="19" fill="#64748b">HTTPS multipart/form-data</text>

  <line x1="365" y1="345" x2="500" y2="345" stroke="#64748b" stroke-width="6"/>
  <polygon points="500,345 470,327 470,363" fill="#64748b"/>

  <rect x="530" y="160" width="560" height="370" rx="30" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/>
  <text x="810" y="207" text-anchor="middle" font-size="28" font-weight="700" fill="#4c1d95">FastAPI + Uvicorn /predict</text>
  <rect x="590" y="245" width="205" height="92" rx="18" fill="#ffffff"/><text x="692" y="282" text-anchor="middle" font-size="25" font-weight="700" fill="#1e293b">ResNet-50</text><text x="692" y="313" text-anchor="middle" font-size="18" fill="#64748b">CNN 추론</text>
  <rect x="825" y="245" width="205" height="92" rx="18" fill="#ffffff"/><text x="928" y="282" text-anchor="middle" font-size="25" font-weight="700" fill="#1e293b">DeiT-Small</text><text x="928" y="313" text-anchor="middle" font-size="18" fill="#64748b">Transformer 추론</text>
  <rect x="650" y="380" width="320" height="100" rx="20" fill="#4c1d95"/><text x="810" y="420" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">확률 평균 + Temperature Scaling</text><text x="810" y="454" text-anchor="middle" font-size="20" fill="#ddd6fe">Threshold 적용</text>

  <line x1="1120" y1="345" x2="1250" y2="345" stroke="#64748b" stroke-width="6"/>
  <polygon points="1250,345 1220,327 1220,363" fill="#64748b"/>

  <rect x="1280" y="180" width="250" height="330" rx="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="1405" y="230" text-anchor="middle" font-size="27" font-weight="700" fill="#0f172a">PWA 검사결과</text>
  <rect x="1325" y="270" width="160" height="62" rx="14" fill="#fef3c7"/><text x="1405" y="309" text-anchor="middle" font-size="24" font-weight="700" fill="#92400e">등급 B</text>
  <rect x="1325" y="350" width="160" height="62" rx="14" fill="#fee2e2"/><text x="1405" y="389" text-anchor="middle" font-size="23" font-weight="700" fill="#991b1b">undercut</text>
  <rect x="1325" y="430" width="160" height="52" rx="14" fill="#ccfbf1"/><text x="1405" y="464" text-anchor="middle" font-size="22" font-weight="700" fill="#115e59">91.4%</text>
</g>
<text x="1185" y="318" text-anchor="middle" font-size="20" font-family="Arial, sans-serif" fill="#475569">JSON</text>
<text x="1185" y="384" text-anchor="middle" font-size="17" font-family="Arial, sans-serif" fill="#64748b">grade · defect_type · confidence</text>
</svg>
