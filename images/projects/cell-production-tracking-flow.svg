<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Cell S/N 생산이력 조회 흐름</title>
  <desc id="desc">Cell S/N을 입력하면 구성자재, 극판 Roll, 조립과 검사, Formation 용량을 연결해 조회하는 구조</desc>
  <rect width="1200" height="360" rx="18" fill="#EFF1ED"/>
  <g fill="none" stroke="#2B5C8A" stroke-width="2">
    <path d="M232 180h82"/>
    <path d="M466 180h82"/>
    <path d="M700 180h82"/>
    <path d="M934 180h82"/>
  </g>
  <g fill="#2B5C8A">
    <path d="m314 180-12-7v14z"/>
    <path d="m548 180-12-7v14z"/>
    <path d="m782 180-12-7v14z"/>
    <path d="m1016 180-12-7v14z"/>
  </g>
  <g font-family="Pretendard, Arial, sans-serif">
    <text x="60" y="62" fill="#1C232C" font-size="23" font-weight="700">공정별 데이터를 Cell S/N으로 연결한 조회 구조</text>
    <text x="60" y="91" fill="#5B6470" font-size="16">기존 공정 기록을 새로 만들지 않고, Cell 한 개의 제조·검사이력으로 다시 연결했습니다.</text>
  </g>
  <g font-family="Pretendard, Arial, sans-serif">
    <g>
      <rect x="50" y="125" width="182" height="110" rx="10" fill="#FFFFFF" stroke="#2B5C8A"/>
      <text x="72" y="163" fill="#2B5C8A" font-size="13" font-weight="700">01 · SEARCH KEY</text>
      <text x="72" y="198" fill="#1C232C" font-size="22" font-weight="700">Cell S/N</text>
    </g>
    <g>
      <rect x="314" y="125" width="152" height="110" rx="10" fill="#FFFFFF" stroke="#2B5C8A"/>
      <text x="336" y="163" fill="#2B5C8A" font-size="13" font-weight="700">02 · MATERIAL</text>
      <text x="336" y="193" fill="#1C232C" font-size="17" font-weight="700">구성자재</text>
      <text x="336" y="216" fill="#5B6470" font-size="13">극판·분리막·부품</text>
    </g>
    <g>
      <rect x="548" y="125" width="152" height="110" rx="10" fill="#FFFFFF" stroke="#2B5C8A"/>
      <text x="570" y="163" fill="#2B5C8A" font-size="13" font-weight="700">03 · ELECTRODE</text>
      <text x="570" y="193" fill="#1C232C" font-size="17" font-weight="700">극판 Roll</text>
      <text x="570" y="216" fill="#5B6470" font-size="13">Lot·생산 위치</text>
    </g>
    <g>
      <rect x="782" y="125" width="152" height="110" rx="10" fill="#FFFFFF" stroke="#2B5C8A"/>
      <text x="804" y="163" fill="#2B5C8A" font-size="13" font-weight="700">04 · ASSEMBLY</text>
      <text x="804" y="193" fill="#1C232C" font-size="17" font-weight="700">조립·검사</text>
      <text x="804" y="216" fill="#5B6470" font-size="13">공정결과·판정</text>
    </g>
    <g>
      <rect x="1016" y="125" width="134" height="110" rx="10" fill="#FFFFFF" stroke="#3F7D58" stroke-width="2"/>
      <text x="1038" y="163" fill="#3F7D58" font-size="13" font-weight="700">05 · RESULT</text>
      <text x="1038" y="193" fill="#1C232C" font-size="17" font-weight="700">Formation</text>
      <text x="1038" y="216" fill="#5B6470" font-size="13">용량·최종이력</text>
    </g>
  </g>
  <g font-family="IBM Plex Mono, Consolas, monospace">
    <text x="60" y="303" fill="#5B6470" font-size="14">SINGLE SEARCH  5–10 sec</text>
    <text x="375" y="303" fill="#3F7D58" font-size="14" font-weight="700">10 CELLS  about 3 days → about 3 min</text>
  </g>
</svg>
