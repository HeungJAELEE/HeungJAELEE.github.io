<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
<title id="title">직접 촬영 용접실기품 데이터 증강 전후 성능 비교</title>
<desc id="desc">Accuracy, Precision, Recall, F1은 증가하고 FPR은 감소한 비교 차트</desc>
<rect width="1600" height="760" rx="32" fill="#f8fafc"/>
<text x="80" y="86" font-size="42" font-family="Arial, sans-serif" font-weight="700" fill="#0f172a">직접 촬영 실기품: 증강 전후 성능 변화</text>
<text x="80" y="128" font-size="23" font-family="Arial, sans-serif" fill="#475569">동일 평가단계에서 촬영조건을 반영한 증강·추가학습 전후 비교</text>
<g font-family="Arial, sans-serif">
  <rect x="1110" y="62" width="26" height="26" rx="5" fill="#94a3b8"/><text x="1150" y="83" font-size="22" fill="#334155">증강 전</text>
  <rect x="1300" y="62" width="26" height="26" rx="5" fill="#ef4444"/><text x="1340" y="83" font-size="22" fill="#334155">증강 후</text>
</g>
<g stroke="#cbd5e1" stroke-width="2">
  <line x1="250" y1="170" x2="250" y2="650"/><line x1="250" y1="650" x2="1510" y2="650"/>
  <line x1="250" y1="554" x2="1510" y2="554"/><line x1="250" y1="458" x2="1510" y2="458"/><line x1="250" y1="362" x2="1510" y2="362"/><line x1="250" y1="266" x2="1510" y2="266"/><line x1="250" y1="170" x2="1510" y2="170"/>
</g>
<g font-family="Arial, sans-serif" font-size="20" fill="#64748b" text-anchor="end">
  <text x="232" y="657">0%</text><text x="232" y="561">20%</text><text x="232" y="465">40%</text><text x="232" y="369">60%</text><text x="232" y="273">80%</text><text x="232" y="177">100%</text>
</g>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <g><rect x="340" y="463.5" width="62" height="186.5" rx="8" fill="#94a3b8"/><rect x="414" y="224.7" width="62" height="425.3" rx="8" fill="#ef4444"/><text x="408" y="696" font-size="22" fill="#0f172a">Accuracy</text><text x="371" y="449" font-size="18" fill="#475569">38.86</text><text x="445" y="211" font-size="18" fill="#b91c1c">88.60</text></g>
  <g><rect x="580" y="493.3" width="62" height="156.7" rx="8" fill="#94a3b8"/><rect x="654" y="206.1" width="62" height="443.9" rx="8" fill="#ef4444"/><text x="648" y="696" font-size="22" fill="#0f172a">Precision</text><text x="611" y="479" font-size="18" fill="#475569">32.65</text><text x="685" y="193" font-size="18" fill="#b91c1c">92.47</text></g>
  <g><rect x="820" y="574.0" width="62" height="76.0" rx="8" fill="#94a3b8"/><rect x="894" y="241.3" width="62" height="408.7" rx="8" fill="#ef4444"/><text x="888" y="696" font-size="22" fill="#0f172a">Recall</text><text x="851" y="560" font-size="18" fill="#475569">15.84</text><text x="925" y="228" font-size="18" fill="#b91c1c">85.15</text></g>
  <g><rect x="1060" y="547.6" width="62" height="102.4" rx="8" fill="#94a3b8"/><rect x="1134" y="224.4" width="62" height="425.6" rx="8" fill="#ef4444"/><text x="1128" y="696" font-size="22" fill="#0f172a">F1</text><text x="1091" y="534" font-size="18" fill="#475569">21.33</text><text x="1165" y="211" font-size="18" fill="#b91c1c">88.66</text></g>
  <g><rect x="1300" y="477.8" width="62" height="172.2" rx="8" fill="#94a3b8"/><rect x="1374" y="613.5" width="62" height="36.5" rx="8" fill="#0f766e"/><text x="1368" y="696" font-size="22" fill="#0f172a">FPR</text><text x="1331" y="464" font-size="18" fill="#475569">35.87</text><text x="1405" y="600" font-size="18" fill="#0f766e">7.61</text></g>
</g>
<rect x="76" y="184" width="126" height="420" rx="24" fill="#fff" stroke="#e2e8f0"/>
<text x="139" y="260" text-anchor="middle" font-size="24" font-family="Arial, sans-serif" font-weight="700" fill="#0f172a">핵심</text>
<text x="139" y="330" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" fill="#0f766e">Recall</text>
<text x="139" y="372" text-anchor="middle" font-size="32" font-family="Arial, sans-serif" font-weight="700" fill="#0f766e">+69.31%p</text>
<text x="139" y="455" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" fill="#b91c1c">FPR</text>
<text x="139" y="497" text-anchor="middle" font-size="32" font-family="Arial, sans-serif" font-weight="700" fill="#b91c1c">-28.26%p</text>
<text x="139" y="560" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" fill="#64748b">촬영조건 반영</text>
</svg>
