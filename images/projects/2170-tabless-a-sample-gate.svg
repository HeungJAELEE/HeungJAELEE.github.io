    <path d="M1180 292h52l-12-10 6-7 25 17-25 17-6-7 12-10h-52z"/>
  </g>

  <rect x="72" y="470" width="1296" height="52" fill="#FFFFFF" stroke="#C5CBD0"/>
  <text x="720" y="502" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="17" font-weight="700" fill="#1C232C">A-SAMPLE PoC · 임시 제조경로 · 약 100개 Trial · 기능 Sample 5개 Cell 평가</text>
</svg>
