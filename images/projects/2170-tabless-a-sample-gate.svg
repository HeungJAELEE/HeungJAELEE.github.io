<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">2170 Tabless A Sample 선행 제조 PoC</title>
  <desc id="desc">전용 설비와 Jig가 없는 조건에서 기존 4695 설비와 3D Print 임시 Jig로 제조경로를 구성하고, 절단·해체·Hi-Pot 안전검사와 약 100개 Trial의 Failure Mode 분리를 거쳐 기능 Sample 5개의 Cell 타당성을 확인한 흐름</desc>
  <rect width="1440" height="560" fill="#EFF1ED"/>
  <g font-family="Pretendard, Noto Sans KR, Arial, sans-serif">
    <text x="72" y="68" fill="#1C232C" font-size="30" font-weight="700">2170 TABLESS · A-SAMPLE MANUFACTURING PoC</text>
    <text x="72" y="106" fill="#5B6470" font-size="17">No Eq·No Jig 조건에서 임시 제조경로를 만들고 내부 안전검사와 Cell 평가까지 연결</text>
  </g>

  <line x1="116" y1="292" x2="1324" y2="292" stroke="#AAB4BA" stroke-width="3"/>

  <g font-family="Pretendard, Noto Sans KR, Arial, sans-serif">
    <g transform="translate(112 0)">
      <circle cx="0" cy="292" r="43" fill="#1C3F5B"/>
      <text x="0" y="301" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="700">01</text>
      <text x="0" y="374" text-anchor="middle" fill="#1C232C" font-size="19" font-weight="700">제조 제약</text>
      <text x="0" y="404" text-anchor="middle" fill="#5B6470" font-size="15">전용 설비·Jig 부재</text>
    </g>

    <g transform="translate(356 0)">
      <circle cx="0" cy="292" r="43" fill="#2B5C8A"/>
      <text x="0" y="301" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="700">02</text>
      <text x="0" y="374" text-anchor="middle" fill="#1C232C" font-size="19" font-weight="700">임시 제조경로</text>
      <text x="0" y="404" text-anchor="middle" fill="#5B6470" font-size="15">4695 설비·3D Print Jig</text>
    </g>

    <g transform="translate(600 0)">
      <circle cx="0" cy="292" r="43" fill="#2B5C8A"/>
      <text x="0" y="301" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="700">03</text>
      <text x="0" y="374" text-anchor="middle" fill="#1C232C" font-size="19" font-weight="700">안전검사</text>
      <text x="0" y="404" text-anchor="middle" fill="#5B6470" font-size="15">절단·해체·Hi-Pot</text>
    </g>

    <g transform="translate(844 0)">
      <circle cx="0" cy="292" r="43" fill="#E2711D"/>
      <text x="0" y="301" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="700">04</text>
      <text x="0" y="374" text-anchor="middle" fill="#1C232C" font-size="19" font-weight="700">약 100개 Trial</text>
      <text x="0" y="404" text-anchor="middle" fill="#5B6470" font-size="15">Failure Mode 분리</text>
    </g>

    <g transform="translate(1088 0)">
      <circle cx="0" cy="292" r="43" fill="#3F7D58"/>
      <text x="0" y="301" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="700">05</text>
      <text x="0" y="374" text-anchor="middle" fill="#1C232C" font-size="19" font-weight="700">Cell 평가</text>
      <text x="0" y="404" text-anchor="middle" fill="#5B6470" font-size="15">기능 Sample 5개</text>
    </g>

    <g transform="translate(1332 0)">
      <circle cx="0" cy="292" r="43" fill="#3F7D58"/>
      <text x="0" y="301" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="700">06</text>
      <text x="0" y="374" text-anchor="middle" fill="#1C232C" font-size="19" font-weight="700">PoC 완료</text>
      <text x="0" y="404" text-anchor="middle" fill="#5B6470" font-size="15">Cell 타당성 확인</text>
    </g>
  </g>

  <g fill="#2B5C8A">
    <path d="M204 292h52l-12-10 6-7 25 17-25 17-6-7 12-10h-52z"/>
    <path d="M448 292h52l-12-10 6-7 25 17-25 17-6-7 12-10h-52z"/>
