<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">im-not-ai foundation and Agent OS target architecture</title>
  <desc id="desc">The implemented im-not-ai evidence-governed career-writing foundation appears above, and the Agent OS expansion into persistent agents, workflow, human approval, domain packs and authoritative readback appears below.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#edf3f8"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#345b7e"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17324d" flood-opacity=".12"/>
    </filter>
    <style>
      .bg{fill:url(#bg)}.title{font:700 36px Arial,sans-serif;fill:#14283d}.sub{font:500 20px Arial,sans-serif;fill:#53677a}
      .band{fill:#143d63}.band2{fill:#285f8a}.bandtext{font:700 22px Arial,sans-serif;fill:#fff;letter-spacing:1.2px}
      .box{fill:#fff;stroke:#6f91ad;stroke-width:2;rx:16;filter:url(#shadow)}.box2{fill:#f3f7fa;stroke:#6f91ad;stroke-width:2;rx:16}
      .label{font:700 15px Arial,sans-serif;fill:#2f668e;letter-spacing:1.1px}.head{font:700 23px Arial,sans-serif;fill:#17324d}.body{font:400 17px Arial,sans-serif;fill:#53677a}
      .arrow{stroke:#345b7e;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#849bac;stroke-width:2;stroke-dasharray:8 7;fill:none}
      .pill{fill:#e8f0f6;stroke:#7f9db5;stroke-width:1.5;rx:14}.pilltext{font:600 16px Arial,sans-serif;fill:#244f72}
      .note{font:600 18px Arial,sans-serif;fill:#26435e}.small{font:400 15px Arial,sans-serif;fill:#617487}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900" rx="24"/>
  <text x="70" y="62" class="title">Evidence-Governed AI Work → Agent OS</text>
  <text x="70" y="96" class="sub">구현된 im-not-ai Application Plane과 Persistent Agent·Approval·Readback 목표 구조</text>

  <rect x="70" y="132" width="1460" height="46" rx="12" class="band"/>
  <text x="100" y="162" class="bandtext">IMPLEMENTED FOUNDATION · im-not-ai@9160142</text>

  <g transform="translate(70 208)">
    <rect class="box" x="0" y="0" width="210" height="150"/>
    <text class="label" x="24" y="35">SOURCE</text><text class="head" x="24" y="72">최신 근거</text>
    <text class="body" x="24" y="105">원장·승인본</text><text class="body" x="24" y="130">Runtime Readback</text>

    <path class="arrow" d="M220 75 H270"/>
    <rect class="box" x="280" y="0" width="210" height="150"/>
    <text class="label" x="304" y="35">LOCK</text><text class="head" x="304" y="72">공통 Claim 원장</text>
    <text class="body" x="304" y="105">Contribution·Stage</text><text class="body" x="304" y="130">Metric·Public Scope</text>

    <path class="arrow" d="M500 75 H550"/>
    <rect class="box" x="560" y="0" width="210" height="150"/>
    <text class="label" x="584" y="35">ROUTE</text><text class="head" x="584" y="72">Career Router</text>
    <text class="body" x="584" y="105">Resume·Portfolio</text><text class="body" x="584" y="130">산출물 책임 분리</text>

    <path class="arrow" d="M780 75 H830"/>
    <rect class="box" x="840" y="0" width="210" height="150"/>
    <text class="label" x="864" y="35">STYLE</text><text class="head" x="864" y="72">Humanize</text>
    <text class="body" x="864" y="105">LOCKED CONTENT</text><text class="body" x="864" y="130">문체만 국소 수정</text>

    <path class="arrow" d="M1060 75 H1110"/>
    <rect class="box" x="1120" y="0" width="270" height="150"/>
    <text class="label" x="1144" y="35">VERIFY / ROLLBACK</text><text class="head" x="1144" y="72">결정적 Code Gate</text>
    <text class="body" x="1144" y="105">Private Pattern Block</text><text class="body" x="1144" y="130">30% Warn · 50% Abort</text>
  </g>

  <g transform="translate(250 390)">
    <rect class="pill" x="0" y="0" width="210" height="42"/><text class="pilltext" x="105" y="27" text-anchor="middle">career-writing-korean</text>
    <rect class="pill" x="235" y="0" width="170" height="42"/><text class="pilltext" x="320" y="27" text-anchor="middle">resume-korean</text>
    <rect class="pill" x="430" y="0" width="180" height="42"/><text class="pilltext" x="520" y="27" text-anchor="middle">portfolio-korean</text>
    <rect class="pill" x="635" y="0" width="185" height="42"/><text class="pilltext" x="727" y="27" text-anchor="middle">humanize-korean</text>
    <rect class="pill" x="845" y="0" width="250" height="42"/><text class="pilltext" x="970" y="27" text-anchor="middle">bundle + change-rate validator</text>
  </g>

  <path class="dash" d="M800 456 V505"/>
  <text x="826" y="487" class="note">같은 Authority 계약을 다중 Agent와 외부 Effect로 확장</text>

  <rect x="70" y="518" width="1460" height="46" rx="12" class="band2"/>
  <text x="100" y="548" class="bandtext">AGENT OS TARGET PLATFORM · LOCAL DESIGN FOUNDATION</text>

  <g transform="translate(70 595)">
    <rect class="box2" x="0" y="0" width="170" height="142"/>
    <text class="label" x="20" y="32">WIKI</text><text class="head" x="20" y="68">근거·Revision</text><text class="body" x="20" y="103">Source Binding</text><text class="body" x="20" y="126">Conflict 표시</text>
    <path class="arrow" d="M180 71 H220"/>
    <rect class="box2" x="230" y="0" width="170" height="142"/>
    <text class="label" x="250" y="32">BUILDER</text><text class="head" x="250" y="68">Agent Package</text><text class="body" x="250" y="103">Role·Tool·Policy</text><text class="body" x="250" y="126">Revision</text>
    <path class="arrow" d="M410 71 H450"/>
    <rect class="box2" x="460" y="0" width="170" height="142"/>
    <text class="label" x="480" y="32">PERSIST</text><text class="head" x="480" y="68">Agent Registry</text><text class="body" x="480" y="103">Session 독립 ID</text><text class="body" x="480" y="126">조직·업무 이력</text>
    <path class="arrow" d="M640 71 H680"/>
    <rect class="box2" x="690" y="0" width="170" height="142"/>
    <text class="label" x="710" y="32">FLOW</text><text class="head" x="710" y="68">Worker·Manager</text><text class="body" x="710" y="103">비교·Dissent</text><text class="body" x="710" y="126">통합 Rework</text>
    <path class="arrow" d="M870 71 H910"/>
    <rect class="box2" x="920" y="0" width="170" height="142"/>
    <text class="label" x="940" y="32">CONTROL</text><text class="head" x="940" y="68">Runtime</text><text class="body" x="940" y="103">Lease·Checkpoint</text><text class="body" x="940" y="126">Stop·Recovery</text>
    <path class="arrow" d="M1100 71 H1140"/>
    <rect class="box2" x="1150" y="0" width="170" height="142"/>
    <text class="label" x="1170" y="32">APPROVAL</text><text class="head" x="1170" y="68">Human Inbox</text><text class="body" x="1170" y="103">Target·Scope·Expiry</text><text class="body" x="1170" y="126">Rollback</text>
    <path class="arrow" d="M1330 71 H1360"/>
    <rect class="box2" x="1370" y="0" width="150" height="142"/>
    <text class="label" x="1390" y="32">READBACK</text><text class="head" x="1390" y="68">Domain Pack</text><text class="body" x="1390" y="103">Effect 결과</text><text class="body" x="1390" y="126">실제 상태</text>
  </g>

  <g transform="translate(70 780)">
    <rect x="0" y="0" width="1460" height="72" rx="16" fill="#dfeaf2" stroke="#88a2b8"/>
    <text x="30" y="30" class="note">LOCAL FOUNDATION</text>
    <text x="250" y="30" class="small">13 Areas · 167 Topics · 111 Realizations · 175 Dependencies · 172 Semantic Obligations</text>
    <text x="250" y="55" class="small">1,837 Acceptance Bindings · 47 Node.js 24 Checks · 2 Independent Read-only Audits</text>
  </g>
</svg>
