<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">25P LFP IATF 품질 Gate와 DMADV·Taguchi 공정개발</title>
  <desc id="desc">PROTO A Sample, PILOT B와 C Sample, MP CCB.PO, SOP의 품질 Gate와 DMADV Define Measure Analyze Design Verify, 4M 위험분석, Taguchi DOE, 약 2만 Cell 시양산과 고객 Qual을 연결한 흐름</desc>
