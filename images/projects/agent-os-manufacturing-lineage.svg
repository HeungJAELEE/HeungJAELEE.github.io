<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">TO-BE — 생산기술 판단을 하나의 Lineage로 연결</title>
  <desc id="desc">현장 질문에서 Source Snapshot과 Source Binding을 거쳐 공정 품질 생산 Agent, Manager 조율, 생산기술 엔지니어 승인, 제한 Effect와 Authoritative Readback으로 이어지는 제조 Agent OS 판단 흐름</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1562c2"/><stop offset="1" stop-color="#063c91"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#163d68" flood-opacity=".13"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0b4da2"/></marker>
    <style>
      .title{font:700 45px Arial,'Noto Sans KR',sans-serif;fill:#082a61}.box{fill:#fff;stroke:#3a79c4;stroke-width:2.2;rx:17;filter:url(#shadow)}.badge{fill:url(#blue);rx:10}.badgeText{font:700 31px Arial,sans-serif;fill:#fff}.head{font:700 27px Arial,'Noto Sans KR',sans-serif;fill:#101923}.body{font:400 19px Arial,'Noto Sans KR',sans-serif;fill:#202a35}.line{stroke:#0b4da2;stroke-width:3;fill:none;marker-end:url(#arrow)}.branch{stroke:#0b4da2;stroke-width:3;fill:none}.pill{fill:#fff;stroke:#5d8ed0;stroke-width:2;rx:25}.pillText{font:600 22px Arial,'Noto Sans KR',sans-serif;fill:#152335}.note{fill:#f7faff;stroke:#72a2dc;stroke-width:2;rx:18}.noteText{font:500 24px Arial,'Noto Sans KR',sans-serif;fill:#111d2b}
    </style>
  </defs>
  <rect width="1600" height="1200" fill="#fff"/>
  <text x="800" y="70" text-anchor="middle" class="title">TO-BE — 생산기술 판단을 하나의 Lineage로 연결</text>

  <g transform="translate(50 120)"><rect class="box" width="360" height="105"/><rect class="badge" x="20" y="22" width="55" height="58"/><text class="badgeText" x="47" y="61" text-anchor="middle">Q</text><text class="head" x="220" y="44" text-anchor="middle">현장 질문</text><text class="body" x="220" y="76" text-anchor="middle">설비 이상 · 수율 · 품질 편차</text></g>
  <path class="line" d="M410 172 H465"/>
  <g transform="translate(475 120)"><rect class="box" width="360" height="105"/><rect class="badge" x="20" y="22" width="55" height="58"/><text class="badgeText" x="47" y="61" text-anchor="middle">S</text><text class="head" x="220" y="44" text-anchor="middle">Source Snapshot</text><text class="body" x="220" y="76" text-anchor="middle">MES · PLC/OPC · 검사 · 표준문서</text></g>
  <path class="line" d="M835 172 H890"/>
  <g transform="translate(900 120)"><rect class="box" width="450" height="105"/><rect class="badge" x="20" y="22" width="55" height="58"/><text class="badgeText" x="47" y="61" text-anchor="middle">B</text><text class="head" x="265" y="44" text-anchor="middle">Source Binding</text><text class="body" x="265" y="76" text-anchor="middle">시간 · Lot · Tag · State · Revision · 적용범위</text></g>

  <path class="branch" d="M1125 225 V270 H470 V315 M805 270 V315 M1160 270 V315"/>
  <path class="line" d="M470 270 V315"/><path class="line" d="M805 270 V315"/><path class="line" d="M1160 270 V315"/>
  <g transform="translate(285 315)"><rect class="box" width="370" height="105"/><rect class="badge" x="18" y="23" width="58" height="58"/><text class="badgeText" x="47" y="62" text-anchor="middle">P</text><text class="head" x="230" y="45" text-anchor="middle">공정 Agent</text><text class="body" x="230" y="77" text-anchor="middle">조건 · 4M · 변경점</text></g>
  <g transform="translate(620 315)"><rect class="box" width="370" height="105"/><rect class="badge" x="18" y="23" width="65" height="58"/><text class="badgeText" x="50" y="62" text-anchor="middle">QL</text><text class="head" x="235" y="45" text-anchor="middle">품질 Agent</text><text class="body" x="235" y="77" text-anchor="middle">판정 · 검사 · CTQ</text></g>
  <g transform="translate(975 315)"><rect class="box" width="400" height="105"/><rect class="badge" x="18" y="23" width="65" height="58"/><text class="badgeText" x="50" y="62" text-anchor="middle">PR</text><text class="head" x="250" y="45" text-anchor="middle">생산 Agent</text><text class="body" x="250" y="77" text-anchor="middle">계획 · 재공 · 병목 · 이력</text></g>

  <path class="branch" d="M470 420 V455 H805 M805 420 V455 M1175 420 V455 H805"/><path class="line" d="M805 455 V500"/>
  <g transform="translate(535 500)"><rect class="box" width="540" height="110"/><rect class="badge" x="20" y="25" width="60" height="60"/><text class="badgeText" x="50" y="65" text-anchor="middle">M</text><text class="head" x="315" y="47" text-anchor="middle">Manager 조율</text><text class="body" x="315" y="80" text-anchor="middle">공통점 · 충돌 · Dissent · 재검사</text></g>
  <path class="line" d="M805 610 V665"/>
  <g transform="translate(535 665)"><rect class="box" width="540" height="110"/><rect class="badge" x="20" y="25" width="60" height="60"/><text class="badgeText" x="50" y="65" text-anchor="middle">H</text><text class="head" x="315" y="47" text-anchor="middle">생산기술 엔지니어</text><text class="body" x="315" y="80" text-anchor="middle">작업 제안 검토 · 승인</text></g>

  <path class="branch" d="M705 775 V820 H465 V870 M905 775 V820 H990 V870"/>
  <g transform="translate(360 810)"><rect class="pill" width="180" height="48"/><text class="pillText" x="90" y="32" text-anchor="middle">읽기 · 보고</text></g>
  <g transform="translate(900 810)"><rect class="pill" width="180" height="48"/><text class="pillText" x="90" y="32" text-anchor="middle">별도 승인</text></g>
  <path class="line" d="M465 858 V870"/><path class="line" d="M990 858 V870"/>
  <g transform="translate(280 870)"><rect class="box" width="370" height="100"/><rect class="badge" x="20" y="22" width="55" height="58"/><text class="badgeText" x="47" y="61" text-anchor="middle">O</text><text class="head" x="230" y="58" text-anchor="middle">Outcome Record</text></g>
  <g transform="translate(790 870)"><rect class="box" width="400" height="100"/><rect class="badge" x="20" y="22" width="55" height="58"/><text class="badgeText" x="47" y="61" text-anchor="middle">E</text><text class="head" x="240" y="58" text-anchor="middle">제한 Effect Adapter</text></g>
  <path class="line" d="M1190 920 H1250"/>
  <g transform="translate(1260 870)"><rect class="box" width="300" height="100"/><rect class="badge" x="18" y="22" width="55" height="58"/><text class="badgeText" x="45" y="61" text-anchor="middle">R</text><text class="head" x="185" y="45" text-anchor="middle" style="font-size:22px">Authoritative Readback</text><text class="body" x="185" y="76" text-anchor="middle">설비 · MES 실제 상태</text></g>
  <path class="branch" d="M1410 970 V1010 H465 V970"/><path class="line" d="M465 1010 V970"/>

  <rect class="note" x="55" y="1050" width="1490" height="110"/><text class="noteText" x="800" y="1093" text-anchor="middle">핵심은 더 많은 AI를 붙이는 것이 아니라, 공정 · 품질 · 생산 Agent가 같은 Source Snapshot을 공유하고</text><text class="noteText" x="800" y="1130" text-anchor="middle">사람 승인과 실제 Readback으로 판단을 닫는 구조입니다.</text>
</svg>