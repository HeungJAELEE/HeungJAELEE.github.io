<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">NCM 각형 Pilot Line 인수와 초기 생산 검증 흐름</title>
  <desc id="desc">인수기준, 공급사 FAT, 현장 SAT, Punch 재시험, 약 1,000 Cell 생산, 운영기준 이관 단계</desc>
  <rect width="1200" height="420" fill="#f7fafc"/>
  <g font-family="Pretendard, Noto Sans KR, sans-serif">
    <text x="56" y="58" fill="#0f2b46" font-size="28" font-weight="700">사양서의 합격조건을 실제 Cell 생산까지 이어 확인했습니다</text>
    <text x="56" y="88" fill="#5b6d7e" font-size="15">기능완료 통보보다 같은 기준의 재시험과 제품결과를 인수판정에 사용</text>
    <path d="M96 200h1000" stroke="#d5e5ef" stroke-width="8" stroke-linecap="round"/>
    <g text-anchor="middle">
      <g transform="translate(100 200)">
        <circle r="40" fill="#0f2b46"/>
        <text y="7" fill="#fff" font-size="20" font-weight="700">1</text>
        <text y="82" fill="#005f8f" font-size="17" font-weight="700">인수기준</text>
        <text y="108" fill="#2f4d63" font-size="14">기능·안전·품질·Cycle</text>
      </g>
      <g transform="translate(300 200)">
        <circle r="40" fill="#0077b6"/>
        <text y="7" fill="#fff" font-size="20" font-weight="700">2</text>
        <text y="82" fill="#005f8f" font-size="17" font-weight="700">공급사 FAT</text>
        <text y="108" fill="#2f4d63" font-size="14">단위기능·제한 Sample</text>
      </g>
      <g transform="translate(500 200)">
        <circle r="40" fill="#0077b6"/>
        <text y="7" fill="#fff" font-size="20" font-weight="700">3</text>
        <text y="82" fill="#005f8f" font-size="17" font-weight="700">현장 SAT</text>
        <text y="108" fill="#2f4d63" font-size="14">설치·전후공정·작업흐름</text>
      </g>
      <g transform="translate(700 200)">
        <circle r="40" fill="#0077b6"/>
        <text y="7" fill="#fff" font-size="20" font-weight="700">4</text>
        <text y="82" fill="#005f8f" font-size="17" font-weight="700">Punch 재시험</text>
        <text y="108" fill="#2f4d63" font-size="14">담당·기한·동일 판정기준</text>
      </g>
      <g transform="translate(900 200)">
        <circle r="40" fill="#0077b6"/>
        <text y="7" fill="#fff" font-size="20" font-weight="700">5</text>
        <text y="82" fill="#005f8f" font-size="17" font-weight="700">실제 Cell</text>
        <text y="108" fill="#2f4d63" font-size="14">약 5일·약 1,000 Cell</text>
      </g>
      <g transform="translate(1100 200)">
        <circle r="40" fill="#0f2b46"/>
        <text y="7" fill="#fff" font-size="20" font-weight="700">6</text>
        <text y="82" fill="#005f8f" font-size="17" font-weight="700">운영기준</text>
        <text y="108" fill="#2f4d63" font-size="14">측정·공정·검사·이력</text>
      </g>
    </g>
    <rect x="56" y="344" width="1088" height="48" rx="8" fill="#eaf7fd"/>
    <text x="600" y="374" text-anchor="middle" fill="#16324a" font-size="16">
      핵심설비 11대 · 주요 생산공정 13개 · EOL 높이검사설비는 별도 범위
    </text>
  </g>
