<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">NCM Pilot Line 설비 인수 흐름</title>
  <desc id="desc">인수기준, FAT와 SAT, 펀치 리스트, 재시험, 파일럿 생산과 이력관리 단계</desc>
  <rect width="1200" height="400" fill="#f7fafc"/>
  <g font-family="Pretendard, Noto Sans KR, sans-serif">
    <text x="56" y="58" fill="#0f2b46" font-size="28" font-weight="700">설비가 움직이는 것과 생산 준비가 끝난 것은 다릅니다</text>
    <path d="M96 184h1000" stroke="#d5e5ef" stroke-width="8" stroke-linecap="round"/>
    <g text-anchor="middle">
      <g transform="translate(100 184)">
        <circle r="40" fill="#0f2b46"/>
        <text y="7" fill="#fff" font-size="20" font-weight="700">1</text>
        <text y="82" fill="#005f8f" font-size="17" font-weight="700">인수기준</text>
        <text y="108" fill="#2f4d63" font-size="14">기능·정밀도·안전</text>
      </g>
      <g transform="translate(300 184)">
        <circle r="40" fill="#0077b6"/>
        <text y="7" fill="#fff" font-size="20" font-weight="700">2</text>
        <text y="82" fill="#005f8f" font-size="17" font-weight="700">FAT / SAT</text>
        <text y="108" fill="#2f4d63" font-size="14">사양 대조·현장 확인</text>
      </g>
      <g transform="translate(500 184)">
        <circle r="40" fill="#0077b6"/>
        <text y="7" fill="#fff" font-size="20" font-weight="700">3</text>
        <text y="82" fill="#005f8f" font-size="17" font-weight="700">Punch List</text>
        <text y="108" fill="#2f4d63" font-size="14">업체·기한·판정기준</text>
      </g>
      <g transform="translate(700 184)">
        <circle r="40" fill="#0077b6"/>
        <text y="7" fill="#fff" font-size="20" font-weight="700">4</text>
        <text y="82" fill="#005f8f" font-size="17" font-weight="700">재시험</text>
        <text y="108" fill="#2f4d63" font-size="14">같은 기준으로 재확인</text>
      </g>
      <g transform="translate(900 184)">
        <circle r="40" fill="#0077b6"/>
        <text y="7" fill="#fff" font-size="20" font-weight="700">5</text>
        <text y="82" fill="#005f8f" font-size="17" font-weight="700">Pilot 생산</text>
        <text y="108" fill="#2f4d63" font-size="14">자재·재공·작업자</text>
      </g>
      <g transform="translate(1100 184)">
        <circle r="40" fill="#0f2b46"/>
        <text y="7" fill="#fff" font-size="20" font-weight="700">6</text>
        <text y="82" fill="#005f8f" font-size="17" font-weight="700">이력·표준</text>
        <text y="108" fill="#2f4d63" font-size="14">Lot·조건·문서 반영</text>
      </g>
    </g>
    <rect x="56" y="328" width="1088" height="42" rx="8" fill="#eaf7fd"/>
    <text x="600" y="355" text-anchor="middle" fill="#16324a" font-size="16">
      핵심설비 11대와 주요 공정 13개를 관리하고, 별도 EOL 높이검사는 독립 범위로 구분
    </text>
  </g>
</svg>
