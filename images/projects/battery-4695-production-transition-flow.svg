<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">4695 배터리 조립라인 정상화와 제한 생산 체제 구축</title>
  <desc id="desc">설비 점검부터 레이저 3공정, AI Vision, X-Ray, Ready 조건과 설계 결함 설비의 생산 대응을 거쳐 100 Cell 2개 Lot 및 최종 50 Cell 연속 생산을 검증한 흐름</desc>
  <rect width="1200" height="620" fill="#EFF1ED"/>
  <g font-family="Pretendard, Noto Sans KR, Arial, sans-serif">
    <text x="54" y="50" fill="#1C232C" font-size="29" font-weight="700">4695 배터리 조립라인 — 설비 정상화와 제한 생산 체제 구축</text>
    <text x="54" y="80" fill="#5B6470" font-size="16">설비 정도와 검사조건을 실제 신제품에 맞추고, 설계 결함 설비는 표준 수동작업과 검사로 생산 범위를 확보했습니다.</text>
  </g>

