    <text x="711" y="151" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700">X-Ray</text>
    <text x="711" y="176" text-anchor="middle" fill="#E8F1F7" font-size="13">Count·ROI 재설정</text>
    <text x="711" y="196" text-anchor="middle" fill="#E8F1F7" font-size="13">해체·절단 교차검증</text>

    <rect x="820" y="120" width="170" height="92" rx="4" fill="#2B5C8A"/>
    <text x="905" y="151" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700">Ready·측정</text>
    <text x="905" y="176" text-anchor="middle" fill="#E8F1F7" font-size="13">PLC·Interlock</text>
    <text x="905" y="196" text-anchor="middle" fill="#E8F1F7" font-size="13">검사기준 표준화</text>

