<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">4695 조립라인 설비 정상화와 생산 확인</title>
  <desc id="desc">양산준비 이관 후 레이저 3설비와 검사조건을 다시 맞추고, 임시 작업이 남은 주액·Crimping·Marking을 구분해 2개 Lot와 최종 50개로 생산 가능범위를 확인한 흐름</desc>
  <rect width="1200" height="520" fill="#EFF1ED"/>
  <g font-family="Pretendard, Noto Sans KR, Arial, sans-serif">
    <text x="54" y="52" fill="#1C232C" font-size="29" font-weight="700">4695 조립라인 — 정상화한 설비와 수동작업이 남은 설비를 구분했습니다</text>
    <text x="54" y="82" fill="#5B6470" font-size="16">설비 정도와 검사방법을 실제 Cell 기준으로 다시 맞추고, 2개 Lot와 최종 50개로 생산 가능한 범위를 확인했습니다.</text>
  </g>
  <g font-family="Pretendard, Noto Sans KR, Arial, sans-serif">
    <rect x="54" y="125" width="180" height="82" rx="4" fill="#1C3F5B"/>
    <text x="144" y="157" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700">2025.02 이관</text>
    <text x="144" y="184" text-anchor="middle" fill="#DDE8EF" font-size="13">개발완료 → 양산준비</text>

    <rect x="258" y="125" width="206" height="82" rx="4" fill="#2B5C8A"/>
    <text x="361" y="151" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700">레이저 용접 3설비</text>
    <text x="361" y="176" text-anchor="middle" fill="#E8F1F7" font-size="13">정도·Align·조건 재설정</text>
    <text x="361" y="195" text-anchor="middle" fill="#E8F1F7" font-size="12">절단·해체·인장 확인</text>

    <rect x="488" y="125" width="206" height="82" rx="4" fill="#2B5C8A"/>
    <text x="591" y="151" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700">X-Ray·비전검사</text>
    <text x="591" y="176" text-anchor="middle" fill="#E8F1F7" font-size="13">자동검사 2곳 적용</text>
    <text x="591" y="195" text-anchor="middle" fill="#E8F1F7" font-size="12">3곳은 육안검사·MES 입력</text>

    <rect x="718" y="125" width="206" height="82" rx="4" fill="#2B5C8A"/>
    <text x="821" y="151" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700">Ready·측정기준</text>
    <text x="821" y="176" text-anchor="middle" fill="#E8F1F7" font-size="13">자동운전 준비조건</text>
    <text x="821" y="195" text-anchor="middle" fill="#E8F1F7" font-size="12">QCP·P-FMEA·MES</text>

    <rect x="948" y="125" width="198" height="82" rx="4" fill="#3F7D58"/>
    <text x="1047" y="151" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700">제품 재시험</text>
    <text x="1047" y="176" text-anchor="middle" fill="#EAF4ED" font-size="13">100 Cell × 2 Lot</text>
    <text x="1047" y="195" text-anchor="middle" fill="#EAF4ED" font-size="12">최종 50 Cell</text>
  </g>
  <g stroke="#AABBC7" stroke-width="4" fill="none">
    <path d="M234 166H258"/><path d="M464 166H488"/><path d="M694 166H718"/><path d="M924 166H948"/>
  </g>
  <g fill="#2B5C8A"><path d="M255 166l-10-6v12z"/><path d="M485 166l-10-6v12z"/><path d="M715 166l-10-6v12z"/><path d="M945 166l-10-6v12z"/></g>

  <g font-family="Pretendard, Noto Sans KR, Arial, sans-serif">
    <text x="54" y="262" fill="#1C232C" font-size="21" font-weight="700">생산을 위해 임시 작업이 남았던 설비</text>
    <rect x="54" y="286" width="338" height="112" rx="4" fill="#FFFFFF" stroke="#D0D7DC"/>
    <text x="75" y="318" fill="#1C232C" font-size="17" font-weight="700">E/L Filling</text>
    <text x="75" y="346" fill="#5B6470" font-size="14">Spare 교체·누액·주액량 확인</text>
    <text x="75" y="374" fill="#E2711D" font-size="13" font-weight="700">밀봉부 소재·치수 변경 필요</text>

    <rect x="431" y="286" width="338" height="112" rx="4" fill="#FFFFFF" stroke="#D0D7DC"/>
    <text x="452" y="318" fill="#1C232C" font-size="17" font-weight="700">Crimping &amp; Sizing</text>
    <text x="452" y="346" fill="#5B6470" font-size="14">윤활·속도조정·반복가압·전수검사</text>
    <text x="452" y="374" fill="#E2711D" font-size="13" font-weight="700">구동계·하중중심 구조개선 필요</text>

    <rect x="808" y="286" width="338" height="112" rx="4" fill="#FFFFFF" stroke="#D0D7DC"/>
    <text x="829" y="318" fill="#1C232C" font-size="17" font-weight="700">Marking</text>
    <text x="829" y="346" fill="#5B6470" font-size="14">Lot·QR 입력·Scanner 확인·MES 기록</text>
    <text x="829" y="374" fill="#E2711D" font-size="13" font-weight="700">신규 Pattern 등록기능 개선 필요</text>
  </g>
  <g font-family="IBM Plex Mono, Consolas, monospace">
    <rect x="54" y="438" width="1092" height="46" rx="4" fill="#1C232C"/>
    <text x="600" y="467" text-anchor="middle" fill="#FFFFFF" font-size="14">2 LOT 재시험 · 최종 50 CELL 전공정 확인 · 제한 생산 시작 판정</text>
  </g>
</svg>
