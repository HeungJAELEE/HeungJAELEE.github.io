    <text x="134" y="196" text-anchor="middle" fill="#DDE8EF" font-size="13">품질 이상 정리</text>

    <rect x="238" y="120" width="170" height="92" rx="4" fill="#2B5C8A"/>
    <text x="323" y="151" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700">Laser 3공정</text>
    <text x="323" y="176" text-anchor="middle" fill="#E8F1F7" font-size="13">정도·Align 복원</text>
    <text x="323" y="196" text-anchor="middle" fill="#E8F1F7" font-size="13">조건 최적화</text>

    <rect x="432" y="120" width="170" height="92" rx="4" fill="#2B5C8A"/>
    <text x="517" y="151" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700">AI Vision</text>
    <text x="517" y="176" text-anchor="middle" fill="#E8F1F7" font-size="13">V3·V4 자동검사</text>
    <text x="517" y="196" text-anchor="middle" fill="#E8F1F7" font-size="13">V1·V2·V5 표준 육안</text>

