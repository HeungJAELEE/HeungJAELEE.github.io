      <text y="82" fill="#1C232C" font-size="17" font-weight="700">Changed Files</text>
      <text y="107" fill="#5B6470" font-size="13">mtime Checkpoint</text>
    </g>
    <g transform="translate(459 225)">
      <circle r="44" fill="#2B5C8A"/>
      <text y="7" fill="#FFFFFF" font-size="20" font-weight="700">03</text>
      <text y="82" fill="#1C232C" font-size="17" font-weight="700">BGE-M3</text>
      <text y="107" fill="#5B6470" font-size="13">Local Embedding</text>
    </g>
    <g transform="translate(636 225)">
      <circle r="44" fill="#2B5C8A"/>
      <text y="7" fill="#FFFFFF" font-size="20" font-weight="700">04</text>
      <text y="82" fill="#1C232C" font-size="17" font-weight="700">ChromaDB</text>
      <text y="107" fill="#5B6470" font-size="13">Document Index</text>
    </g>
    <g transform="translate(813 225)">
      <circle r="44" fill="#2B5C8A"/>
