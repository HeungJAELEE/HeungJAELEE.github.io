      <text y="82" fill="#1C232C" font-size="17" font-weight="700">Markdown / YAML</text>
      <text y="107" fill="#5B6470" font-size="13">Source + Metadata</text>
    </g>
    <g transform="translate(282 225)">
      <circle r="44" fill="#2B5C8A"/>
