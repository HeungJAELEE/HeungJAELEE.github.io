<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">HeungTology incremental local RAG pipeline</title>
  <desc id="desc">Markdown and YAML source flows through changed-file detection, BGE-M3 embedding, ChromaDB, BGE reranking, and engineer source review</desc>
  <rect width="1200" height="470" fill="#EFF1ED"/>
  <g font-family="Pretendard, Noto Sans KR, Arial, sans-serif">
