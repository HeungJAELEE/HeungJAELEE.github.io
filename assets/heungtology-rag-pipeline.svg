    <text x="54" y="84" fill="#5B6470" font-size="16">Keep existing manufacturing documents, index only changes, and return ranked sources for engineer review.</text>
  </g>
  <path d="M105 225H1095" stroke="#C8D4DD" stroke-width="7" stroke-linecap="round"/>
  <g fill="#2B5C8A">
    <path d="M246 225l-12-7v14z"/><path d="M423 225l-12-7v14z"/><path d="M600 225l-12-7v14z"/><path d="M777 225l-12-7v14z"/><path d="M954 225l-12-7v14z"/>
  </g>
  <g font-family="Pretendard, Noto Sans KR, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(105 225)">
