<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
  <title id="title">Manufacturing AI five-stage safety gates</title>
  <desc id="desc">A manufacturing AI adoption flow from process problem and error cost through Product Lot Time data split, reproducible configuration, Recall and FN evaluation, and shadow testing with rollback.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L12 6 L0 12 z" fill="#46586b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg{fill:#f4f6f8}.card{fill:#fff;stroke:#6b7f92;stroke-width:2;rx:18;filter:url(#shadow)}
      .stage{font:700 18px Arial,sans-serif;letter-spacing:1.5px;fill:#5b6d80}.head{font:700 25px Arial,sans-serif;fill:#1f2c3a}
      .body{font:400 18px Arial,sans-serif;fill:#46586b}.arrow{stroke:#46586b;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .title{font:700 32px Arial,sans-serif;fill:#1f2c3a}.subtitle{font:400 20px Arial,sans-serif;fill:#586a7c}
      .foot{font:600 21px Arial,sans-serif;fill:#2b3b4c}.foot2{font:400 18px Arial,sans-serif;fill:#56697b}
    </style>
  </defs>
  <rect class="bg" width="1600" height="650" rx="28"/>
  <text x="80" y="72" class="title">Manufacturing AI Safety Gate</text>
  <text x="80" y="108" class="subtitle">모델 학습이 아니라 데이터 독립성·치명오류·현장 병행검증·복구조건으로 완료 판정</text>

  <g transform="translate(60 175)">
    <rect class="card" x="0" y="0" width="250" height="225"/>
    <text class="stage" x="25" y="42">GATE 1 · WHY</text>
    <text class="head" x="25" y="82">Problem &amp; Cost</text>
    <text class="body" x="25" y="120">CTQ·Failure Mode</text>
    <text class="body" x="25" y="150">FN·FP 비용</text>
    <text class="body" x="25" y="180">사용자·권한·ROI</text>

    <path class="arrow" d="M262 112 H306"/>
    <rect class="card" x="318" y="0" width="250" height="225"/>
    <text class="stage" x="343" y="42">GATE 2 · DATA</text>
    <text class="head" x="343" y="82">Product·Lot·Time</text>
    <text class="body" x="343" y="120">중복·Leakage 차단</text>
    <text class="body" x="343" y="150">Train·Val·Final Test</text>
    <text class="body" x="343" y="180">Domain Shift 보존</text>

    <path class="arrow" d="M580 112 H624"/>
    <rect class="card" x="636" y="0" width="250" height="225"/>
    <text class="stage" x="661" y="42">GATE 3 · CONFIG</text>
    <text class="head" x="661" y="82">Reproducibility</text>
    <text class="body" x="661" y="120">Seed·Data·Code Version</text>
    <text class="body" x="661" y="150">Model·Threshold</text>
    <text class="body" x="661" y="180">Weight·Log·Report</text>

    <path class="arrow" d="M898 112 H942"/>
    <rect class="card" x="954" y="0" width="250" height="225"/>
    <text class="stage" x="979" y="42">GATE 4 · EVAL</text>
    <text class="head" x="979" y="82">Recall &amp; Error</text>
    <text class="body" x="979" y="120">FN·FP·Confusion Matrix</text>
    <text class="body" x="979" y="150">Product·Lot·Time Slice</text>
    <text class="body" x="979" y="180">Grad-CAM·Latency</text>

    <path class="arrow" d="M1216 112 H1260"/>
    <rect class="card" x="1272" y="0" width="250" height="225"/>
    <text class="stage" x="1297" y="42">GATE 5 · DEPLOY</text>
    <text class="head" x="1297" y="82">Shadow &amp; Rollback</text>
    <text class="body" x="1297" y="120">기존 검사 병행</text>
    <text class="body" x="1297" y="150">불일치·Drift 분석</text>
    <text class="body" x="1297" y="180">Release·Hold·Rollback</text>
  </g>

  <rect x="245" y="470" width="1110" height="112" rx="18" fill="#e7ecf1" stroke="#9babba" stroke-width="2"/>
  <text x="800" y="514" text-anchor="middle" class="foot">Process Problem → Independent Data → Reproducible Run → Critical Error Review → Safe Field Release</text>
  <text x="800" y="550" text-anchor="middle" class="foot2">Accuracy 단독평가를 제조현장의 미검출·과검·Takt·복구 판단으로 전환</text>
</svg>
