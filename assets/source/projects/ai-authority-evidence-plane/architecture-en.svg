<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Five-stage architecture of the ontology- and LLM-wiki-based AI agent platform</title>
  <desc id="desc">A flow from user request through knowledge retrieval, agent composition, bounded execution, and evidence-backed read-back</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0077B6"/>
    </marker>
    <style>
      .title { font: 700 30px Mulish, Arial, sans-serif; fill: #16324A; }
      .step { font: 700 18px Mulish, Arial, sans-serif; fill: #16324A; }
      .body { font: 500 14px Mulish, Arial, sans-serif; fill: #2F4D63; }
      .rail-title { font: 700 17px Mulish, Arial, sans-serif; fill: #FFFFFF; }
      .rail-body { font: 500 14px Mulish, Arial, sans-serif; fill: #EAF7FD; }
      .num { font: 800 13px Mulish, Arial, sans-serif; fill: #FFFFFF; }
    </style>
  </defs>
  <rect width="1280" height="520" fill="#F7FAFC"/>
  <text x="40" y="56" class="title">From request to verified outcome</text>
  <text x="40" y="84" class="body">Knowledge and operating rules stay separate, then the relevant parts become one executable agent specification.</text>

  <g transform="translate(40 132)">
    <rect width="216" height="164" rx="14" fill="#FFFFFF" stroke="#D5E5EF" stroke-width="2"/>
    <circle cx="28" cy="28" r="16" fill="#0077B6"/><text x="24" y="33" class="num">1</text>
    <text x="22" y="72" class="step">User request</text>
    <text x="22" y="102" class="body">Goal, subject, output</text>
    <text x="22" y="126" class="body">Risk and effect classification</text>
  </g>
  <path d="M 260 214 L 282 214" stroke="#0077B6" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(286 132)">
    <rect width="216" height="164" rx="14" fill="#EAF7FD" stroke="#7CC9E8" stroke-width="2"/>
    <circle cx="28" cy="28" r="16" fill="#0077B6"/><text x="24" y="33" class="num">2</text>
    <text x="22" y="72" class="step">Ontology · Wiki</text>
    <text x="22" y="102" class="body">Concepts, relations, rules</text>
    <text x="22" y="126" class="body">Sources, tools, prohibitions</text>
  </g>
  <path d="M 506 214 L 528 214" stroke="#0077B6" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(532 132)">
    <rect width="216" height="164" rx="14" fill="#FFFFFF" stroke="#D5E5EF" stroke-width="2"/>
    <circle cx="28" cy="28" r="16" fill="#0077B6"/><text x="24" y="33" class="num">3</text>
    <text x="22" y="72" class="step">Agent composition</text>
    <text x="22" y="102" class="body">Role, input, tools, output</text>
    <text x="22" y="126" class="body">Stop conditions in a spec</text>
  </g>
  <path d="M 752 214 L 774 214" stroke="#0077B6" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(778 132)">
    <rect width="216" height="164" rx="14" fill="#FFFFFF" stroke="#D5E5EF" stroke-width="2"/>
    <circle cx="28" cy="28" r="16" fill="#0077B6"/><text x="24" y="33" class="num">4</text>
    <text x="22" y="72" class="step">Bounded execution</text>
    <text x="22" y="102" class="body">Only allowed data and tools</text>
    <text x="22" y="126" class="body">Approval before external effects</text>
  </g>
  <path d="M 998 214 L 1020 214" stroke="#0077B6" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(1024 132)">
    <rect width="216" height="164" rx="14" fill="#EAF7FD" stroke="#7CC9E8" stroke-width="2"/>
    <circle cx="28" cy="28" r="16" fill="#0077B6"/><text x="24" y="33" class="num">5</text>
    <text x="22" y="72" class="step">Evidence &amp; read-back</text>
    <text x="22" y="102" class="body">Record sources and effects</text>
    <text x="22" y="126" class="body">Re-read authoritative state</text>
  </g>

  <g transform="translate(40 354)">
    <rect width="1200" height="116" rx="14" fill="#0F2B46"/>
    <text x="28" y="42" class="rail-title">Authority &amp; Evidence safety layer</text>
    <text x="28" y="72" class="rail-body">Successful retrieval does not grant execution authority. Missing evidence, target identity, approval, or artifact identity stops the run.</text>
    <text x="28" y="96" class="rail-body">After an effect, the platform reads the real external state again and reconciles it with the intended result.</text>
  </g>
</svg>
