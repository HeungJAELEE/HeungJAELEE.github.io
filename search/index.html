<script>
  document.addEventListener('DOMContentLoaded', () => {
    const collapse = document.getElementById('top-nav-items');
    const toggler = document.getElementById('navbar-toggler');

    if (collapse && toggler) {
      const setExpanded = (expanded) => {
        toggler.setAttribute('aria-expanded', expanded ? 'true' : 'false');
        toggler.classList.toggle('collapsed', !expanded);
      };

      collapse.addEventListener('click', (event) => {
        const link = event.target.closest('a');
        if (link && !link.classList.contains('dropdown-toggle')) {
          setExpanded(false);
        }
      });
      collapse.addEventListener('shown.bs.collapse', () => setExpanded(true));
      collapse.addEventListener('hidden.bs.collapse', () => setExpanded(false));
    }

    const sidebarToggler = document.getElementById('sidebar-toggler');
    if (sidebarToggler) {
      sidebarToggler.addEventListener('click', () => {
        window.setTimeout(() => {
          const sidebar = document.getElementById('sidebar-section');
          sidebarToggler.setAttribute('aria-expanded', sidebar?.classList.contains('expanded') ? 'true' : 'false');
        }, 0);
      });
    }

    const scrollToTop = document.getElementById('scroll-to-top');
    if (scrollToTop) {
      scrollToTop.setAttribute('href', '#main-content');
      scrollToTop.setAttribute('aria-label', "맨 위로 이동");
    }
  });
</script>
